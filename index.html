    lastPlayed = Date.now();
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 9, motes: bankedMotes, galaxies: galaxies, lastPlayed: lastPlayed, deepestHeld: deepestHeld, names: NAMES, shop: shop, kekuSeen: kekuSeen, bestDepth: bestDepth, fragmentsKilled: fragmentsKilled, openingSeen: openingSeen, galaxyCardsSeen: galaxyCardsSeen }));
    } catch (e) {}
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2,
    hp: TUNE.PLAYER_MAX_HP,
    maxHp: TUNE.PLAYER_MAX_HP,
    flashUntil: 0,
    // Block 25 -- Acid/Ice stacks, each entry an expiry timestamp (ms, vs
    // currentTime). Throttled by lastAcidStackAt/lastIceStackAt so standing
    // in continuous contact doesn't add a stack every single frame.
    acidStackUntil: [],
    iceStackUntil: [],
    lastAcidStackAt: -Infinity,
    lastIceStackAt: -Infinity
  };
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;

  const STATE = { MAP: 'map', RUN: 'run', DEAD: 'dead', VICTORY: 'victory', LEAP: 'leap', SHOP: 'shop', OPENING: 'opening' };
  const LEAP_DURATION_MS = 1500;
  let leapFrom = 0;
  let leapTo = 0;
  let leapStartTime = 0;
  let state = STATE.MAP;

  // Which types are unlocked this wave, weighted so Hollow stays the cheap,
  // numerous baseline even once Lance/Anchor join in.
  function pickEnemyType(n) {
    const pool = [['hollow', TUNE.HOLLOW_SPAWN_WEIGHT]];
    if (n >= 4) pool.push(['lance', TUNE.LANCE_SPAWN_WEIGHT]);
    if (n >= 7) pool.push(['anchor', TUNE.ANCHOR_SPAWN_WEIGHT]);
    const total = pool.reduce((sum, [, w]) => sum + w, 0);
    let r = Math.random() * total;
    for (const [type, w] of pool) {
      if (r < w) return type;
      r -= w;
    }
    return 'hollow';
  }

  function spawnEnemy(n) {
    const pad = 40;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -pad; }
    else if (edge === 1) { x = canvas.width + pad; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + pad; }
    else { x = -pad; y = Math.random() * canvas.height; }

    const type = pickEnemyType(n);
    // Rock: "40% more HP... they do not stagger" -- the HP half of that is
    // a flat multiplier applied at spawn, same for every tier.
    const rockMult = currentElement() === 'Rock' ? TUNE.ELEMENT_ROCK_HP_MULT : 1;

    if (type === 'lance') {
      const hp = Math.floor(TUNE.LANCE_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE) * rockMult);
      const chargeSpeed = TUNE.LANCE_CHARGE_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE;
      return {
        type, x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.LANCE_RADIUS,
        chargeSpeed, phase: 'aim', phaseTimer: 0, chargeAngle: 0
      };
    }

    if (type === 'anchor') {
      const hp = Math.floor(TUNE.ANCHOR_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE) * rockMult);
      const speed = (TUNE.ANCHOR_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE) * (0.9 + Math.random() * 0.2);
      return { type, x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.ANCHOR_RADIUS, speed, turn: TUNE.ANCHOR_TURN };
    }

    const baseSpeed = TUNE.ENEMY_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE;
    const speed = baseSpeed * (0.9 + Math.random() * 0.2);   // +/-10%
    const turn = TUNE.ENEMY_TURN * (0.85 + Math.random() * 0.3);
    const hp = Math.floor(TUNE.ENEMY_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE) * rockMult);
    return { type: 'hollow', x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.ENEMY_RADIUS, speed, turn };
  }

  // Story mode's boss never scales (growth is 0 whenever n === WAVES_PER_GALAXY,
  // its only value in story mode). Endless keeps calling this with an
  // ever-larger n as depth increases, so growth -- and boss HP/speed with it --
  // never stops climbing.
  function spawnBoss(n) {
    const pad = 60;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -pad; }
    else if (edge === 1) { x = canvas.width + pad; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + pad; }
    else { x = -pad; y = Math.random() * canvas.height; }
    const growth = Math.max(0, n - TUNE.WAVES_PER_GALAXY);
    const rockMult = currentElement() === 'Rock' ? TUNE.ELEMENT_ROCK_HP_MULT : 1;
    const hp = Math.floor(TUNE.BOSS_HP * (1 + growth * TUNE.WAVE_HP_GROWTH_PER_WAVE) * rockMult);
    const speed = TUNE.BOSS_SPEED + growth * TUNE.WAVE_SPEED_PER_WAVE;
    return { x, y, vx: 0, vy: 0, angle: 0, hp, maxHp: hp, speed, radius: TUNE.BOSS_RADIUS, flashUntil: 0 };
  }

  const enemies = [];
  let spawnTimer = 0;
  let boss = null;

  // The Keku Fragment: endless-only, replaces a boss wave 3% of the time
  // (never before difficultyWave() 30). kekuFragmentTellActive is the ~4s
  // dread beat before he arrives -- enemies freeze, drone cuts out, screen
  // whites out -- then spawnKekuFragment() drops him in with no fanfare.
  let kekuFragmentTellActive = false;
  let kekuFragmentTellTimer = 0;
  let kekuFragmentHp = 0;
  let whiteoutAmount = 0;
  // fragmentsKilled is hydrated from the save further down (with
  // bankedMotes/bestDepth/etc.) -- declared here too, `let`, so it's not in
  // the temporal dead zone if anything above this point in a future edit
  // ever needs it before that hydration runs. Currently nothing does.
  let fragmentsKilled = 0;

  function startKekuFragmentTell(dw) {
    boss = null;
    kekuFragmentTellActive = true;
    kekuFragmentTellTimer = 0;
    const growth = Math.max(0, dw - TUNE.WAVES_PER_GALAXY);
    const rockMult = currentElement() === 'Rock' ? TUNE.ELEMENT_ROCK_HP_MULT : 1;
    kekuFragmentHp = Math.floor(TUNE.BOSS_HP * (1 + growth * TUNE.WAVE_HP_GROWTH_PER_WAVE) * TUNE.KEKU_HP_MULT * rockMult);
    stopDrone();   // "the music/drone cuts to silence"
  }

  function spawnKekuFragment() {
    const pad = 60;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -pad; }
    else if (edge === 1) { x = canvas.width + pad; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + pad; }
    else { x = -pad; y = Math.random() * canvas.height; }
    // No fanfare on arrival -- no sfxBossAppears(), no drone restart.
    boss = {
      x, y, vx: 0, vy: 0, angle: 0,
      hp: kekuFragmentHp, maxHp: kekuFragmentHp,
      speed: TUNE.KEKU_SPEED, radius: TUNE.KEKU_RADIUS,
      flashUntil: 0, isFragment: true
    };
  }

  // Drives the tell's ramp-up, holds the whiteout at full while he's alive,
  // and fades it back out once he (or the fight) is gone. Safe to call every
  // RUN frame unconditionally -- it's a no-op once whiteoutAmount reaches 0
  // and nothing is active.
  function updateKekuFragmentEffects(dt) {
    if (kekuFragmentTellActive) {
      kekuFragmentTellTimer += dt;
      whiteoutAmount = Math.min(1, kekuFragmentTellTimer / TUNE.KEKU_TELL_DURATION);
      if (kekuFragmentTellTimer >= TUNE.KEKU_TELL_DURATION) {
        kekuFragmentTellActive = false;
        spawnKekuFragment();
        whiteoutAmount = 1;
      }
    } else if (boss && boss.isFragment) {
      whiteoutAmount = 1;
    } else if (whiteoutAmount > 0) {
      whiteoutAmount = Math.max(0, whiteoutAmount - dt / TUNE.KEKU_WHITEOUT_FADE_S);
    }
  }

  let wave = 1;
  let waveBudget = 0;
  let waveSpawned = 0;
  let waveKilled = 0;
  let waveSpawnInterval = 0;
  let inBreather = false;
  let breatherTimer = 0;

  // Must be declared before the startWave(1) call a few lines down --
  // difficultyWave() reads these, and a `let` read before its own
  // declaration line throws (temporal dead zone), even via a function call
  // chain. That was the actual black-screen bug: these were declared much
  // later in the file (near the map-UI state), after startWave(1) already
  // ran at top level and crashed trying to read endlessMode.
  let endlessMode = false;
  let endlessDepth = 0;

  // The wave-within-galaxy number (1-10) used for the spawn/breather cycle
  // itself, vs. the number fed to difficulty formulas. In story mode they're
  // the same thing. In endless, wave keeps resetting to 1 each depth (so the
  // trash/boss cycle repeats), but this keeps climbing forever, since depth
  // never resets -- this is what makes endless difficulty scale without limit.
  function difficultyWave() {
    return endlessMode ? wave + (endlessDepth - 1) * TUNE.WAVES_PER_GALAXY : wave;
  }

  function startWave(n) {
    wave = n;
    inBreather = false;
    breatherTimer = 0;
    spawnTimer = 0;
    if (n >= TUNE.WAVES_PER_GALAXY) {
      waveBudget = 0;
      waveSpawned = 0;
      waveKilled = 0;
      const dw = difficultyWave();
      if (endlessMode && dw >= TUNE.KEKU_MIN_WAVE && Math.random() < TUNE.KEKU_CHANCE) {
        startKekuFragmentTell(dw);
      } else {
        boss = spawnBoss(dw);
        sfxBossAppears();
      }
    } else {
      boss = null;
      waveBudget = TUNE.WAVE_COUNT_BASE + difficultyWave() * TUNE.WAVE_COUNT_PER_WAVE;
      waveSpawned = 0;
      waveKilled = 0;
      const spawnWindow = TUNE.WAVE_SPAWN_DURATION * TUNE.WAVE_SPAWN_FRACTION;
      waveSpawnInterval = spawnWindow / waveBudget;
    }
    updateDroneFrequency();
  }

  function updateWave(dt) {
    if (inBreather) {
      breatherTimer -= dt;
      if (breatherTimer <= 0) {
        startWave(wave + 1);
      }
      return;
    }

    if (wave >= TUNE.WAVES_PER_GALAXY) return;   // boss wave: no trash spawning

    spawnTimer += dt;
    if (spawnTimer >= waveSpawnInterval && waveSpawned < waveBudget && enemies.length < TUNE.MAX_ENEMIES) {
      spawnTimer = 0;
      enemies.push(spawnEnemy(difficultyWave()));
      waveSpawned++;
    }

    if (waveKilled >= waveBudget && enemies.length === 0) {
      inBreather = true;
      breatherTimer = TUNE.BREATHER;
    }
  }

  startWave(1);

  const bullets = [];
  let fireTimer = 0;
  let currentTarget = null;

  const particles = [];
  let shakeStrength = 0;

  const motes = [];

  // Block 25 -- elemental effect state. One galaxy, one element, but the
  // arrays are unconditional so switching galaxies never leaves stale
  // entries from a different element behind (restart()/leap already clear
  // everything run-scoped; these follow the same rule).
  const firePools = [];        // Fire: { x, y, until }
  const plasmaTrails = [];     // Plasma: { x, y, until }
  const lightningBolts = [];   // Electric: { x1, y1, x2, y2, born, life } -- VFX only, damage already applied
  const shards = [];           // Crystal: { x, y, vx, vy, born }

  const initialSave = loadSave();
  let bankedMotes = initialSave.motes;
  let galaxies = initialSave.galaxies;
  let lastPlayed = initialSave.lastPlayed;
  let deepestHeld = initialSave.deepestHeld;
  let NAMES = initialSave.names;
  let shop = initialSave.shop;
  let kekuSeen = initialSave.kekuSeen;
  let bestDepth = initialSave.bestDepth;
  fragmentsKilled = initialSave.fragmentsKilled;
  let openingSeen = initialSave.openingSeen;
  let galaxyCardsSeen = initialSave.galaxyCardsSeen;
  let decayedGalaxyIndex = -1;
  let deathCause = null;
  let deathKekuLine = null;
  let victoryKekuLine = null;
  let kekuMessageActive = false;
  let kekuMessageText = '';
  let galaxyCardActive = false;
  let galaxyCardIndex = -1;
  // A Keku entry-line (galaxy 4/7/10 noticing) queued to show right after the
  // galaxy card is dismissed, when both are first-time on the same DESCEND.
  let pendingKekuLine = null;

  // First-time-ever check for a Keku line (0-5, matching KEKU_LINES). Marks
  // it seen and persists immediately so a refresh mid-message can't re-show it.
  function kekuLineFirstTime(index) {
    if (kekuSeen[index]) return false;
    kekuSeen[index] = true;
    saveBank();
    return true;
  }

  // Same pattern, for the galaxy entry cards (0-9, matching GALAXY_CARDS).
  function galaxyCardFirstTime(index) {
    if (galaxyCardsSeen[index]) return false;
    galaxyCardsSeen[index] = true;
    saveBank();
    return true;
  }

  if (Date.now() - lastPlayed > TUNE.DECAY_DAYS * 24 * 60 * 60 * 1000) {
    for (let i = galaxies.length - 1; i >= 0; i--) {
      if (galaxies[i] === 1) {
        galaxies[i] = 0;
        decayedGalaxyIndex = i;
        break;
      }
    }
  }
  saveBank();

  let runMotes = 0;
  let selectedGalaxy = 0;   // never null, like the reference — always a valid, unlocked focus
  let currentGalaxy = null;
  let startButtons = [];
  let descendBounds = null;
  let shopButtonBounds = null;
  let shopButtons = [];
  let shopBackBounds = null;
  let shopCloseBounds = null;
  let endlessButtonBounds = null;
  let saveMessage = '';
  let saveMessageUntil = 0;

  const MAP_TAP_THRESHOLD = 8;   // px of movement below which a touch counts as a tap, not a scroll

  // The map always opens at the edge — galaxy 1, in the dark — every time.
  let mapScroll = 0;
  let mapScrollVelocity = 0;
  let mapDragging = false;
  let mapDragStartX = 0;
  let mapDragStartY = 0;
  let mapDragLastY = 0;
  let mapDragMoved = 0;
  let corridorDebugLogged = false;

  // Per-frame friction (not dt-scaled) — matches the reference exactly, which
  // ticks its momentum once per requestAnimationFrame call, same as this loop.
  function updateMapScroll() {
    if (mapDragging) return;
    mapScroll = Math.max(0, Math.min(mapMaxZ(), mapScroll + mapScrollVelocity));
    mapScrollVelocity *= TUNE.CORRIDOR_FRICTION;
    if (Math.abs(mapScrollVelocity) < 0.02) mapScrollVelocity = 0;
  }

  const UPGRADE_DEFS = [
    { key: 'fireRate', name: 'RATE OF FIRE', desc: '-12% time between shots' },
    { key: 'damage', name: 'DAMAGE', desc: '+25% bullet damage' },
    { key: 'multishot', name: 'MULTISHOT', desc: '+1 bullet per volley (spread slightly)' },
    { key: 'pierce', name: 'PIERCE', desc: 'bullets pass through +1 enemy before dying' },
    { key: 'hull', name: 'HULL', desc: '+20 max HP, heal that amount now' },
    { key: 'reach', name: 'REACH', desc: '+25% pickup radius' }
  ];
  const upgradeLevels = { fireRate: 0, damage: 0, multishot: 0, pierce: 0, hull: 0, reach: 0 };

  let xp = 0;
  let level = 1;
  let paused = false;
  let debugPaused = false;
  let draftOptions = [];
  let cardBounds = [];
  let pauseButtonBounds = null;
  let muteButtonBounds = null;
  let resumeButtonBounds = null;
  let abandonButtonBounds = null;

  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = true; break;
      case 's': case 'S': case 'ArrowDown': keys.down = true; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = true; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
      case 'Escape': if (state === STATE.SHOP) openMap(); break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = false; break;
      case 's': case 'S': case 'ArrowDown': keys.down = false; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = false; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
    }
  });

  let dragging = false;
  let originX = 0;
  let originY = 0;
  let fingerX = 0;
  let fingerY = 0;
  let touchStartTime = 0;

  const trail = [];

  function restart() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.vx = 0;
    player.vy = 0;
    player.angle = -Math.PI / 2;
    const baseMaxHp = TUNE.PLAYER_MAX_HP + shop.hull * TUNE.SHOP_HULL_BONUS;
    player.maxHp = baseMaxHp;
    player.hp = baseMaxHp;
    player.flashUntil = 0;
    player.acidStackUntil = [];
    player.iceStackUntil = [];
    player.lastAcidStackAt = -Infinity;
    player.lastIceStackAt = -Infinity;
    enemies.length = 0;
    trail.length = 0;
    firePools.length = 0;
    plasmaTrails.length = 0;
    lightningBolts.length = 0;
    shards.length = 0;
    bullets.length = 0;
    fireTimer = 0;
    currentTarget = null;
    particles.length = 0;
    shakeStrength = 0;
    motes.length = 0;
    runMotes = 0;
    xp = 0;
    level = 1;
    paused = false;
    draftOptions = [];
    cardBounds = [];
    deathKekuLine = null;
    victoryKekuLine = null;
    kekuMessageActive = false;
    endlessMode = false;
    endlessDepth = 0;
    kekuFragmentTellActive = false;
    kekuFragmentTellTimer = 0;
    whiteoutAmount = 0;
    galaxyCardActive = false;
    galaxyCardIndex = -1;
    pendingKekuLine = null;
    for (const k of Object.keys(upgradeLevels)) upgradeLevels[k] = 0;
    startWave(1);
  }

  // The ONLY way state becomes STATE.MAP. camZ (mapScroll) and the selected
  // galaxy always reset to the edge here — no code anywhere else may set
  // mapScroll from save state, deepest held, or the previously selected galaxy.
  function openMap() {
    state = STATE.MAP;
    mapScroll = 0;
    mapScrollVelocity = 0;
    selectedGalaxy = 0;
    console.log('camZ', mapScroll, 'MAX_Z', mapMaxZ());
  }

  // Shared by the map's DESCEND button and the opening screen's "TAKE THE
  // FIRST" (which forces index 0) -- world state is already clean from the
  // most recent restart() in both cases, same invariant DESCEND always
  // relied on. Shows the galaxy's entry card on first visit; if a Keku
  // entry-line (galaxy 4/7/10 noticing) is ALSO first-time on this same
  // entry, it's queued to show right after the card is dismissed rather
  // than fighting it for the same overlay.
  function enterGalaxy(index) {
    currentGalaxy = index;
    state = STATE.RUN;
    startDrone();

    let kekuLineIndex = -1;
    if (currentGalaxy === 3) kekuLineIndex = 2;
    else if (currentGalaxy === 6) kekuLineIndex = 3;
    else if (currentGalaxy === 9) kekuLineIndex = 4;
    const kekuLineText = (kekuLineIndex >= 0 && kekuLineFirstTime(kekuLineIndex)) ? KEKU_LINES[kekuLineIndex] : null;

    if (galaxyCardFirstTime(currentGalaxy)) {
      galaxyCardActive = true;
      galaxyCardIndex = currentGalaxy;
      pendingKekuLine = kekuLineText;
    } else if (kekuLineText) {
      kekuMessageActive = true;
      kekuMessageText = kekuLineText;
    }
  }

  function handleMapTap(x, y) {
    if (shopButtonBounds &&
        x >= shopButtonBounds.x && x <= shopButtonBounds.x + shopButtonBounds.w &&
        y >= shopButtonBounds.y && y <= shopButtonBounds.y + shopButtonBounds.h) {
      state = STATE.SHOP;
      return;
    }
    if (endlessButtonBounds &&
        x >= endlessButtonBounds.x && x <= endlessButtonBounds.x + endlessButtonBounds.w &&
        y >= endlessButtonBounds.y && y <= endlessButtonBounds.y + endlessButtonBounds.h) {
      // No selection screen, no menu -- tap it and you're in, immediately.
      // World state is already clean from the most recent restart() (same
      // invariant DESCEND relies on), so this just flips mode/state and goes.
      // startWave(1) runs again here (restart() already ran it once, before
      // endlessMode was true) so waveBudget/boss/drone frequency are all
      // computed with difficultyWave() actually seeing endless mode, rather
      // than relying on wave===1 happening to zero out the difference.
      endlessMode = true;
      endlessDepth = 1;
      startWave(1);
      state = STATE.RUN;
      startDrone();
      return;
    }
    for (const btn of startButtons) {
      if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        if (btn.action === 'export') exportSave();
        else if (btn.action === 'import') importSave();
        return;
      }
    }
    if (descendBounds &&
        x >= descendBounds.x && x <= descendBounds.x + descendBounds.w &&
        y >= descendBounds.y && y <= descendBounds.y + descendBounds.h) {
      enterGalaxy(selectedGalaxy);
      return;
    }
    // Ported from the reference's tapSelect: closest projected galaxy within its
    // own hit radius wins. Locked galaxies are drawn but excluded here — not tappable.
    let best = -1;
    let bestDist = Infinity;
    for (let i = 0; i < GALAXY_DATA.length; i++) {
      if (!(i === 0 || galaxies[i - 1] === 1)) continue;
      const p = projectGalaxy(i, mapScroll);
      if (!p) continue;
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < Math.max(28, p.core * 1.4) && d < bestDist) {
        bestDist = d;
        best = i;
      }
    }
    if (best >= 0) selectedGalaxy = best;
  }

  function buyShopUpgrade(key) {
    const level = shop[key];
    if (level >= TUNE.SHOP_MAX_LEVEL) return;
    const cost = shopUpgradeCost(level + 1);
    if (bankedMotes < cost) return;
    bankedMotes -= cost;
    shop[key] = level + 1;
    saveBank();
  }

  function handleShopTap(x, y) {
    if (shopBackBounds &&
        x >= shopBackBounds.x && x <= shopBackBounds.x + shopBackBounds.w &&
        y >= shopBackBounds.y && y <= shopBackBounds.y + shopBackBounds.h) {
      openMap();
      return;
    }
    if (shopCloseBounds &&
        x >= shopCloseBounds.x && x <= shopCloseBounds.x + shopCloseBounds.w &&
        y >= shopCloseBounds.y && y <= shopCloseBounds.y + shopCloseBounds.h) {
      openMap();
      return;
    }
    for (const btn of shopButtons) {
      if (btn.buyable && x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        buyShopUpgrade(btn.key);
        return;
      }
    }
  }

  function handlePauseMenuTap(x, y) {
    if (muteButtonBounds &&
        x >= muteButtonBounds.x && x <= muteButtonBounds.x + muteButtonBounds.w &&
        y >= muteButtonBounds.y && y <= muteButtonBounds.y + muteButtonBounds.h) {
      setMuted(!muted);
      return;
    }
    if (resumeButtonBounds &&
        x >= resumeButtonBounds.x && x <= resumeButtonBounds.x + resumeButtonBounds.w &&
        y >= resumeButtonBounds.y && y <= resumeButtonBounds.y + resumeButtonBounds.h) {
      paused = false;
      return;
    }
    if (abandonButtonBounds &&
        x >= abandonButtonBounds.x && x <= abandonButtonBounds.x + abandonButtonBounds.w &&
        y >= abandonButtonBounds.y && y <= abandonButtonBounds.y + abandonButtonBounds.h) {
      paused = false;
      killPlayer('abandon');
      return;
    }
  }

  function pointerDown(x, y) {
    unlockAudio();
    if (galaxyCardActive) {
      galaxyCardActive = false;
      if (pendingKekuLine) {
        kekuMessageActive = true;
        kekuMessageText = pendingKekuLine;
        pendingKekuLine = null;
      }
      return;
    }
    if (kekuMessageActive) {
      kekuMessageActive = false;
      return;
    }
    if (state === STATE.OPENING) {
      openingSeen = true;
      saveBank();
      enterGalaxy(0);
      return;
    }
    if (state === STATE.MAP) {
      mapDragging = true;
      mapDragStartX = x;
      mapDragStartY = y;
      mapDragLastY = y;
      mapDragMoved = 0;
      mapScrollVelocity = 0;
      return;
    }
    if (state === STATE.SHOP) {
      handleShopTap(x, y);
      return;
    }
    if (state === STATE.DEAD || state === STATE.VICTORY) {
      restart();
      openMap();
      return;
    }
    if (state === STATE.LEAP) {
      return;
    }
    if (paused) {
      if (draftOptions.length > 0) {
        for (const card of cardBounds) {
          if (x >= card.x && x <= card.x + card.w && y >= card.y && y <= card.y + card.h) {
            applyUpgrade(card.key);
            break;
          }
        }
      } else {
        handlePauseMenuTap(x, y);
      }
      return;
    }
    if (pauseButtonBounds &&
        x >= pauseButtonBounds.x && x <= pauseButtonBounds.x + pauseButtonBounds.w &&
        y >= pauseButtonBounds.y && y <= pauseButtonBounds.y + pauseButtonBounds.h) {
      paused = true;
      return;
    }
    dragging = true;
    originX = x;
    originY = y;
    fingerX = x;
    fingerY = y;
    touchStartTime = currentTime;
  }
  function pointerMove(x, y) {
    if (state === STATE.MAP) {
      if (!mapDragging) return;
      const dy = y - mapDragLastY;
      mapDragLastY = y;
      mapDragMoved += Math.abs(dy);
      mapScroll = Math.max(0, Math.min(mapMaxZ(), mapScroll - dy * TUNE.CORRIDOR_SCROLL_SPEED));
      mapScrollVelocity = -dy * TUNE.CORRIDOR_SCROLL_SPEED;
      return;
    }
    if (!dragging) return;
    fingerX = x;
    fingerY = y;
  }
  function pointerUp(x, y) {
    if (state === STATE.MAP) {
      // mapDragging is only ever set true by pointerDown's OWN STATE.MAP branch.
      // If it's false here, this gesture's pointerDown fired in a different
      // state (e.g. SHOP) that has since closed back to MAP — the map never
      // owned this touch, so it must not resolve it as a tap. Without this
      // guard, tapping BACK/X in the shop (consumed on pointerDown, which
      // flips state to MAP) let the matching pointerUp fall through here and
      // re-hit the map's SHOP button at the same coordinates, reopening it
      // instantly — the flicker-and-snap-back.
      if (!mapDragging) return;
      mapDragging = false;
      if (mapDragMoved < MAP_TAP_THRESHOLD) {
        handleMapTap(x, y);
      }
      return;
    }
    dragging = false;
  }
  function pointerCancel() {
    mapDragging = false;
    dragging = false;
  }

  // Touch devices fire synthetic mousedown/mousemove/mouseup ~0-300ms after
  // the real touchstart/touchmove/touchend, for compatibility with sites that
  // only listen for mouse. Both listener sets are bound below (mouse is kept
  // for desktop testing), so every physical tap was being handled TWICE: once
  // by the real touch event, then again by the synthetic mouse event replaying
  // the same coordinates into pointerDown/pointerUp against whatever state the
  // first pass had already switched to -- e.g. opening the shop, then the
  // synthetic mousedown immediately closing it again. lastTouchTime records
  // the most recent real touch event; mouse handlers ignore anything within
  // this window of it, so only one input path is ever live at a time.
  let lastTouchTime = -Infinity;
  const TOUCH_SUPPRESS_MOUSE_MS = 500;

  canvas.addEventListener('touchstart', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerUp(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchcancel', pointerCancel, { passive: true });

  canvas.addEventListener('mousedown', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerDown(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerUp(e.clientX, e.clientY);
  });

  function getKeyVector() {
    let ix = 0, iy = 0;

    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;

    const len = Math.hypot(ix, iy);
    if (len > 1) {
      ix /= len;
      iy /= len;
    }

    return { x: ix, y: iy };
  }

  // Block 25 -- Acid/Ice stacks are arrays of expiry timestamps; pruning
  // expired entries IS reading the current stack count, so every read site
  // (the fire-rate multiplier, the speed multiplier, the HUD text) stays
  // in sync with no separate decay pass needed.
  function pruneStacks(arr) {
    let i = 0;
    while (i < arr.length) {
      if (arr[i] <= currentTime) arr.splice(i, 1); else i++;
    }
    return arr.length;
  }

  function acidFireRateMult() {
    return Math.pow(1 + TUNE.ELEMENT_ACID_FIRE_RATE_PENALTY, pruneStacks(player.acidStackUntil));
  }

  function iceSpeedMult() {
    return Math.pow(1 - TUNE.ELEMENT_ICE_SLOW_PER_STACK, pruneStacks(player.iceStackUntil));
  }

  function addAcidStack() {
    if (currentTime - player.lastAcidStackAt < TUNE.ELEMENT_ACID_STACK_INTERVAL_MS) return;
    player.lastAcidStackAt = currentTime;
    player.acidStackUntil.push(currentTime + TUNE.ELEMENT_ACID_DURATION * 1000);
    if (player.acidStackUntil.length > TUNE.ELEMENT_ACID_MAX_STACKS) player.acidStackUntil.shift();
  }

  function addIceStack() {
    if (currentTime - player.lastIceStackAt < TUNE.ELEMENT_ICE_STACK_INTERVAL_MS) return;
    player.lastIceStackAt = currentTime;
    player.iceStackUntil.push(currentTime + TUNE.ELEMENT_ICE_DURATION * 1000);
    if (player.iceStackUntil.length > TUNE.ELEMENT_ICE_MAX_STACKS) player.iceStackUntil.shift();
  }

  // Nebula: one shared drifting current, slowly rotating, felt equally by
  // the player and every enemy -- the point isn't to shove any one of them,
  // it's that nobody's movement is fully their own in this galaxy.
  function windVector() {
    const angle = (currentTime / 1000 / TUNE.ELEMENT_WIND_PERIOD) * Math.PI * 2;
    return { x: Math.cos(angle) * TUNE.ELEMENT_WIND_STRENGTH, y: Math.sin(angle) * TUNE.ELEMENT_WIND_STRENGTH };
  }

  // Black Hole: every enemy/boss within range pulls the player, falling off
  // linearly to 0 at the edge of range. Summed pull is clamped so a dense
  // crowd doesn't yank the player at an unplayable speed.
  function gravityPullOnPlayer() {
    let px = 0, py = 0;
    const pull = (e) => {
      const dx = e.x - player.x, dy = e.y - player.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0.001 && dist < TUNE.ELEMENT_GRAVITY_RADIUS) {
        const strength = TUNE.ELEMENT_GRAVITY_STRENGTH * (1 - dist / TUNE.ELEMENT_GRAVITY_RADIUS);
        px += (dx / dist) * strength;
        py += (dy / dist) * strength;
      }
    };
    for (const e of enemies) pull(e);
    if (boss) pull(boss);
    const mag = Math.hypot(px, py);
    if (mag > TUNE.ELEMENT_GRAVITY_MAX_PULL) {
      px = (px / mag) * TUNE.ELEMENT_GRAVITY_MAX_PULL;
      py = (py / mag) * TUNE.ELEMENT_GRAVITY_MAX_PULL;
    }
    return { x: px, y: py };
  }

  function update(dt) {
    const effectiveSpeed = TUNE.SPEED * Math.pow(TUNE.SHOP_VELOCITY_MULT, shop.velocity) * iceSpeedMult();
    let targetX = 0;
    let targetY = 0;

    if (dragging) {
      const toX = fingerX - originX;
      const toY = fingerY - originY;
      const len = Math.hypot(toX, toY);
      if (len > TUNE.DEADZONE) {
        targetX = (toX / len) * effectiveSpeed;
        targetY = (toY / len) * effectiveSpeed;
      }
    } else {
      const key = getKeyVector();
      targetX = key.x * effectiveSpeed;
      targetY = key.y * effectiveSpeed;
    }

    const curLen = Math.hypot(player.vx, player.vy);
    const targetLen = Math.hypot(targetX, targetY);
    let angleBetween = 0;
    if (curLen > 0.001 && targetLen > 0.001) {
      const dot = (player.vx * targetX + player.vy * targetY) / (curLen * targetLen);
      angleBetween = Math.acos(Math.max(-1, Math.min(1, dot)));
    }
    const t = Math.min(Math.max(angleBetween / TUNE.SNAP_ANGLE, 0), 1);
    const response = TUNE.RESPONSE_TURN + (TUNE.RESPONSE_SNAP - TUNE.RESPONSE_TURN) * t;

    player.vx += (targetX - player.vx) * response;
    player.vy += (targetY - player.vy) * response;

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > effectiveSpeed) {
      player.vx = (player.vx / speed) * effectiveSpeed;
      player.vy = (player.vy / speed) * effectiveSpeed;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // Block 25 -- Wind/Gravity are positional drift, not added momentum:
    // nudging x/y directly (rather than vx/vy) means they can't compound
    // into a runaway velocity frame over frame, and they still fall inside
    // the margin clamp just below like any other movement this frame.
    const el = currentElement();
    if (el === 'Wind') {
      const w = windVector();
      player.x += w.x * dt;
      player.y += w.y * dt;
    } else if (el === 'Gravity') {
      const pull = gravityPullOnPlayer();
      player.x += pull.x * dt;
      player.y += pull.y * dt;
    }

    if (player.x <= TUNE.MARGIN || player.x >= window.innerWidth - TUNE.MARGIN) {
      player.vx = 0;
    }
    player.x = Math.max(TUNE.MARGIN, Math.min(window.innerWidth - TUNE.MARGIN, player.x));

    if (player.y <= TUNE.MARGIN || player.y >= window.innerHeight - TUNE.MARGIN) {
      player.vy = 0;
    }
    player.y = Math.max(TUNE.MARGIN, Math.min(window.innerHeight - TUNE.MARGIN, player.y));

    if (speed > 0.001) {
      const targetAngle = Math.atan2(player.vy, player.vx);
      let diff = ((targetAngle - player.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      player.angle += diff * TUNE.TURN_RATE;
    }

    trail.push({ x: player.x, y: player.y });
    if (trail.length > TUNE.TRAIL_LENGTH) trail.shift();
  }

  function cellKey(cx, cy) {
    return cx + ',' + cy;
  }

  function buildGrid() {
    const grid = new Map();
    for (const e of enemies) {
      const key = cellKey(Math.floor(e.x / TUNE.SEPARATION_RADIUS), Math.floor(e.y / TUNE.SEPARATION_RADIUS));
      let bucket = grid.get(key);
      if (!bucket) {
        bucket = [];
        grid.set(key, bucket);
      }
      bucket.push(e);
    }
    return grid;
  }

  function separationFor(enemy, grid) {
    let sepX = 0;
    let sepY = 0;
    const cx = Math.floor(enemy.x / TUNE.SEPARATION_RADIUS);
    const cy = Math.floor(enemy.y / TUNE.SEPARATION_RADIUS);

    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        const bucket = grid.get(cellKey(gx, gy));
        if (!bucket) continue;
        for (const other of bucket) {
          if (other === enemy) continue;
          // Anchor is a wall that pushes the swarm aside rather than being
          // pushed — it doesn't feel Hollows shoving back at all, and every
          // other type feels an Anchor's push harder than a same-size neighbor's.
          if (enemy.type === 'anchor' && other.type === 'hollow') continue;
          const ox = enemy.x - other.x;
          const oy = enemy.y - other.y;
          const odist = Math.hypot(ox, oy);
          if (odist > 0.001 && odist < TUNE.SEPARATION_RADIUS) {
            const strength = 1 - odist / TUNE.SEPARATION_RADIUS;
            let weight = strength * strength;   // squared falloff — soft near the edge
            if (other.type === 'anchor') weight *= TUNE.ANCHOR_PUSH_MULT;
            sepX += (ox / odist) * weight;
            sepY += (oy / odist) * weight;
          }
        }
      }
    }

    const sepLen = Math.hypot(sepX, sepY);
    if (sepLen > 1) {
      sepX /= sepLen;
      sepY /= sepLen;
    }
    return { x: sepX, y: sepY };
  }

  function killPlayer(cause) {
    player.hp = 0;
    // Endless never touches the story galaxies[] array -- currentGalaxy is
    // stale/irrelevant there (left over from whatever was last selected on
    // the map), so without this guard an endless death could wrongly zero
    // out a held STORY galaxy and fire Keku's "lost" line for it.
    const lostAHeldGalaxy = !endlessMode && galaxies[currentGalaxy] === 1;
    if (lostAHeldGalaxy) {
      galaxies[currentGalaxy] = 0;
    }
    deathCause = cause;
    // Block 22's death-screen voice: story mode only, keyed directly off
    // currentGalaxy, shown on every relevant death (not first-time-gated
    // like KEKU_LINES). Galaxies 1-3 (index 0-2): he hasn't noticed the
    // player yet (that turn is KEKU_LINES[2], on first entering galaxy 4),
    // so a lit-galaxy loss there gets one generic unattributed line, and a
    // dark-galaxy death gets no line from him at all -- just the plain
    // "THE DARK HOLDS." Galaxy 4 on: a unique attributed line per galaxy.
    if (cause === 'abandon' || endlessMode) {
      deathKekuLine = null;
    } else if (!lostAHeldGalaxy) {
      deathKekuLine = { text: KEKU_DEATH_DARK, attributed: false, isDarkLine: true };
    } else if (currentGalaxy <= 2) {
      deathKekuLine = { text: KEKU_DEATH_LIT_EARLY, attributed: false };
    } else {
      deathKekuLine = { text: KEKU_DEATH_LIT_LATE[currentGalaxy - 3], attributed: true };
    }
    state = STATE.DEAD;
    stopDrone();
    bankedMotes += Math.round(runMotes);
    saveBank();
  }

  // Shared by Hollow and Anchor — chase the player, blended with separation
  // from the rest of the swarm. Only enemy.speed/turn/radius differ per type.
  function updateChaseEnemy(enemy, dt, grid) {
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dlen = Math.hypot(dx, dy);

    let chaseX = 0;
    let chaseY = 0;
    if (dlen > 0.001) {
      chaseX = dx / dlen;
      chaseY = dy / dlen;
    }

    const sep = separationFor(enemy, grid);

    const touchDist = TUNE.PLAYER_RADIUS + enemy.radius;
    const chaseWeight = dlen <= touchDist ? TUNE.CHASE_WEIGHT_TOUCHING : TUNE.CHASE_WEIGHT;

    let desiredX = chaseX * chaseWeight + sep.x * TUNE.SEPARATION_WEIGHT;
    let desiredY = chaseY * chaseWeight + sep.y * TUNE.SEPARATION_WEIGHT;
    const desiredLen = Math.hypot(desiredX, desiredY);
    if (desiredLen > 0.001) {
      desiredX /= desiredLen;
      desiredY /= desiredLen;
    }

    const targetX = desiredX * enemy.speed;
    const targetY = desiredY * enemy.speed;

    enemy.vx += (targetX - enemy.vx) * enemy.turn;
    enemy.vy += (targetY - enemy.vy) * enemy.turn;

    const speed = Math.hypot(enemy.vx, enemy.vy);
    if (speed > enemy.speed) {
      enemy.vx = (enemy.vx / speed) * enemy.speed;
      enemy.vy = (enemy.vy / speed) * enemy.speed;
    }

    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;

    if (speed > 0.001) {
      enemy.angle = Math.atan2(enemy.vy, enemy.vx);
    }
  }

  // Lance: aim (fast turn, tracks the player) -> charge (heading locks, hard
  // accelerate, cannot turn, sails past on a miss) -> pause (stops dead) -> aim.
  function updateLanceEnemy(enemy, dt) {
    enemy.phaseTimer -= dt;

    if (enemy.phase === 'aim') {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const targetAngle = Math.atan2(dy, dx);
      let diff = ((targetAngle - enemy.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      enemy.angle += diff * TUNE.LANCE_AIM_TURN;
      enemy.vx += (0 - enemy.vx) * 0.2;
      enemy.vy += (0 - enemy.vy) * 0.2;
      if (Math.abs(diff) < TUNE.LANCE_AIM_ALIGN) {
        enemy.phase = 'charge';
        enemy.phaseTimer = TUNE.LANCE_CHARGE_DURATION;
        enemy.chargeAngle = enemy.angle;   // locked — nothing below reads player position again
      }
    } else if (enemy.phase === 'charge') {
      const speed = Math.hypot(enemy.vx, enemy.vy);
      if (speed < enemy.chargeSpeed) {
        enemy.vx += Math.cos(enemy.chargeAngle) * TUNE.LANCE_CHARGE_ACCEL * dt;
        enemy.vy += Math.sin(enemy.chargeAngle) * TUNE.LANCE_CHARGE_ACCEL * dt;
      }
      const newSpeed = Math.hypot(enemy.vx, enemy.vy);
      if (newSpeed > enemy.chargeSpeed) {
        enemy.vx = (enemy.vx / newSpeed) * enemy.chargeSpeed;
        enemy.vy = (enemy.vy / newSpeed) * enemy.chargeSpeed;
      }
      if (enemy.phaseTimer <= 0) {
        enemy.phase = 'pause';
        enemy.phaseTimer = TUNE.LANCE_PAUSE_DURATION;
      }
    } else {   // pause
      enemy.vx += (0 - enemy.vx) * 0.15;
      enemy.vy += (0 - enemy.vy) * 0.15;
      if (enemy.phaseTimer <= 0) {
        enemy.phase = 'aim';
      }
    }

    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;
  }

  function updateEnemies(dt) {
    const grid = buildGrid();
    const el = currentElement();
    const w = el === 'Wind' ? windVector() : null;

    for (const enemy of enemies) {
      if (enemy.type === 'lance') {
        updateLanceEnemy(enemy, dt);
      } else {
        updateChaseEnemy(enemy, dt, grid);
      }

      // Nebula: the same current pushing the player pushes every enemy too.
      if (w) {
        enemy.x += w.x * dt;
        enemy.y += w.y * dt;
      }

      // Radiation: standing within the aura hurts continuously, whether or
      // not the player is actually touching the enemy.
      if (el === 'Radiation' && state === STATE.RUN) {
        const rdist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        if (rdist < TUNE.ELEMENT_RADIATION_RADIUS + enemy.radius) {
          player.hp -= TUNE.ELEMENT_RADIATION_DPS * dt;
          player.flashUntil = currentTime + TUNE.HIT_FLASH_MS;
          sfxPlayerHit();
          if (player.hp <= 0 && state === STATE.RUN) killPlayer('enemy');
        }
      }

      const touchDist = TUNE.PLAYER_RADIUS + enemy.radius;
      const pdx = enemy.x - player.x;
      const pdy = enemy.y - player.y;
      const pdist = Math.hypot(pdx, pdy);
      if (pdist < touchDist) {
        if (pdist > 0.001) {
          enemy.x = player.x + (pdx / pdist) * touchDist;
          enemy.y = player.y + (pdy / pdist) * touchDist;
        } else {
          enemy.x = player.x + touchDist;
          enemy.y = player.y;
        }

        player.hp -= TUNE.CONTACT_DPS * dt;
        player.flashUntil = currentTime + TUNE.HIT_FLASH_MS;
        sfxPlayerHit();
        if (el === 'Acid') addAcidStack();
        if (el === 'Ice') addIceStack();
        // Radiation above can already have killed the player this same
        // frame (a separate damage source in this same loop) -- guard
        // against calling killPlayer twice, which would double-bank motes.
        if (player.hp <= 0 && state === STATE.RUN) {
          killPlayer('enemy');
        }
      }
    }
  }

  function updateBoss(dt) {
    if (!boss) return;

    const dx = player.x - boss.x;
    const dy = player.y - boss.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.001) {
      boss.vx = (dx / dist) * boss.speed;
      boss.vy = (dy / dist) * boss.speed;
      boss.angle = Math.atan2(dy, dx);
    }

    // Block 25 -- the element applies to every enemy in the galaxy,
    // including the boss: same Wind current, same Radiation aura, same
    // Acid/Ice stacks on contact.
    const el = currentElement();
    if (el === 'Wind') {
      const w = windVector();
      boss.x += w.x * dt;
      boss.y += w.y * dt;
    }
    if (el === 'Radiation' && state === STATE.RUN) {
      const rdist = Math.hypot(boss.x - player.x, boss.y - player.y);
      if (rdist < TUNE.ELEMENT_RADIATION_RADIUS + boss.radius) {
        player.hp -= TUNE.ELEMENT_RADIATION_DPS * dt;
        player.flashUntil = currentTime + TUNE.HIT_FLASH_MS;
        sfxPlayerHit();
        if (player.hp <= 0 && state === STATE.RUN) killPlayer('boss');
      }
    }

    const touchDist = TUNE.PLAYER_RADIUS + boss.radius;
    const pdx = boss.x - player.x;
    const pdy = boss.y - player.y;
    const pdist = Math.hypot(pdx, pdy);
    if (pdist < touchDist) {
      if (pdist > 0.001) {
        boss.x = player.x + (pdx / pdist) * touchDist;
        boss.y = player.y + (pdy / pdist) * touchDist;
      } else {
        boss.x = player.x + touchDist;
        boss.y = player.y;
      }

      player.hp -= (boss.isFragment ? TUNE.KEKU_DPS : TUNE.BOSS_DPS) * dt;
      player.flashUntil = currentTime + TUNE.HIT_FLASH_MS;
      sfxPlayerHit();
      if (el === 'Acid') addAcidStack();
      if (el === 'Ice') addIceStack();
      if (player.hp <= 0 && state === STATE.RUN) {
        killPlayer('boss');
      }
    }
  }

  function nearestEnemy() {
    let nearest = null;
    let nearestDist = Infinity;
    for (const enemy of enemies) {
      const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = enemy;
      }
    }
    if (boss) {
      const dist = Math.hypot(boss.x - player.x, boss.y - player.y);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = boss;
      }
    }
    return nearest;
  }

  function acquireTarget() {
    if (currentTarget && !currentTarget.dead) {
      const dist = Math.hypot(currentTarget.x - player.x, currentTarget.y - player.y);
      if (dist <= TUNE.TARGET_DROP_RANGE) {
        return currentTarget;
      }
    }
    currentTarget = nearestEnemy();
    return currentTarget;
  }

  function segmentHitsCircle(px, py, nx, ny, cx, cy, r) {
    const dx = nx - px, dy = ny - py;
    const fx = px - cx, fy = py - cy;
    const a = dx * dx + dy * dy;
    if (a < 0.0001) return (fx * fx + fy * fy) <= r * r;
    let t = -(fx * dx + fy * dy) / a;
    t = Math.max(0, Math.min(1, t));
    const cxp = px + dx * t - cx;
    const cyp = py + dy * t - cy;
    return (cxp * cxp + cyp * cyp) <= r * r;
  }

  function spawnParticle(x, y, vx, vy, life, color, size) {
    particles.push({ x, y, vx, vy, born: currentTime, life, color, size });
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      if (currentTime - particles[i].born >= particles[i].life) particles.splice(i, 1);
    }
  }

  // Block 25 -- the part of a regular (non-boss) kill's reward that a
  // chain-killed enemy also needs (motes, wave count, sound), split out of
  // the main bullet-hit death block so applyElementalDeathEffect's Electric
  // branch can grant it too without duplicating the boss-transition logic.
  function regularEnemyDeathRewards(enemy) {
    sfxKill();
    motes.push({ x: enemy.x, y: enemy.y, speed: 0 });
    waveKilled++;
  }

  function spawnDeathBurst(x, y) {
    shakeStrength = TUNE.SHAKE_KILL;
    const burstColor = hslToRgbTriplet(currentHue(), 0.8, 0.6);
    const count = 6 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const burstSpeed = 60 + Math.random() * 80;
      spawnParticle(x, y, Math.cos(angle) * burstSpeed, Math.sin(angle) * burstSpeed, TUNE.DEATH_BURST_MS, burstColor, 2.5);
    }
    if (navigator.vibrate) navigator.vibrate(10);
  }

  // Fires once, at the moment `entity` dies. `viaChain` is only true for a
  // target killed BY an Electric chain -- it exists purely to stop that
  // chain from re-triggering itself and cascading unboundedly; every other
  // element doesn't care and ignores it.
  function applyElementalDeathEffect(entity, viaChain) {
    const el = currentElement();

    if (el === 'Fire') {
      firePools.push({ x: entity.x, y: entity.y, until: currentTime + TUNE.ELEMENT_FIRE_POOL_DURATION * 1000 });
    } else if (el === 'Electric' && !viaChain) {
      const targets = enemies.filter((e) => e !== entity && !e.dead);
      targets.sort((a, b) => Math.hypot(a.x - entity.x, a.y - entity.y) - Math.hypot(b.x - entity.x, b.y - entity.y));
      for (const t of targets.slice(0, TUNE.ELEMENT_CHAIN_TARGETS)) {
        if (Math.hypot(t.x - entity.x, t.y - entity.y) > TUNE.ELEMENT_CHAIN_RANGE) continue;
        lightningBolts.push({ x1: entity.x, y1: entity.y, x2: t.x, y2: t.y, born: currentTime, life: TUNE.ELEMENT_CHAIN_BOLT_MS });
        t.hp -= TUNE.ELEMENT_CHAIN_DAMAGE;
        t.flashUntil = currentTime + TUNE.HIT_FLASH_MS;
        if (t.hp <= 0 && !t.dead) {
          // "Free chain kills" -- a regular death, single-hop only (never
          // re-chains, never touches the boss-transition branch since a
          // chain target is always drawn from `enemies`, never `boss`).
          t.dead = true;
          spawnDeathBurst(t.x, t.y);
          regularEnemyDeathRewards(t);
        }
      }
    } else if (el === 'Crystal') {
      for (let i = 0; i < TUNE.ELEMENT_SHARD_COUNT; i++) {
        const angle = (Math.PI * 2 / TUNE.ELEMENT_SHARD_COUNT) * i + Math.random() * 0.5;
        shards.push({
          x: entity.x, y: entity.y,
          vx: Math.cos(angle) * TUNE.ELEMENT_SHARD_SPEED,
          vy: Math.sin(angle) * TUNE.ELEMENT_SHARD_SPEED,
          born: currentTime
        });
      }
    }
  }

  // Everything elemental that isn't tied to a discrete kill or contact
  // event: ground hazards (Fire/Plasma) ticking damage while the player
  // stands in them, Crystal shards flying and expiring, Radiation's aura,
  // and decaying the purely-visual lightning bolts. Runs every RUN frame.
  function updateElementalEffects(dt) {
    for (let i = firePools.length - 1; i >= 0; i--) {
      const pool = firePools[i];
      if (currentTime >= pool.until) { firePools.splice(i, 1); continue; }
      if (Math.hypot(player.x - pool.x, player.y - pool.y) < TUNE.ELEMENT_FIRE_POOL_RADIUS) {
        player.hp -= TUNE.ELEMENT_FIRE_POOL_DPS * dt;
        player.flashUntil = currentTime + TUNE.HIT_FLASH_MS;
        sfxPlayerHit();
        if (player.hp <= 0 && state === STATE.RUN) killPlayer('enemy');
      }
    }

    if (currentElement() === 'Plasma') {
      for (const enemy of enemies) {
        enemy.plasmaTimer = (enemy.plasmaTimer || 0) - dt;
        if (enemy.plasmaTimer <= 0) {
          enemy.plasmaTimer = TUNE.ELEMENT_PLASMA_TRAIL_INTERVAL;
          plasmaTrails.push({ x: enemy.x, y: enemy.y, until: currentTime + TUNE.ELEMENT_PLASMA_TRAIL_DURATION * 1000 });
        }
      }
      if (boss) {
        boss.plasmaTimer = (boss.plasmaTimer || 0) - dt;
        if (boss.plasmaTimer <= 0) {
          boss.plasmaTimer = TUNE.ELEMENT_PLASMA_TRAIL_INTERVAL;
          plasmaTrails.push({ x: boss.x, y: boss.y, until: currentTime + TUNE.ELEMENT_PLASMA_TRAIL_DURATION * 1000 });
        }
      }
    }
    for (let i = plasmaTrails.length - 1; i >= 0; i--) {
      const seg = plasmaTrails[i];
      if (currentTime >= seg.until) { plasmaTrails.splice(i, 1); continue; }
      if (Math.hypot(player.x - seg.x, player.y - seg.y) < TUNE.ELEMENT_PLASMA_TRAIL_RADIUS) {
        player.hp -= TUNE.ELEMENT_PLASMA_TRAIL_DPS * dt;
        player.flashUntil = currentTime + TUNE.HIT_FLASH_MS;
        sfxPlayerHit();
        if (player.hp <= 0 && state === STATE.RUN) killPlayer('enemy');
      }
    }

    for (let i = shards.length - 1; i >= 0; i--) {
      const s = shards[i];
      if ((currentTime - s.born) / 1000 >= TUNE.ELEMENT_SHARD_LIFE) { shards.splice(i, 1); continue; }
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if (Math.hypot(player.x - s.x, player.y - s.y) < TUNE.PLAYER_RADIUS + TUNE.ELEMENT_SHARD_RADIUS) {
        shards.splice(i, 1);
        player.hp -= TUNE.ELEMENT_SHARD_DAMAGE;
        player.flashUntil = currentTime + TUNE.HIT_FLASH_MS;
        sfxPlayerHit();
        if (player.hp <= 0 && state === STATE.RUN) killPlayer('enemy');
      }
    }

    for (let i = lightningBolts.length - 1; i >= 0; i--) {
      if (currentTime - lightningBolts[i].born >= lightningBolts[i].life) lightningBolts.splice(i, 1);
    }
  }

  function checkLevelUp() {
    const need = TUNE.XP_BASE + level * TUNE.XP_GROWTH;
    if (xp >= need) {
      xp -= need;
      level++;
      sfxLevelUp();
      openDraft();
    }
  }

  function openDraft() {
    paused = true;
    const pool = UPGRADE_DEFS.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pool[i];
      pool[i] = pool[j];
      pool[j] = tmp;
    }
    draftOptions = pool.slice(0, 3);
  }

  function applyUpgrade(key) {
    upgradeLevels[key]++;
    if (key === 'hull') {
      player.maxHp += TUNE.HULL_HP_BONUS;

    }
    paused = false;
