<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Afterlight</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Renders a fatal error straight to the canvas instead of failing silently.
  // Independent of every other const/let in this file (grabs its own canvas
  // reference) so it still works no matter how early in init things blew up --
  // in particular, it must not depend on the `canvas`/`ctx` consts declared
  // further down, since an error before that point would otherwise crash the
  // error handler itself.
  function drawFatalError(err) {
    try {
      const c = document.getElementById('c');
      const errCtx = c.getContext('2d');
      const w = c.width || window.innerWidth;
      const h = c.height || window.innerHeight;
      errCtx.fillStyle = '#000';
      errCtx.fillRect(0, 0, w, h);
      errCtx.fillStyle = '#f44';
      errCtx.font = '12px monospace';
      errCtx.textAlign = 'left';
      const msg = String((err && err.stack) || err);
      msg.split('\n').forEach((line, i) => {
        errCtx.fillText(line.slice(0, 70), 10, 30 + i * 16);
      });
    } catch (e2) {
      // Nothing more we can do without a console.
    }
  }

  try {

  const DEBUG = true;

  const TUNE = {
    SPEED: 159.9,
    RESPONSE_TURN: 0.22,   // gentle turns: weight and carve
    RESPONSE_SNAP: 0.9,    // hard turns / reversals: near-instant
    SNAP_ANGLE: 1.4,       // radians (~80deg). At/above this, use full SNAP.
    DEADZONE: 2,
    TURN_RATE: 0.15,
    PULSE_DURATION: 151.2,
    MARGIN: 24,
    ENEMY_SPEED: 110,
    ENEMY_TURN: 0.045,     // LOW. The enemy commits to a heading and
                           // overshoots when the player cuts across it.
    MAX_ENEMIES: 102,
    SEPARATION_RADIUS: 28, // px — how close before they push apart
    CHASE_WEIGHT: 1,
    SEPARATION_WEIGHT: 1.2, // higher = they spread more, chase less
    PLAYER_RADIUS: 14,
    ENEMY_RADIUS: 9,
    CHASE_WEIGHT_TOUCHING: 0.6, // lower pull once already at contact — press, don't grind
    PLAYER_MAX_HP: 100,
    CONTACT_DPS: 12,
    FIRE_RATE: 0.45,
    BULLET_SPEED: 405.6,
    BULLET_DAMAGE: 10,
    ENEMY_MAX_HP: 10,
    BULLET_RADIUS: 4,
    HOLLOW_SPAWN_WEIGHT: 3,  // relative odds among currently-unlocked types — cheap, numerous
    LANCE_SPAWN_WEIGHT: 1,
    ANCHOR_SPAWN_WEIGHT: 1,
    LANCE_RADIUS: 6,
    LANCE_MAX_HP: 4,
    LANCE_AIM_TURN: 0.18,        // fast — snaps to face the player while lining up
    LANCE_AIM_ALIGN: 0.05,       // radians of heading error allowed before it commits to the charge
    LANCE_CHARGE_SPEED: 300,
    LANCE_CHARGE_ACCEL: 900,     // px/s^2 while committed — hits top speed fast, then flies dead straight
    LANCE_CHARGE_DURATION: 0.9,  // seconds locked on the charge heading, long enough to overshoot badly
    LANCE_PAUSE_DURATION: 0.7,   // seconds standing still after a charge before it lines up again
    ANCHOR_RADIUS: 22,
    ANCHOR_MAX_HP: 90,
    ANCHOR_SPEED: 45,
    ANCHOR_TURN: 0.03,
    ANCHOR_PUSH_MULT: 2.5,       // how much harder an Anchor shoves OTHER enemies away vs. a same-size neighbor
    TARGET_DROP_RANGE: 420, // px — drop target beyond this
    HIT_FLASH_MS: 9.6768,
    KNOCKBACK: 9.78112,
    SHAKE_KILL: 0.4356,
    SHAKE_DECAY_MS: 80,
    DEATH_BURST_MS: 400,
    IMPACT_SPARK_MS: 79.2,
    TRAIL_LENGTH: 10,
    THUMB_OFFSET: 15,
    PICKUP_RADIUS: 90,
    MOTE_SPEED: 340,   // how fast a mote flies to the player
    MOTE_ACCEL: 1.8,   // it accelerates as it closes
    XP_BASE: 5,
    XP_GROWTH: 3,
    FIRE_RATE_MULT: 0.88,   // -12% time between shots per Rate-of-Fire level
    DAMAGE_MULT: 1.25,      // +25% bullet damage per Damage level
    REACH_MULT: 1.25,       // +25% pickup radius per Reach level
    HULL_HP_BONUS: 20,
    MULTISHOT_SPREAD: 0.09, // radians between adjacent bullets in a volley
    XP_BAR_HEIGHT: 5,
    BOSS_HP: 1800,
    BOSS_SPEED: 81,
    BOSS_DPS: 30,
    BOSS_RADIUS: 30,
    WAVES_PER_GALAXY: 10,
    BREATHER: 3.04,          // seconds of no spawns between waves
    WAVE_COUNT_BASE: 12,     // enemy count = WAVE_COUNT_BASE + n * WAVE_COUNT_PER_WAVE
    WAVE_COUNT_PER_WAVE: 8,
    WAVE_HP_GROWTH_PER_WAVE: 0.35,  // enemy HP = ENEMY_MAX_HP * (1 + n * this)
    WAVE_SPEED_PER_WAVE: 4,         // enemy speed = ENEMY_SPEED + n * this
    WAVE_SPAWN_DURATION: 20.4,      // seconds a wave's arrivals are paced across
    WAVE_SPAWN_FRACTION: 0.6,       // fraction of WAVE_SPAWN_DURATION the budget arrives over
    DECAY_DAYS: 7,                  // days of absence before the deepest held galaxy reverts to dark
    CORRIDOR_FOV: 520,              // perspective strength: scale = CORRIDOR_FOV / z. Renamed from the
                                     // old MAP_FOV so a stale localStorage TUNE override from the earlier
                                     // FOV/(FOV+depth) corridor (same key, different formula) can't reapply.
    CORRIDOR_SPACING: 460,               // world-units between galaxies along the corridor's depth axis
    CORRIDOR_NEAR_Z: 260,                // camera sits this far in front of galaxy 1
    CORRIDOR_CORE: 46,                   // base core radius at scale 1
    CORRIDOR_GLOW: 190,                  // base glow radius at scale 1
    CORRIDOR_DRIFT: 90,                  // lateral wander so the corridor reads as space, not a pipe
    CORRIDOR_SCROLL_SPEED: 1.9,
    CORRIDOR_FRICTION: 0.92,
    KEKU_WORLD_Z: 8280,             // Keku's fixed depth, well beyond galaxy 10 (world Z 4140) — he never gets close
    COST_BASE: 40,                  // shop upgrade level n costs COST_BASE * (n ^ COST_POWER)
    COST_POWER: 1.6,
    SHOP_MAX_LEVEL: 20,
    SHOP_HULL_BONUS: 10,             // +10 max HP per level
    SHOP_VELOCITY_MULT: 1.04,        // +4% move speed per level
    SHOP_CALIBRE_MULT: 1.06,         // +6% bullet damage per level
    SHOP_CADENCE_MULT: 0.96,         // -4% time between shots per level
    SHOP_REACH_MULT: 1.08,           // +8% pickup radius per level
    SHOP_SALVAGE_MULT: 1.05,         // +5% motes collected per level
    SFX_MASTER_GAIN: 0.5,            // overall mixer level — everything else is relative to this
    SFX_FIRE_GAIN: 0.05,
    SFX_HIT_GAIN: 0.08,
    SFX_KILL_GAIN: 0.12,
    SFX_MOTE_GAIN: 0.06,
    SFX_PLAYER_HIT_GAIN: 0.18,
    SFX_LEVELUP_GAIN: 0.22,
    SFX_BOSS_APPEAR_GAIN: 0.25,
    SFX_BOSS_DIE_GAIN: 0.3,
    SFX_GALAXY_CLEAR_GAIN: 0.3,
    SFX_DRONE_GAIN: 0.035,
    SFX_DRONE_BASE_FREQ: 55,         // Hz, wave 1
    SFX_DRONE_WAVE_RISE: 1.8,        // Hz added per wave number — tension without the player knowing why
    SFX_PLAYER_HIT_COOLDOWN_MS: 220, // min gap between thuds while contact damage is continuous
    SFX_MOTE_COMBO_RESET_MS: 420     // gap that resets the pickup pitch-climb
  };

  const TUNE_DEFAULTS = { ...TUNE };
  const TUNE_KEY = 'afterlight.tune.v1';

  function loadTuneOverrides() {
    try {
      const raw = localStorage.getItem(TUNE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      }
    } catch (e) {}
    return null;
  }

  function saveTuneOverrides() {
    try {
      const overrides = {};
      for (const k of Object.keys(TUNE)) {
        if (TUNE[k] !== TUNE_DEFAULTS[k]) overrides[k] = TUNE[k];
      }
      localStorage.setItem(TUNE_KEY, JSON.stringify(overrides));
    } catch (e) {}
  }

  const tuneOverrides = loadTuneOverrides();
  if (tuneOverrides) {
    for (const k of Object.keys(tuneOverrides)) {
      if (Object.prototype.hasOwnProperty.call(TUNE, k) && typeof tuneOverrides[k] === 'number') {
        TUNE[k] = tuneOverrides[k];
      }
    }
  }

  // ---- Audio: everything below is synthesised via Web Audio API. No audio
  // files, no assets — keeps the game single-file and zero-dependency.
  // Browsers block audio until a user gesture, so the context is created
  // lazily (unlockAudio, called from pointerDown) rather than at load time.
  let audioCtx = null;
  let masterGain = null;
  let noiseBuffer = null;
  let droneOsc1 = null;
  let droneOsc2 = null;
  let droneGain = null;
  let moteComboCount = 0;
  let lastMoteSoundTime = -Infinity;
  let lastPlayerHitSoundTime = -Infinity;

  function ensureAudio() {
    if (audioCtx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = TUNE.SFX_MASTER_GAIN;
    masterGain.connect(audioCtx.destination);
  }

  function unlockAudio() {
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended' && !document.hidden) audioCtx.resume();
  }

  const MUTE_KEY = 'afterlight.muted.v1';
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}

  function setMuted(v) {
    muted = v;
    try { localStorage.setItem(MUTE_KEY, v ? '1' : '0'); } catch (e) {}
  }

  // Called once a frame from loop() — the single place that decides whether
  // sound should be audible right now. Ducks to silence on mute or on ANY
  // pause (the level-up draft freezing the run counts too — "audio must stop
  // when the game is paused" is unconditional, not just for a manual pause
  // menu). Backgrounding is handled separately, by fully suspending the
  // context on visibilitychange, since Web Audio keeps rendering in a hidden
  // tab even though requestAnimationFrame stops — gain alone wouldn't do it.
  function syncAudioGain() {
    if (!masterGain || !audioCtx) return;
    const target = (muted || paused) ? 0 : TUNE.SFX_MASTER_GAIN;
    masterGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.05);
  }

  document.addEventListener('visibilitychange', () => {
    if (!audioCtx) return;
    if (document.hidden) {
      audioCtx.suspend();
    } else if (!muted) {
      audioCtx.resume();
    }
  });

  function getNoiseBuffer() {
    if (noiseBuffer) return noiseBuffer;
    const len = audioCtx.sampleRate * 1;
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return noiseBuffer;
  }

  // A single oscillator with an attack/decay gain envelope. Every tonal SFX
  // (blips, pops, chimes, swells) is one or more calls to this.
  function playTone(opts) {
    if (!audioCtx) return;
    const duration = opts.duration;
    const t0 = audioCtx.currentTime + (opts.delay || 0);
    const osc = audioCtx.createOscillator();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(opts.freq, t0);
    if (opts.freqEnd !== undefined) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.freqEnd), t0 + duration);
    }
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(opts.gain, t0 + (opts.attack || 0.002));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  // A filtered burst of the shared noise buffer. Used for percussive/textured
  // SFX (hit ticks, the low thud, the boss collapse) that a pure oscillator
  // can't sell on its own.
  function playNoiseBurst(opts) {
    if (!audioCtx) return;
    const duration = opts.duration;
    const t0 = audioCtx.currentTime + (opts.delay || 0);
    const src = audioCtx.createBufferSource();
    src.buffer = getNoiseBuffer();
    src.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = opts.filterType || 'bandpass';
    filter.Q.value = opts.q !== undefined ? opts.q : 1;
    filter.frequency.setValueAtTime(opts.filterFreq, t0);
    if (opts.filterFreqEnd !== undefined) {
      filter.frequency.exponentialRampToValueAtTime(Math.max(1, opts.filterFreqEnd), t0 + duration);
    }
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(opts.gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    src.start(t0);
    src.stop(t0 + duration + 0.05);
  }

  // Fire: very short dry click, 3x/sec by default — pitch wobbles a little
  // each shot so it reads as a weapon, not a machine gun.
  function sfxFire() {
    if (!audioCtx) return;
    const freq = 820 + (Math.random() * 2 - 1) * 70;
    playTone({ freq, freqEnd: freq * 0.85, type: 'square', duration: 0.035, gain: TUNE.SFX_FIRE_GAIN, attack: 0.001 });
  }

  function sfxHit() {
    playNoiseBurst({ duration: 0.035, gain: TUNE.SFX_HIT_GAIN, filterFreq: 3200, filterFreqEnd: 2200, q: 3 });
  }

  function sfxKill() {
    playTone({ freq: 560, freqEnd: 160, type: 'triangle', duration: 0.14, gain: TUNE.SFX_KILL_GAIN, attack: 0.002 });
  }

  // Mote pickup: tiny ping, climbing in pitch on a quick combo, reset after
  // a pause — currentTime is the shared rAF clock already used everywhere
  // else in the file for cooldowns, not a fresh time source.
  function sfxMotePickup() {
    if (currentTime - lastMoteSoundTime > TUNE.SFX_MOTE_COMBO_RESET_MS) moteComboCount = 0;
    lastMoteSoundTime = currentTime;
    const freq = 1100 + Math.min(moteComboCount, 14) * 55;
    moteComboCount++;
    playTone({ freq, type: 'sine', duration: 0.05, gain: TUNE.SFX_MOTE_GAIN, attack: 0.001 });
  }

  // Player hit: low and ugly on purpose — two barely-detuned low oscillators
  // beating against each other, plus a low noise thump. Self-throttled since
  // contact damage fires every frame while touching; without the cooldown
  // this would buzz instead of thud.
  function sfxPlayerHit() {
    if (currentTime - lastPlayerHitSoundTime < TUNE.SFX_PLAYER_HIT_COOLDOWN_MS) return;
    lastPlayerHitSoundTime = currentTime;
    playTone({ freq: 130, freqEnd: 55, type: 'sine', duration: 0.16, gain: TUNE.SFX_PLAYER_HIT_GAIN, attack: 0.001 });
    playTone({ freq: 136, freqEnd: 58, type: 'sine', duration: 0.16, gain: TUNE.SFX_PLAYER_HIT_GAIN * 0.7, attack: 0.001 });
    playNoiseBurst({ duration: 0.1, gain: TUNE.SFX_PLAYER_HIT_GAIN * 0.5, filterFreq: 220, filterFreqEnd: 120, q: 0.7, filterType: 'lowpass' });
  }

  // Level up: bright rising two-note chime, plus a quiet high shimmer on the
  // second note. This is a reward — the loudest of the small SFX.
  function sfxLevelUp() {
    playTone({ freq: 523, type: 'triangle', duration: 0.14, gain: TUNE.SFX_LEVELUP_GAIN, attack: 0.005 });
    playTone({ freq: 784, type: 'triangle', duration: 0.22, gain: TUNE.SFX_LEVELUP_GAIN, attack: 0.005, delay: 0.1 });
    playTone({ freq: 1568, type: 'sine', duration: 0.22, gain: TUNE.SFX_LEVELUP_GAIN * 0.4, attack: 0.005, delay: 0.1 });
  }

  function sfxBossAppears() {
    playTone({ freq: 42, freqEnd: 55, type: 'sine', duration: 1.6, gain: TUNE.SFX_BOSS_APPEAR_GAIN, attack: 0.9 });
    playTone({ freq: 84, freqEnd: 110, type: 'sine', duration: 1.6, gain: TUNE.SFX_BOSS_APPEAR_GAIN * 0.3, attack: 0.9 });
  }

  // Boss dies: a downward-sweeping tone layered with lowpass-filtered noise
  // whose cutoff also falls — a long collapse, not a pop.
  function sfxBossDies() {
    playTone({ freq: 220, freqEnd: 30, type: 'sawtooth', duration: 2.2, gain: TUNE.SFX_BOSS_DIE_GAIN * 0.5, attack: 0.01 });
    playNoiseBurst({ duration: 2.2, gain: TUNE.SFX_BOSS_DIE_GAIN, filterFreq: 900, filterFreqEnd: 60, q: 0.8, filterType: 'lowpass' });
  }

  // Galaxy cleared: a warm rising triad, delayed slightly so it glows in
  // over the tail of the boss collapse rather than fighting it. The best
  // sound in the game — relief, not a fanfare.
  function sfxGalaxyCleared() {
    const delay = 0.5;
    const notes = [220, 330, 440];
    for (const n of notes) {
      playTone({ freq: n * 0.85, freqEnd: n, type: 'sine', duration: 3, gain: TUNE.SFX_GALAXY_CLEAR_GAIN / notes.length, attack: 1.2, delay });
    }
  }

  // Ambient drone: quiet, under the whole run, pitch creeping up with the
  // wave number. Persistent oscillators (not one-shots) started/stopped
  // around a run rather than played per-frame.
  function startDrone() {
    ensureAudio();
    if (!audioCtx || droneOsc1) return;
    droneGain = audioCtx.createGain();
    droneGain.gain.value = 0;
    droneGain.connect(masterGain);

    droneOsc1 = audioCtx.createOscillator();
    droneOsc1.type = 'sine';
    droneOsc2 = audioCtx.createOscillator();
    droneOsc2.type = 'sine';
    droneOsc2.detune.value = 6;   // slight beating for texture — still a quiet drone, not a chord

    droneOsc1.connect(droneGain);
    droneOsc2.connect(droneGain);

    updateDroneFrequency();
    droneOsc1.start();
    droneOsc2.start();

    droneGain.gain.linearRampToValueAtTime(TUNE.SFX_DRONE_GAIN, audioCtx.currentTime + 1.5);
  }

  function updateDroneFrequency() {
    if (!droneOsc1 || !audioCtx) return;
    const freq = TUNE.SFX_DRONE_BASE_FREQ + difficultyWave() * TUNE.SFX_DRONE_WAVE_RISE;
    const t = audioCtx.currentTime;
    droneOsc1.frequency.setTargetAtTime(freq, t, 0.8);
    droneOsc2.frequency.setTargetAtTime(freq * 1.5, t, 0.8);
  }

  function stopDrone() {
    if (!droneOsc1 || !audioCtx) return;
    const t = audioCtx.currentTime;
    droneGain.gain.cancelScheduledValues(t);
    droneGain.gain.setValueAtTime(droneGain.gain.value, t);
    droneGain.gain.linearRampToValueAtTime(0, t + 0.6);
    droneOsc1.stop(t + 0.7);
    droneOsc2.stop(t + 0.7);
    droneOsc1 = null;
    droneOsc2 = null;
    droneGain = null;
  }

  const SAVE_KEY = 'afterlight.save.v1';

  const GALAXY_DATA = [
    { star: 'Red Giant', element: 'Fire', hue: 11 },
    { star: 'Binary Pair', element: 'Plasma', hue: 35 },
    { star: 'Pulsar', element: 'Electric', hue: 59 },
    { star: 'Brown Dwarf', element: 'Acid', hue: 82 },
    { star: 'White Dwarf', element: 'Crystal', hue: 170 },
    { star: 'Dead Star', element: 'Ice', hue: 195 },
    { star: 'Blue Supergiant', element: 'Radiation', hue: 220 },
    { star: 'Black Hole', element: 'Gravity', hue: 261 },
    { star: 'Neutron Star', element: 'Rock', hue: 284 },
    { star: 'Nebula', element: 'Wind', hue: 320 }
  ];

  function galaxyPalette(index) {
    const data = GALAXY_DATA[index];
    const depth = index / (GALAXY_DATA.length - 1);   // 0 at galaxy 1, 1 at galaxy 10
    return {
      star: data.star,
      element: data.element,
      hue: data.hue,
      accent: `hsl(${data.hue}, 85%, 55%)`,
      bossAccent: `hsl(${data.hue}, 100%, 72%)`,       // hotter, brighter
      background: `hsl(${data.hue}, 60%, ${(depth * 10).toFixed(2)}%)`
    };
  }

  // --- Map corridor: ported 1:1 from the reference implementation. Perspective,
  // colour, drift and the mouth's white treatment must not be reinterpreted. ---

  function mapMaxZ() {
    return TUNE.CORRIDOR_SPACING * (GALAXY_DATA.length - 1);
  }

  // Each galaxy gets a fixed lateral offset so the corridor drifts like space,
  // not a straight pipe. Scaled by perspective scale in projectGalaxy.
  function mapOffset(index) {
    return {
      x: Math.sin(index * 1.31) * TUNE.CORRIDOR_DRIFT,
      y: Math.cos(index * 0.87) * TUNE.CORRIDOR_DRIFT * 0.55
    };
  }

  // scale = FOV / z. Pure 1/depth perspective — not FOV/(FOV+depth). Returns
  // null (cull) once a galaxy is behind or on top of the camera.
  function projectGalaxy(index, scroll) {
    const z = TUNE.CORRIDOR_NEAR_Z + index * TUNE.CORRIDOR_SPACING - scroll;
    if (z <= 40) return null;
    const s = TUNE.CORRIDOR_FOV / z;
    const off = mapOffset(index);
    return {
      x: canvas.width / 2 + off.x * s,
      y: canvas.height / 2 + off.y * s,
      s: s,
      core: TUNE.CORRIDOR_CORE * s,
      glow: TUNE.CORRIDOR_GLOW * s
    };
  }

  function mapHsla(h, s, l, a) {
    return `hsla(${h}, ${s}%, ${l}%, ${a})`;
  }

  const DEFAULT_GALAXY_NAMES = ['Edge', 'Cinder Reach', 'Hollow Drift', 'Ashfall Void', 'Pale March', 'Ember Rift', 'Quiet Expanse', 'Dusk Haven', 'Last Light', 'Centre'];

  function defaultNames() {
    return {
      galaxies: DEFAULT_GALAXY_NAMES.slice(),
      boss: 'The Maw',
      enemy: 'The Hollow'
    };
  }

  function readNames(obj) {
    const dn = defaultNames();
    if (!obj || typeof obj !== 'object') return dn;
    return {
      galaxies: Array.isArray(obj.galaxies) && obj.galaxies.length === 10 ? obj.galaxies.slice() : dn.galaxies,
      boss: typeof obj.boss === 'string' ? obj.boss : dn.boss,
      enemy: typeof obj.enemy === 'string' ? obj.enemy : dn.enemy
    };
  }

  const SHOP_DEFS = [
    { key: 'hull', name: 'HULL', desc: '+10 max HP per level' },
    { key: 'velocity', name: 'VELOCITY', desc: '+4% move speed per level' },
    { key: 'calibre', name: 'CALIBRE', desc: '+6% bullet damage per level' },
    { key: 'cadence', name: 'CADENCE', desc: '-4% time between shots per level' },
    { key: 'reach', name: 'REACH', desc: '+8% pickup radius per level' },
    { key: 'salvage', name: 'SALVAGE', desc: '+5% motes collected per level' }
  ];

  function shopUpgradeCost(level) {
    return Math.round(TUNE.COST_BASE * Math.pow(level, TUNE.COST_POWER));
  }

  function defaultShop() {
    return { hull: 0, velocity: 0, calibre: 0, cadence: 0, reach: 0, salvage: 0 };
  }

  function readShop(obj) {
    const ds = defaultShop();
    if (!obj || typeof obj !== 'object') return ds;
    const result = {};
    for (const k of Object.keys(ds)) {
      result[k] = typeof obj[k] === 'number' && obj[k] >= 0 && obj[k] <= TUNE.SHOP_MAX_LEVEL ? obj[k] : ds[k];
    }
    return result;
  }

  // Keku's lines, in trigger order. Indices 0 and 1 are NOT addressed to the
  // player -- he doesn't know they exist yet, so no attribution is shown for
  // them (drawDead/drawVictory render these unlabelled, like an overheard
  // fragment). Index 2 is the turn: the first line that speaks TO the player,
  // and every line from there on is attributed and direct. Each shows once
  // ever, tracked in kekuSeen and persisted in the save (defaultKekuSeen/
  // readKekuSeen below), not per-run.
  const KEKU_LINES = [
    "A small light kindled somewhere it shouldn't have. It will gutter. They always do, eventually.",
    "The dark doesn't take back what's lost. It was only ever borrowed.",
    '...oh. You. I felt you the way I feel warmth, right before I finish it.',
    "You still burn. I can feel what that costs you.",
    "There's nothing left to watch but you now. I don't mind waiting.",
    'Ten lights. When there was endless.'
  ];

  function defaultKekuSeen() {
    return [false, false, false, false, false, false];
  }

  function readKekuSeen(obj) {
    const ds = defaultKekuSeen();
    if (!Array.isArray(obj) || obj.length !== ds.length) return ds;
    return ds.map((_, i) => obj[i] === true);
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && obj.v === 7 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return {
            v: 7,
            motes: obj.motes,
            galaxies: obj.galaxies,
            lastPlayed: typeof obj.lastPlayed === 'number' ? obj.lastPlayed : Date.now(),
            deepestHeld: typeof obj.deepestHeld === 'number' ? obj.deepestHeld : obj.galaxies.filter((g) => g === 1).length,
            names: readNames(obj.names),
            shop: readShop(obj.shop),
            kekuSeen: readKekuSeen(obj.kekuSeen),
            bestDepth: typeof obj.bestDepth === 'number' ? obj.bestDepth : 0
          };
        }
        if (obj && obj.v === 6 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return {
            v: 7,
            motes: obj.motes,
            galaxies: obj.galaxies,
            lastPlayed: typeof obj.lastPlayed === 'number' ? obj.lastPlayed : Date.now(),
            deepestHeld: typeof obj.deepestHeld === 'number' ? obj.deepestHeld : obj.galaxies.filter((g) => g === 1).length,
            names: readNames(obj.names),
            shop: readShop(obj.shop),
            kekuSeen: readKekuSeen(obj.kekuSeen),
            bestDepth: 0
          };
        }
        if (obj && obj.v === 5 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return {
            v: 7,
            motes: obj.motes,
            galaxies: obj.galaxies,
            lastPlayed: typeof obj.lastPlayed === 'number' ? obj.lastPlayed : Date.now(),
            deepestHeld: typeof obj.deepestHeld === 'number' ? obj.deepestHeld : obj.galaxies.filter((g) => g === 1).length,
            names: readNames(obj.names),
            shop: readShop(obj.shop),
            kekuSeen: defaultKekuSeen(),
            bestDepth: 0
          };
        }
        if (obj && obj.v === 4 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return {
            v: 7,
            motes: obj.motes,
            galaxies: obj.galaxies,
            lastPlayed: typeof obj.lastPlayed === 'number' ? obj.lastPlayed : Date.now(),
            deepestHeld: typeof obj.deepestHeld === 'number' ? obj.deepestHeld : obj.galaxies.filter((g) => g === 1).length,
            names: readNames(obj.names),
            shop: defaultShop(),
            kekuSeen: defaultKekuSeen(),
            bestDepth: 0
          };
        }
        if (obj && obj.v === 3 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return {
            v: 7,
            motes: obj.motes,
            galaxies: obj.galaxies,
            lastPlayed: typeof obj.lastPlayed === 'number' ? obj.lastPlayed : Date.now(),
            deepestHeld: typeof obj.deepestHeld === 'number' ? obj.deepestHeld : obj.galaxies.filter((g) => g === 1).length,
            names: defaultNames(),
            shop: defaultShop(),
            kekuSeen: defaultKekuSeen(),
            bestDepth: 0
          };
        }
        if (obj && obj.v === 2 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return { v: 7, motes: obj.motes, galaxies: obj.galaxies, lastPlayed: Date.now(), deepestHeld: obj.galaxies.filter((g) => g === 1).length, names: defaultNames(), shop: defaultShop(), kekuSeen: defaultKekuSeen(), bestDepth: 0 };
        }
        if (obj && obj.v === 1 && typeof obj.motes === 'number') {
          return { v: 7, motes: obj.motes, galaxies: new Array(10).fill(0), lastPlayed: Date.now(), deepestHeld: 0, names: defaultNames(), shop: defaultShop(), kekuSeen: defaultKekuSeen(), bestDepth: 0 };
        }
      }
    } catch (e) {}
    return { v: 7, motes: 0, galaxies: new Array(10).fill(0), lastPlayed: Date.now(), deepestHeld: 0, names: defaultNames(), shop: defaultShop(), kekuSeen: defaultKekuSeen(), bestDepth: 0 };
  }

  function saveBank() {
    lastPlayed = Date.now();
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 7, motes: bankedMotes, galaxies: galaxies, lastPlayed: lastPlayed, deepestHeld: deepestHeld, names: NAMES, shop: shop, kekuSeen: kekuSeen, bestDepth: bestDepth }));
    } catch (e) {}
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2,
    hp: TUNE.PLAYER_MAX_HP,
    maxHp: TUNE.PLAYER_MAX_HP
  };
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;

  const STATE = { MAP: 'map', RUN: 'run', DEAD: 'dead', VICTORY: 'victory', LEAP: 'leap', SHOP: 'shop' };
  const LEAP_DURATION_MS = 1500;
  let leapFrom = 0;
  let leapTo = 0;
  let leapStartTime = 0;
  let state = STATE.MAP;

  // Which types are unlocked this wave, weighted so Hollow stays the cheap,
  // numerous baseline even once Lance/Anchor join in.
  function pickEnemyType(n) {
    const pool = [['hollow', TUNE.HOLLOW_SPAWN_WEIGHT]];
    if (n >= 4) pool.push(['lance', TUNE.LANCE_SPAWN_WEIGHT]);
    if (n >= 7) pool.push(['anchor', TUNE.ANCHOR_SPAWN_WEIGHT]);
    const total = pool.reduce((sum, [, w]) => sum + w, 0);
    let r = Math.random() * total;
    for (const [type, w] of pool) {
      if (r < w) return type;
      r -= w;
    }
    return 'hollow';
  }

  function spawnEnemy(n) {
    const pad = 40;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -pad; }
    else if (edge === 1) { x = canvas.width + pad; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + pad; }
    else { x = -pad; y = Math.random() * canvas.height; }

    const type = pickEnemyType(n);

    if (type === 'lance') {
      const hp = Math.floor(TUNE.LANCE_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE));
      const chargeSpeed = TUNE.LANCE_CHARGE_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE;
      return {
        type, x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.LANCE_RADIUS,
        chargeSpeed, phase: 'aim', phaseTimer: 0, chargeAngle: 0
      };
    }

    if (type === 'anchor') {
      const hp = Math.floor(TUNE.ANCHOR_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE));
      const speed = (TUNE.ANCHOR_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE) * (0.9 + Math.random() * 0.2);
      return { type, x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.ANCHOR_RADIUS, speed, turn: TUNE.ANCHOR_TURN };
    }

    const baseSpeed = TUNE.ENEMY_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE;
    const speed = baseSpeed * (0.9 + Math.random() * 0.2);   // +/-10%
    const turn = TUNE.ENEMY_TURN * (0.85 + Math.random() * 0.3);
    const hp = Math.floor(TUNE.ENEMY_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE));
    return { type: 'hollow', x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.ENEMY_RADIUS, speed, turn };
  }

  // Story mode's boss never scales (growth is 0 whenever n === WAVES_PER_GALAXY,
  // its only value in story mode). Endless keeps calling this with an
  // ever-larger n as depth increases, so growth -- and boss HP/speed with it --
  // never stops climbing.
  function spawnBoss(n) {
    const pad = 60;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -pad; }
    else if (edge === 1) { x = canvas.width + pad; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + pad; }
    else { x = -pad; y = Math.random() * canvas.height; }
    const growth = Math.max(0, n - TUNE.WAVES_PER_GALAXY);
    const hp = Math.floor(TUNE.BOSS_HP * (1 + growth * TUNE.WAVE_HP_GROWTH_PER_WAVE));
    const speed = TUNE.BOSS_SPEED + growth * TUNE.WAVE_SPEED_PER_WAVE;
    return { x, y, vx: 0, vy: 0, angle: 0, hp, maxHp: hp, speed, flashUntil: 0 };
  }

  const enemies = [];
  let spawnTimer = 0;
  let boss = null;

  let wave = 1;
  let waveBudget = 0;
  let waveSpawned = 0;
  let waveKilled = 0;
  let waveSpawnInterval = 0;
  let inBreather = false;
  let breatherTimer = 0;

  // Must be declared before the startWave(1) call a few lines down --
  // difficultyWave() reads these, and a `let` read before its own
  // declaration line throws (temporal dead zone), even via a function call
  // chain. That was the actual black-screen bug: these were declared much
  // later in the file (near the map-UI state), after startWave(1) already
  // ran at top level and crashed trying to read endlessMode.
  let endlessMode = false;
  let endlessDepth = 0;

  // The wave-within-galaxy number (1-10) used for the spawn/breather cycle
  // itself, vs. the number fed to difficulty formulas. In story mode they're
  // the same thing. In endless, wave keeps resetting to 1 each depth (so the
  // trash/boss cycle repeats), but this keeps climbing forever, since depth
  // never resets -- this is what makes endless difficulty scale without limit.
  function difficultyWave() {
    return endlessMode ? wave + (endlessDepth - 1) * TUNE.WAVES_PER_GALAXY : wave;
  }

  function startWave(n) {
    wave = n;
    inBreather = false;
    breatherTimer = 0;
    spawnTimer = 0;
    if (n >= TUNE.WAVES_PER_GALAXY) {
      waveBudget = 0;
      waveSpawned = 0;
      waveKilled = 0;
      boss = spawnBoss(difficultyWave());
      sfxBossAppears();
    } else {
      boss = null;
      waveBudget = TUNE.WAVE_COUNT_BASE + difficultyWave() * TUNE.WAVE_COUNT_PER_WAVE;
      waveSpawned = 0;
      waveKilled = 0;
      const spawnWindow = TUNE.WAVE_SPAWN_DURATION * TUNE.WAVE_SPAWN_FRACTION;
      waveSpawnInterval = spawnWindow / waveBudget;
    }
    updateDroneFrequency();
  }

  function updateWave(dt) {
    if (inBreather) {
      breatherTimer -= dt;
      if (breatherTimer <= 0) {
        startWave(wave + 1);
      }
      return;
    }

    if (wave >= TUNE.WAVES_PER_GALAXY) return;   // boss wave: no trash spawning

    spawnTimer += dt;
    if (spawnTimer >= waveSpawnInterval && waveSpawned < waveBudget && enemies.length < TUNE.MAX_ENEMIES) {
      spawnTimer = 0;
      enemies.push(spawnEnemy(difficultyWave()));
      waveSpawned++;
    }

    if (waveKilled >= waveBudget && enemies.length === 0) {
      inBreather = true;
      breatherTimer = TUNE.BREATHER;
    }
  }

  startWave(1);

  const bullets = [];
  let fireTimer = 0;
  let currentTarget = null;

  const particles = [];
  let shakeStrength = 0;

  const motes = [];
  const initialSave = loadSave();
  let bankedMotes = initialSave.motes;
  let galaxies = initialSave.galaxies;
  let lastPlayed = initialSave.lastPlayed;
  let deepestHeld = initialSave.deepestHeld;
  let NAMES = initialSave.names;
  let shop = initialSave.shop;
  let kekuSeen = initialSave.kekuSeen;
  let bestDepth = initialSave.bestDepth;
  let decayedGalaxyIndex = -1;
  let deathCause = null;
  let deathKekuLine = null;
  let victoryKekuLine = null;
  let kekuMessageActive = false;
  let kekuMessageText = '';

  // First-time-ever check for a Keku line (0-5, matching KEKU_LINES). Marks
  // it seen and persists immediately so a refresh mid-message can't re-show it.
  function kekuLineFirstTime(index) {
    if (kekuSeen[index]) return false;
    kekuSeen[index] = true;
    saveBank();
    return true;
  }

  if (Date.now() - lastPlayed > TUNE.DECAY_DAYS * 24 * 60 * 60 * 1000) {
    for (let i = galaxies.length - 1; i >= 0; i--) {
      if (galaxies[i] === 1) {
        galaxies[i] = 0;
        decayedGalaxyIndex = i;
        break;
      }
    }
  }
  saveBank();

  let runMotes = 0;
  let selectedGalaxy = 0;   // never null, like the reference — always a valid, unlocked focus
  let currentGalaxy = null;
  let startButtons = [];
  let descendBounds = null;
  let shopButtonBounds = null;
  let shopButtons = [];
  let shopBackBounds = null;
  let shopCloseBounds = null;
  let endlessButtonBounds = null;
  let saveMessage = '';
  let saveMessageUntil = 0;

  const MAP_TAP_THRESHOLD = 8;   // px of movement below which a touch counts as a tap, not a scroll

  // The map always opens at the edge — galaxy 1, in the dark — every time.
  let mapScroll = 0;
  let mapScrollVelocity = 0;
  let mapDragging = false;
  let mapDragStartX = 0;
  let mapDragStartY = 0;
  let mapDragLastY = 0;
  let mapDragMoved = 0;
  let corridorDebugLogged = false;

  // Per-frame friction (not dt-scaled) — matches the reference exactly, which
  // ticks its momentum once per requestAnimationFrame call, same as this loop.
  function updateMapScroll() {
    if (mapDragging) return;
    mapScroll = Math.max(0, Math.min(mapMaxZ(), mapScroll + mapScrollVelocity));
    mapScrollVelocity *= TUNE.CORRIDOR_FRICTION;
    if (Math.abs(mapScrollVelocity) < 0.02) mapScrollVelocity = 0;
  }

  const UPGRADE_DEFS = [
    { key: 'fireRate', name: 'RATE OF FIRE', desc: '-12% time between shots' },
    { key: 'damage', name: 'DAMAGE', desc: '+25% bullet damage' },
    { key: 'multishot', name: 'MULTISHOT', desc: '+1 bullet per volley (spread slightly)' },
    { key: 'pierce', name: 'PIERCE', desc: 'bullets pass through +1 enemy before dying' },
    { key: 'hull', name: 'HULL', desc: '+20 max HP, heal that amount now' },
    { key: 'reach', name: 'REACH', desc: '+25% pickup radius' }
  ];
  const upgradeLevels = { fireRate: 0, damage: 0, multishot: 0, pierce: 0, hull: 0, reach: 0 };

  let xp = 0;
  let level = 1;
  let paused = false;
  let debugPaused = false;
  let draftOptions = [];
  let cardBounds = [];
  let pauseButtonBounds = null;
  let muteButtonBounds = null;
  let resumeButtonBounds = null;

  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = true; break;
      case 's': case 'S': case 'ArrowDown': keys.down = true; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = true; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
      case 'Escape': if (state === STATE.SHOP) openMap(); break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = false; break;
      case 's': case 'S': case 'ArrowDown': keys.down = false; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = false; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
    }
  });

  let dragging = false;
  let originX = 0;
  let originY = 0;
  let fingerX = 0;
  let fingerY = 0;
  let touchStartTime = 0;

  const trail = [];

  function restart() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.vx = 0;
    player.vy = 0;
    player.angle = -Math.PI / 2;
    const baseMaxHp = TUNE.PLAYER_MAX_HP + shop.hull * TUNE.SHOP_HULL_BONUS;
    player.maxHp = baseMaxHp;
    player.hp = baseMaxHp;
    enemies.length = 0;
    trail.length = 0;
    bullets.length = 0;
    fireTimer = 0;
    currentTarget = null;
    particles.length = 0;
    shakeStrength = 0;
    motes.length = 0;
    runMotes = 0;
    xp = 0;
    level = 1;
    paused = false;
    draftOptions = [];
    cardBounds = [];
    deathKekuLine = null;
    victoryKekuLine = null;
    kekuMessageActive = false;
    endlessMode = false;
    endlessDepth = 0;
    for (const k of Object.keys(upgradeLevels)) upgradeLevels[k] = 0;
    startWave(1);
  }

  // The ONLY way state becomes STATE.MAP. camZ (mapScroll) and the selected
  // galaxy always reset to the edge here — no code anywhere else may set
  // mapScroll from save state, deepest held, or the previously selected galaxy.
  function openMap() {
    state = STATE.MAP;
    mapScroll = 0;
    mapScrollVelocity = 0;
    selectedGalaxy = 0;
    console.log('camZ', mapScroll, 'MAX_Z', mapMaxZ());
  }

  function handleMapTap(x, y) {
    if (shopButtonBounds &&
        x >= shopButtonBounds.x && x <= shopButtonBounds.x + shopButtonBounds.w &&
        y >= shopButtonBounds.y && y <= shopButtonBounds.y + shopButtonBounds.h) {
      state = STATE.SHOP;
      return;
    }
    if (endlessButtonBounds &&
        x >= endlessButtonBounds.x && x <= endlessButtonBounds.x + endlessButtonBounds.w &&
        y >= endlessButtonBounds.y && y <= endlessButtonBounds.y + endlessButtonBounds.h) {
      // No selection screen, no menu -- tap it and you're in, immediately.
      // World state is already clean from the most recent restart() (same
      // invariant DESCEND relies on), so this just flips mode/state and goes.
      // startWave(1) runs again here (restart() already ran it once, before
      // endlessMode was true) so waveBudget/boss/drone frequency are all
      // computed with difficultyWave() actually seeing endless mode, rather
      // than relying on wave===1 happening to zero out the difference.
      endlessMode = true;
      endlessDepth = 1;
      startWave(1);
      state = STATE.RUN;
      startDrone();
      return;
    }
    for (const btn of startButtons) {
      if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        if (btn.action === 'export') exportSave();
        else if (btn.action === 'import') importSave();
        return;
      }
    }
    if (descendBounds &&
        x >= descendBounds.x && x <= descendBounds.x + descendBounds.w &&
        y >= descendBounds.y && y <= descendBounds.y + descendBounds.h) {
      currentGalaxy = selectedGalaxy;
      state = STATE.RUN;
      startDrone();
      // Keku notices at galaxy 4 (index 3), grows concerned at galaxy 7
      // (index 6), and is waiting by galaxy 10 (index 9) -- each only the
      // first time that galaxy is ever entered.
      let kekuLineIndex = -1;
      if (currentGalaxy === 3) kekuLineIndex = 2;
      else if (currentGalaxy === 6) kekuLineIndex = 3;
      else if (currentGalaxy === 9) kekuLineIndex = 4;
      if (kekuLineIndex >= 0 && kekuLineFirstTime(kekuLineIndex)) {
        kekuMessageActive = true;
        kekuMessageText = KEKU_LINES[kekuLineIndex];
      }
      return;
    }
    // Ported from the reference's tapSelect: closest projected galaxy within its
    // own hit radius wins. Locked galaxies are drawn but excluded here — not tappable.
    let best = -1;
    let bestDist = Infinity;
    for (let i = 0; i < GALAXY_DATA.length; i++) {
      if (!(i === 0 || galaxies[i - 1] === 1)) continue;
      const p = projectGalaxy(i, mapScroll);
      if (!p) continue;
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < Math.max(28, p.core * 1.4) && d < bestDist) {
        bestDist = d;
        best = i;
      }
    }
    if (best >= 0) selectedGalaxy = best;
  }

  function buyShopUpgrade(key) {
    const level = shop[key];
    if (level >= TUNE.SHOP_MAX_LEVEL) return;
    const cost = shopUpgradeCost(level + 1);
    if (bankedMotes < cost) return;
    bankedMotes -= cost;
    shop[key] = level + 1;
    saveBank();
  }

  function handleShopTap(x, y) {
    if (shopBackBounds &&
        x >= shopBackBounds.x && x <= shopBackBounds.x + shopBackBounds.w &&
        y >= shopBackBounds.y && y <= shopBackBounds.y + shopBackBounds.h) {
      openMap();
      return;
    }
    if (shopCloseBounds &&
        x >= shopCloseBounds.x && x <= shopCloseBounds.x + shopCloseBounds.w &&
        y >= shopCloseBounds.y && y <= shopCloseBounds.y + shopCloseBounds.h) {
      openMap();
      return;
    }
    for (const btn of shopButtons) {
      if (btn.buyable && x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        buyShopUpgrade(btn.key);
        return;
      }
    }
  }

  function handlePauseMenuTap(x, y) {
    if (muteButtonBounds &&
        x >= muteButtonBounds.x && x <= muteButtonBounds.x + muteButtonBounds.w &&
        y >= muteButtonBounds.y && y <= muteButtonBounds.y + muteButtonBounds.h) {
      setMuted(!muted);
      return;
    }
    if (resumeButtonBounds &&
        x >= resumeButtonBounds.x && x <= resumeButtonBounds.x + resumeButtonBounds.w &&
        y >= resumeButtonBounds.y && y <= resumeButtonBounds.y + resumeButtonBounds.h) {
      paused = false;
      return;
    }
  }

  function pointerDown(x, y) {
    unlockAudio();
    if (kekuMessageActive) {
      kekuMessageActive = false;
      return;
    }
    if (state === STATE.MAP) {
      mapDragging = true;
      mapDragStartX = x;
      mapDragStartY = y;
      mapDragLastY = y;
      mapDragMoved = 0;
      mapScrollVelocity = 0;
      return;
    }
    if (state === STATE.SHOP) {
      handleShopTap(x, y);
      return;
    }
    if (state === STATE.DEAD || state === STATE.VICTORY) {
      restart();
      openMap();
      return;
    }
    if (state === STATE.LEAP) {
      return;
    }
    if (paused) {
      if (draftOptions.length > 0) {
        for (const card of cardBounds) {
          if (x >= card.x && x <= card.x + card.w && y >= card.y && y <= card.y + card.h) {
            applyUpgrade(card.key);
            break;
          }
        }
      } else {
        handlePauseMenuTap(x, y);
      }
      return;
    }
    if (pauseButtonBounds &&
        x >= pauseButtonBounds.x && x <= pauseButtonBounds.x + pauseButtonBounds.w &&
        y >= pauseButtonBounds.y && y <= pauseButtonBounds.y + pauseButtonBounds.h) {
      paused = true;
      return;
    }
    dragging = true;
    originX = x;
    originY = y;
    fingerX = x;
    fingerY = y;
    touchStartTime = currentTime;
  }
  function pointerMove(x, y) {
    if (state === STATE.MAP) {
      if (!mapDragging) return;
      const dy = y - mapDragLastY;
      mapDragLastY = y;
      mapDragMoved += Math.abs(dy);
      mapScroll = Math.max(0, Math.min(mapMaxZ(), mapScroll - dy * TUNE.CORRIDOR_SCROLL_SPEED));
      mapScrollVelocity = -dy * TUNE.CORRIDOR_SCROLL_SPEED;
      return;
    }
    if (!dragging) return;
    fingerX = x;
    fingerY = y;
  }
  function pointerUp(x, y) {
    if (state === STATE.MAP) {
      // mapDragging is only ever set true by pointerDown's OWN STATE.MAP branch.
      // If it's false here, this gesture's pointerDown fired in a different
      // state (e.g. SHOP) that has since closed back to MAP — the map never
      // owned this touch, so it must not resolve it as a tap. Without this
      // guard, tapping BACK/X in the shop (consumed on pointerDown, which
      // flips state to MAP) let the matching pointerUp fall through here and
      // re-hit the map's SHOP button at the same coordinates, reopening it
      // instantly — the flicker-and-snap-back.
      if (!mapDragging) return;
      mapDragging = false;
      if (mapDragMoved < MAP_TAP_THRESHOLD) {
        handleMapTap(x, y);
      }
      return;
    }
    dragging = false;
  }
  function pointerCancel() {
    mapDragging = false;
    dragging = false;
  }

  // Touch devices fire synthetic mousedown/mousemove/mouseup ~0-300ms after
  // the real touchstart/touchmove/touchend, for compatibility with sites that
  // only listen for mouse. Both listener sets are bound below (mouse is kept
  // for desktop testing), so every physical tap was being handled TWICE: once
  // by the real touch event, then again by the synthetic mouse event replaying
  // the same coordinates into pointerDown/pointerUp against whatever state the
  // first pass had already switched to -- e.g. opening the shop, then the
  // synthetic mousedown immediately closing it again. lastTouchTime records
  // the most recent real touch event; mouse handlers ignore anything within
  // this window of it, so only one input path is ever live at a time.
  let lastTouchTime = -Infinity;
  const TOUCH_SUPPRESS_MOUSE_MS = 500;

  canvas.addEventListener('touchstart', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerUp(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchcancel', pointerCancel, { passive: true });

  canvas.addEventListener('mousedown', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerDown(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerUp(e.clientX, e.clientY);
  });

  function getKeyVector() {
    let ix = 0, iy = 0;

    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;

    const len = Math.hypot(ix, iy);
    if (len > 1) {
      ix /= len;
      iy /= len;
    }

    return { x: ix, y: iy };
  }

  function update(dt) {
    const effectiveSpeed = TUNE.SPEED * Math.pow(TUNE.SHOP_VELOCITY_MULT, shop.velocity);
    let targetX = 0;
    let targetY = 0;

    if (dragging) {
      const toX = fingerX - originX;
      const toY = fingerY - originY;
      const len = Math.hypot(toX, toY);
      if (len > TUNE.DEADZONE) {
        targetX = (toX / len) * effectiveSpeed;
        targetY = (toY / len) * effectiveSpeed;
      }
    } else {
      const key = getKeyVector();
      targetX = key.x * effectiveSpeed;
      targetY = key.y * effectiveSpeed;
    }

    const curLen = Math.hypot(player.vx, player.vy);
    const targetLen = Math.hypot(targetX, targetY);
    let angleBetween = 0;
    if (curLen > 0.001 && targetLen > 0.001) {
      const dot = (player.vx * targetX + player.vy * targetY) / (curLen * targetLen);
      angleBetween = Math.acos(Math.max(-1, Math.min(1, dot)));
    }
    const t = Math.min(Math.max(angleBetween / TUNE.SNAP_ANGLE, 0), 1);
    const response = TUNE.RESPONSE_TURN + (TUNE.RESPONSE_SNAP - TUNE.RESPONSE_TURN) * t;

    player.vx += (targetX - player.vx) * response;
    player.vy += (targetY - player.vy) * response;

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > effectiveSpeed) {
      player.vx = (player.vx / speed) * effectiveSpeed;
      player.vy = (player.vy / speed) * effectiveSpeed;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.x <= TUNE.MARGIN || player.x >= window.innerWidth - TUNE.MARGIN) {
      player.vx = 0;
    }
    player.x = Math.max(TUNE.MARGIN, Math.min(window.innerWidth - TUNE.MARGIN, player.x));

    if (player.y <= TUNE.MARGIN || player.y >= window.innerHeight - TUNE.MARGIN) {
      player.vy = 0;
    }
    player.y = Math.max(TUNE.MARGIN, Math.min(window.innerHeight - TUNE.MARGIN, player.y));

    if (speed > 0.001) {
      const targetAngle = Math.atan2(player.vy, player.vx);
      let diff = ((targetAngle - player.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      player.angle += diff * TUNE.TURN_RATE;
    }

    trail.push({ x: player.x, y: player.y });
    if (trail.length > TUNE.TRAIL_LENGTH) trail.shift();
  }

  function cellKey(cx, cy) {
    return cx + ',' + cy;
  }

  function buildGrid() {
    const grid = new Map();
    for (const e of enemies) {
      const key = cellKey(Math.floor(e.x / TUNE.SEPARATION_RADIUS), Math.floor(e.y / TUNE.SEPARATION_RADIUS));
      let bucket = grid.get(key);
      if (!bucket) {
        bucket = [];
        grid.set(key, bucket);
      }
      bucket.push(e);
    }
    return grid;
  }

  function separationFor(enemy, grid) {
    let sepX = 0;
    let sepY = 0;
    const cx = Math.floor(enemy.x / TUNE.SEPARATION_RADIUS);
    const cy = Math.floor(enemy.y / TUNE.SEPARATION_RADIUS);

    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        const bucket = grid.get(cellKey(gx, gy));
        if (!bucket) continue;
        for (const other of bucket) {
          if (other === enemy) continue;
          // Anchor is a wall that pushes the swarm aside rather than being
          // pushed — it doesn't feel Hollows shoving back at all, and every
          // other type feels an Anchor's push harder than a same-size neighbor's.
          if (enemy.type === 'anchor' && other.type === 'hollow') continue;
          const ox = enemy.x - other.x;
          const oy = enemy.y - other.y;
          const odist = Math.hypot(ox, oy);
          if (odist > 0.001 && odist < TUNE.SEPARATION_RADIUS) {
            const strength = 1 - odist / TUNE.SEPARATION_RADIUS;
            let weight = strength * strength;   // squared falloff — soft near the edge
            if (other.type === 'anchor') weight *= TUNE.ANCHOR_PUSH_MULT;
            sepX += (ox / odist) * weight;
            sepY += (oy / odist) * weight;
          }
        }
      }
    }

    const sepLen = Math.hypot(sepX, sepY);
    if (sepLen > 1) {
      sepX /= sepLen;
      sepY /= sepLen;
    }
    return { x: sepX, y: sepY };
  }

  function killPlayer(cause) {
    player.hp = 0;
    // Endless never touches the story galaxies[] array -- currentGalaxy is
    // stale/irrelevant there (left over from whatever was last selected on
    // the map), so without this guard an endless death could wrongly zero
    // out a held STORY galaxy and fire Keku's "lost" line for it.
    const lostAHeldGalaxy = !endlessMode && galaxies[currentGalaxy] === 1;
    if (lostAHeldGalaxy) {
      galaxies[currentGalaxy] = 0;
    }
    deathCause = cause;
    deathKekuLine = (lostAHeldGalaxy && kekuLineFirstTime(1)) ? KEKU_LINES[1] : null;
    state = STATE.DEAD;
    stopDrone();
    bankedMotes += Math.round(runMotes);
    saveBank();
  }

  // Shared by Hollow and Anchor — chase the player, blended with separation
  // from the rest of the swarm. Only enemy.speed/turn/radius differ per type.
  function updateChaseEnemy(enemy, dt, grid) {
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dlen = Math.hypot(dx, dy);

    let chaseX = 0;
    let chaseY = 0;
    if (dlen > 0.001) {
      chaseX = dx / dlen;
      chaseY = dy / dlen;
    }

    const sep = separationFor(enemy, grid);

    const touchDist = TUNE.PLAYER_RADIUS + enemy.radius;
    const chaseWeight = dlen <= touchDist ? TUNE.CHASE_WEIGHT_TOUCHING : TUNE.CHASE_WEIGHT;

    let desiredX = chaseX * chaseWeight + sep.x * TUNE.SEPARATION_WEIGHT;
    let desiredY = chaseY * chaseWeight + sep.y * TUNE.SEPARATION_WEIGHT;
    const desiredLen = Math.hypot(desiredX, desiredY);
    if (desiredLen > 0.001) {
      desiredX /= desiredLen;
      desiredY /= desiredLen;
    }

    const targetX = desiredX * enemy.speed;
    const targetY = desiredY * enemy.speed;

    enemy.vx += (targetX - enemy.vx) * enemy.turn;
    enemy.vy += (targetY - enemy.vy) * enemy.turn;

    const speed = Math.hypot(enemy.vx, enemy.vy);
    if (speed > enemy.speed) {
      enemy.vx = (enemy.vx / speed) * enemy.speed;
      enemy.vy = (enemy.vy / speed) * enemy.speed;
    }

    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;

    if (speed > 0.001) {
      enemy.angle = Math.atan2(enemy.vy, enemy.vx);
    }
  }

  // Lance: aim (fast turn, tracks the player) -> charge (heading locks, hard
  // accelerate, cannot turn, sails past on a miss) -> pause (stops dead) -> aim.
  function updateLanceEnemy(enemy, dt) {
    enemy.phaseTimer -= dt;

    if (enemy.phase === 'aim') {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const targetAngle = Math.atan2(dy, dx);
      let diff = ((targetAngle - enemy.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      enemy.angle += diff * TUNE.LANCE_AIM_TURN;
      enemy.vx += (0 - enemy.vx) * 0.2;
      enemy.vy += (0 - enemy.vy) * 0.2;
      if (Math.abs(diff) < TUNE.LANCE_AIM_ALIGN) {
        enemy.phase = 'charge';
        enemy.phaseTimer = TUNE.LANCE_CHARGE_DURATION;
        enemy.chargeAngle = enemy.angle;   // locked — nothing below reads player position again
      }
    } else if (enemy.phase === 'charge') {
      const speed = Math.hypot(enemy.vx, enemy.vy);
      if (speed < enemy.chargeSpeed) {
        enemy.vx += Math.cos(enemy.chargeAngle) * TUNE.LANCE_CHARGE_ACCEL * dt;
        enemy.vy += Math.sin(enemy.chargeAngle) * TUNE.LANCE_CHARGE_ACCEL * dt;
      }
      const newSpeed = Math.hypot(enemy.vx, enemy.vy);
      if (newSpeed > enemy.chargeSpeed) {
        enemy.vx = (enemy.vx / newSpeed) * enemy.chargeSpeed;
        enemy.vy = (enemy.vy / newSpeed) * enemy.chargeSpeed;
      }
      if (enemy.phaseTimer <= 0) {
        enemy.phase = 'pause';
        enemy.phaseTimer = TUNE.LANCE_PAUSE_DURATION;
      }
    } else {   // pause
      enemy.vx += (0 - enemy.vx) * 0.15;
      enemy.vy += (0 - enemy.vy) * 0.15;
      if (enemy.phaseTimer <= 0) {
        enemy.phase = 'aim';
      }
    }

    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;
  }

  function updateEnemies(dt) {
    const grid = buildGrid();

    for (const enemy of enemies) {
      if (enemy.type === 'lance') {
        updateLanceEnemy(enemy, dt);
      } else {
        updateChaseEnemy(enemy, dt, grid);
      }

      const touchDist = TUNE.PLAYER_RADIUS + enemy.radius;
      const pdx = enemy.x - player.x;
      const pdy = enemy.y - player.y;
      const pdist = Math.hypot(pdx, pdy);
      if (pdist < touchDist) {
        if (pdist > 0.001) {
          enemy.x = player.x + (pdx / pdist) * touchDist;
          enemy.y = player.y + (pdy / pdist) * touchDist;
        } else {
          enemy.x = player.x + touchDist;
          enemy.y = player.y;
        }

        player.hp -= TUNE.CONTACT_DPS * dt;
        sfxPlayerHit();
        if (player.hp <= 0) {
          killPlayer('enemy');
        }
      }
    }
  }

  function updateBoss(dt) {
    if (!boss) return;

    const dx = player.x - boss.x;
    const dy = player.y - boss.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.001) {
      boss.vx = (dx / dist) * boss.speed;
      boss.vy = (dy / dist) * boss.speed;
      boss.angle = Math.atan2(dy, dx);
    }

    boss.x += boss.vx * dt;
    boss.y += boss.vy * dt;

    const touchDist = TUNE.PLAYER_RADIUS + TUNE.BOSS_RADIUS;
    const pdx = boss.x - player.x;
    const pdy = boss.y - player.y;
    const pdist = Math.hypot(pdx, pdy);
    if (pdist < touchDist) {
      if (pdist > 0.001) {
        boss.x = player.x + (pdx / pdist) * touchDist;
        boss.y = player.y + (pdy / pdist) * touchDist;
      } else {
        boss.x = player.x + touchDist;
        boss.y = player.y;
      }

      player.hp -= TUNE.BOSS_DPS * dt;
      sfxPlayerHit();
      if (player.hp <= 0) {
        killPlayer('boss');
      }
    }
  }

  function nearestEnemy() {
    let nearest = null;
    let nearestDist = Infinity;
    for (const enemy of enemies) {
      const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = enemy;
      }
    }
    if (boss) {
      const dist = Math.hypot(boss.x - player.x, boss.y - player.y);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = boss;
      }
    }
    return nearest;
  }

  function acquireTarget() {
    if (currentTarget && !currentTarget.dead) {
      const dist = Math.hypot(currentTarget.x - player.x, currentTarget.y - player.y);
      if (dist <= TUNE.TARGET_DROP_RANGE) {
        return currentTarget;
      }
    }
    currentTarget = nearestEnemy();
    return currentTarget;
  }

  function segmentHitsCircle(px, py, nx, ny, cx, cy, r) {
    const dx = nx - px, dy = ny - py;
    const fx = px - cx, fy = py - cy;
    const a = dx * dx + dy * dy;
    if (a < 0.0001) return (fx * fx + fy * fy) <= r * r;
    let t = -(fx * dx + fy * dy) / a;
    t = Math.max(0, Math.min(1, t));
    const cxp = px + dx * t - cx;
    const cyp = py + dy * t - cy;
    return (cxp * cxp + cyp * cyp) <= r * r;
  }

  function spawnParticle(x, y, vx, vy, life, color, size) {
    particles.push({ x, y, vx, vy, born: currentTime, life, color, size });
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      if (currentTime - particles[i].born >= particles[i].life) particles.splice(i, 1);
    }
  }

  function checkLevelUp() {
    const need = TUNE.XP_BASE + level * TUNE.XP_GROWTH;
    if (xp >= need) {
      xp -= need;
      level++;
      sfxLevelUp();
      openDraft();
    }
  }

  function openDraft() {
    paused = true;
    const pool = UPGRADE_DEFS.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pool[i];
      pool[i] = pool[j];
      pool[j] = tmp;
    }
    draftOptions = pool.slice(0, 3);
  }

  function applyUpgrade(key) {
    upgradeLevels[key]++;
    if (key === 'hull') {
      player.maxHp += TUNE.HULL_HP_BONUS;
      player.hp += TUNE.HULL_HP_BONUS;
    }
    paused = false;
    draftOptions = [];
  }

  function exportSave() {
    const text = JSON.stringify({ v: 7, motes: bankedMotes, galaxies: galaxies, lastPlayed: lastPlayed, deepestHeld: deepestHeld, names: NAMES, shop: shop, kekuSeen: kekuSeen, bestDepth: bestDepth });
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text)
        .then(() => { saveMessage = 'Copied to clipboard'; saveMessageUntil = currentTime + 2000; })
        .catch(() => { saveMessage = 'Copy failed'; saveMessageUntil = currentTime + 2000; });
    }
  }

    if (!text) return;
    try {
      const obj = JSON.parse(text);
      if (obj && obj.v === 7 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
        bankedMotes = obj.motes;
        galaxies = obj.galaxies.slice();

        NAMES = readNames(obj.names);

        saveBank();
        saveMessage = 'Import successful';
      } else if (obj && obj.v === 6 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {

        galaxies = obj.galaxies.slice();
        deepestHeld = typeof obj.deepestHeld === 'number' ? obj.deepestHeld : galaxies.filter((g) => g === 1).length;
        NAMES = readNames(obj.names);
        shop = readShop(obj.shop);

        NAMES = readNames(obj.names);

      } else if (obj && obj.v === 4 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
        bankedMotes = obj.motes;
        galaxies = obj.galaxies.slice();
        deepestHeld = typeof obj.deepestHeld === 'number' ? obj.deepestHeld : galaxies.filter((g) => g === 1).length;
        NAMES = readNames(obj.names);
        shop = defaultShop();
        kekuSeen = defaultKekuSeen();

        saveBank();
        saveMessage = 'Import successful';
      } else if (obj && obj.v === 3 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
        bankedMotes = obj.motes;
        galaxies = obj.galaxies.slice();
        deepestHeld = typeof obj.deepestHeld === 'number' ? obj.deepestHeld : galaxies.filter((g) => g === 1).length;
        NAMES = defaultNames();
        shop = defaultShop();
        kekuSeen = defaultKekuSeen();

        saveBank();

      } else if (obj && obj.v === 2 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
        bankedMotes = obj.motes;
        galaxies = obj.galaxies.slice();
        deepestHeld = galaxies.filter((g) => g === 1).length;
        NAMES = defaultNames();
        shop = defaultShop();
        kekuSeen = defaultKekuSeen();
        bestDepth = 0;
        saveBank();
        saveMessage = 'Import successful';
      } else if (obj && obj.v === 1 && typeof obj.motes === 'number') {
        bankedMotes = obj.motes;
        galaxies = new Array(10).fill(0);
        deepestHeld = 0;
        NAMES = defaultNames();
        shop = defaultShop();
        kekuSeen = defaultKekuSeen();

      } else {
        saveMessage = 'Invalid save data';
      }
    } catch (e) {
      saveMessage = 'Invalid save data';
    }
    saveMessageUntil = currentTime + 2000;
