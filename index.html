<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Afterlight</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const SPEED = 170;
  const RESPONSE_TURN = 0.22;   // gentle turns: weight and carve
  const RESPONSE_SNAP = 0.9;   // hard turns / reversals: near-instant
  const SNAP_ANGLE = 1.4;       // radians (~80deg). At/above this, use full SNAP.
  const DEADZONE = 2;
  const TURN_RATE = 0.15;
  const PULSE_DURATION = 180;
  const MARGIN = 24;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2
  };
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;

  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = true; break;
      case 's': case 'S': case 'ArrowDown': keys.down = true; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = true; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = false; break;
      case 's': case 'S': case 'ArrowDown': keys.down = false; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = false; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
    }
  });

  let dragging = false;
  let originX = 0;
  let originY = 0;
  let fingerX = 0;
  let fingerY = 0;
  let touchStartTime = 0;

  const TRAIL_LENGTH = 10;
  const trail = [];

  function pointerDown(x, y) {
    dragging = true;
    originX = x;
    originY = y;
    fingerX = x;
    fingerY = y;
    touchStartTime = currentTime;
  }
  function pointerMove(x, y) {
    if (!dragging) return;
    fingerX = x;
    fingerY = y;
  }
  function pointerUp() {
    dragging = false;
  }

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    const t = e.changedTouches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', pointerUp);
  canvas.addEventListener('touchcancel', pointerUp);

  canvas.addEventListener('mousedown', (e) => {
    pointerDown(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    pointerMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', pointerUp);

  function getKeyVector() {
    let ix = 0, iy = 0;

    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;

    const len = Math.hypot(ix, iy);
    if (len > 1) {
      ix /= len;
      iy /= len;
    }

    return { x: ix, y: iy };
  }

  function update(dt) {
    let targetX = 0;
    let targetY = 0;

    if (dragging) {
      const toX = fingerX - originX;
      const toY = fingerY - originY;
      const len = Math.hypot(toX, toY);
      if (len > DEADZONE) {
        targetX = (toX / len) * SPEED;
        targetY = (toY / len) * SPEED;
      }
    } else {
      const key = getKeyVector();
      targetX = key.x * SPEED;
      targetY = key.y * SPEED;
    }

    const curLen = Math.hypot(player.vx, player.vy);
    const targetLen = Math.hypot(targetX, targetY);
    let angleBetween = 0;
    if (curLen > 0.001 && targetLen > 0.001) {
      const dot = (player.vx * targetX + player.vy * targetY) / (curLen * targetLen);
      angleBetween = Math.acos(Math.max(-1, Math.min(1, dot)));
    }
    const t = Math.min(Math.max(angleBetween / SNAP_ANGLE, 0), 1);
    const response = RESPONSE_TURN + (RESPONSE_SNAP - RESPONSE_TURN) * t;

    player.vx += (targetX - player.vx) * response;
    player.vy += (targetY - player.vy) * response;

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > SPEED) {
      player.vx = (player.vx / speed) * SPEED;
      player.vy = (player.vy / speed) * SPEED;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.x <= MARGIN || player.x >= window.innerWidth - MARGIN) {
      player.vx = 0;
    }
    player.x = Math.max(MARGIN, Math.min(window.innerWidth - MARGIN, player.x));

    if (player.y <= MARGIN || player.y >= window.innerHeight - MARGIN) {
      player.vy = 0;
    }
    player.y = Math.max(MARGIN, Math.min(window.innerHeight - MARGIN, player.y));

    if (speed > 0.001) {
      const targetAngle = Math.atan2(player.vy, player.vx);
      let diff = ((targetAngle - player.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      player.angle += diff * TURN_RATE;
    }

    trail.push({ x: player.x, y: player.y });
    if (trail.length > TRAIL_LENGTH) trail.shift();
  }

  const THUMB_OFFSET = 15;

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const age = (i + 1) / trail.length;
      ctx.fillStyle = `rgba(255, 255, 255, ${age * 0.35})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y - THUMB_OFFSET, 6 * age, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(player.x, player.y - THUMB_OFFSET);
    ctx.rotate(player.angle);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-12, 10);
    ctx.lineTo(-12, -10);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    if (dragging) {
      const pulseT = Math.min((currentTime - touchStartTime) / PULSE_DURATION, 1);
      const ringRadius = 40 + (1 - pulseT) * 30;
      const ringAlpha = 0.25 + (1 - pulseT) * 0.35;

      ctx.strokeStyle = `rgba(255, 255, 255, ${ringAlpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(originX, originY, ringRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(fingerX, fingerY, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let lastTime = null;
  let currentTime = 0;

  function loop(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    currentTime = timestamp;

    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
