<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Afterlight</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const SPEED = 195;
  const RESPONSE_TURN = 0.22;   // gentle turns: weight and carve
  const RESPONSE_SNAP = 0.9;   // hard turns / reversals: near-instant
  const SNAP_ANGLE = 1.4;       // radians (~80deg). At/above this, use full SNAP.
  const DEADZONE = 2;
  const TURN_RATE = 0.15;
  const PULSE_DURATION = 180;
  const MARGIN = 24;
  const ENEMY_SPEED = 110;
  const ENEMY_TURN = 0.045;   // LOW. The enemy commits to a heading and
                              // overshoots when the player cuts across it.
  const SPAWN_INTERVAL = 1.2;   // seconds between spawns
  const MAX_ENEMIES = 85;
  const SEPARATION_RADIUS = 28;   // px — how close before they push apart
  const CHASE_WEIGHT = 1.0;
  const SEPARATION_WEIGHT = 1.2;  // higher = they spread more, chase less
  const PLAYER_RADIUS = 14;
  const ENEMY_RADIUS = 9;
  const CHASE_WEIGHT_TOUCHING = 0.6;   // lower pull once already at contact — press, don't grind

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2
  };
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;

  function spawnEnemy() {
    const pad = 40;
    const edge = Math.floor(Math.random() * 4);
    const speed = ENEMY_SPEED * (0.9 + Math.random() * 0.2);   // +/-10%
    const turn = ENEMY_TURN * (0.85 + Math.random() * 0.3);
    if (edge === 0) return { x: Math.random() * canvas.width, y: -pad, vx: 0, vy: 0, angle: 0, speed, turn };
    if (edge === 1) return { x: canvas.width + pad, y: Math.random() * canvas.height, vx: 0, vy: 0, angle: 0, speed, turn };
    if (edge === 2) return { x: Math.random() * canvas.width, y: canvas.height + pad, vx: 0, vy: 0, angle: 0, speed, turn };
    return { x: -pad, y: Math.random() * canvas.height, vx: 0, vy: 0, angle: 0, speed, turn };
  }

  const enemies = [];
  let spawnTimer = 0;

  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = true; break;
      case 's': case 'S': case 'ArrowDown': keys.down = true; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = true; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = false; break;
      case 's': case 'S': case 'ArrowDown': keys.down = false; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = false; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
    }
  });

  let dragging = false;
  let originX = 0;
  let originY = 0;
  let fingerX = 0;
  let fingerY = 0;
  let touchStartTime = 0;

  const TRAIL_LENGTH = 10;
  const trail = [];

  function pointerDown(x, y) {
    dragging = true;
    originX = x;
    originY = y;
    fingerX = x;
    fingerY = y;
    touchStartTime = currentTime;
  }
  function pointerMove(x, y) {
    if (!dragging) return;
    fingerX = x;
    fingerY = y;
  }
  function pointerUp() {
    dragging = false;
  }

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    const t = e.changedTouches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', pointerUp);
  canvas.addEventListener('touchcancel', pointerUp);

  canvas.addEventListener('mousedown', (e) => {
    pointerDown(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    pointerMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', pointerUp);

  function getKeyVector() {
    let ix = 0, iy = 0;

    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;

    const len = Math.hypot(ix, iy);
    if (len > 1) {
      ix /= len;
      iy /= len;
    }

    return { x: ix, y: iy };
  }

  function update(dt) {
    let targetX = 0;
    let targetY = 0;

    if (dragging) {
      const toX = fingerX - originX;
      const toY = fingerY - originY;
      const len = Math.hypot(toX, toY);
      if (len > DEADZONE) {
        targetX = (toX / len) * SPEED;
        targetY = (toY / len) * SPEED;
      }
    } else {
      const key = getKeyVector();
      targetX = key.x * SPEED;
      targetY = key.y * SPEED;
    }

    const curLen = Math.hypot(player.vx, player.vy);
    const targetLen = Math.hypot(targetX, targetY);
    let angleBetween = 0;
    if (curLen > 0.001 && targetLen > 0.001) {
      const dot = (player.vx * targetX + player.vy * targetY) / (curLen * targetLen);
      angleBetween = Math.acos(Math.max(-1, Math.min(1, dot)));
    }
    const t = Math.min(Math.max(angleBetween / SNAP_ANGLE, 0), 1);
    const response = RESPONSE_TURN + (RESPONSE_SNAP - RESPONSE_TURN) * t;

    player.vx += (targetX - player.vx) * response;
    player.vy += (targetY - player.vy) * response;

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > SPEED) {
      player.vx = (player.vx / speed) * SPEED;
      player.vy = (player.vy / speed) * SPEED;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.x <= MARGIN || player.x >= window.innerWidth - MARGIN) {
      player.vx = 0;
    }
    player.x = Math.max(MARGIN, Math.min(window.innerWidth - MARGIN, player.x));

    if (player.y <= MARGIN || player.y >= window.innerHeight - MARGIN) {
      player.vy = 0;
    }
    player.y = Math.max(MARGIN, Math.min(window.innerHeight - MARGIN, player.y));

    if (speed > 0.001) {
      const targetAngle = Math.atan2(player.vy, player.vx);
      let diff = ((targetAngle - player.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      player.angle += diff * TURN_RATE;
    }

    trail.push({ x: player.x, y: player.y });
    if (trail.length > TRAIL_LENGTH) trail.shift();
  }

  function cellKey(cx, cy) {
    return cx + ',' + cy;
  }

  function buildGrid() {
    const grid = new Map();
    for (const e of enemies) {
      const key = cellKey(Math.floor(e.x / SEPARATION_RADIUS), Math.floor(e.y / SEPARATION_RADIUS));
      let bucket = grid.get(key);
      if (!bucket) {
        bucket = [];
        grid.set(key, bucket);
      }
      bucket.push(e);
    }
    return grid;
  }

  function separationFor(enemy, grid) {
    let sepX = 0;
    let sepY = 0;
    const cx = Math.floor(enemy.x / SEPARATION_RADIUS);
    const cy = Math.floor(enemy.y / SEPARATION_RADIUS);

    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        const bucket = grid.get(cellKey(gx, gy));
        if (!bucket) continue;
        for (const other of bucket) {
          if (other === enemy) continue;
          const ox = enemy.x - other.x;
          const oy = enemy.y - other.y;
          const odist = Math.hypot(ox, oy);
          if (odist > 0.001 && odist < SEPARATION_RADIUS) {
            const strength = 1 - odist / SEPARATION_RADIUS;
            const weight = strength * strength;   // squared falloff — soft near the edge
            sepX += (ox / odist) * weight;
            sepY += (oy / odist) * weight;
          }
        }
      }
    }

    const sepLen = Math.hypot(sepX, sepY);
    if (sepLen > 1) {
      sepX /= sepLen;
      sepY /= sepLen;
    }
    return { x: sepX, y: sepY };
  }

  function updateEnemies(dt) {
    spawnTimer += dt;
    if (spawnTimer >= SPAWN_INTERVAL && enemies.length < MAX_ENEMIES) {
      spawnTimer = 0;
      enemies.push(spawnEnemy());
    }

    const grid = buildGrid();

    for (const enemy of enemies) {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const dlen = Math.hypot(dx, dy);

      let chaseX = 0;
      let chaseY = 0;
      if (dlen > 0.001) {
        chaseX = dx / dlen;
        chaseY = dy / dlen;
      }

      const sep = separationFor(enemy, grid);

      const touchDist = PLAYER_RADIUS + ENEMY_RADIUS;
      const chaseWeight = dlen <= touchDist ? CHASE_WEIGHT_TOUCHING : CHASE_WEIGHT;

      let desiredX = chaseX * chaseWeight + sep.x * SEPARATION_WEIGHT;
      let desiredY = chaseY * chaseWeight + sep.y * SEPARATION_WEIGHT;
      const desiredLen = Math.hypot(desiredX, desiredY);
      if (desiredLen > 0.001) {
        desiredX /= desiredLen;
        desiredY /= desiredLen;
      }

      const targetX = desiredX * enemy.speed;
      const targetY = desiredY * enemy.speed;

      enemy.vx += (targetX - enemy.vx) * enemy.turn;
      enemy.vy += (targetY - enemy.vy) * enemy.turn;

      const speed = Math.hypot(enemy.vx, enemy.vy);
      if (speed > enemy.speed) {
        enemy.vx = (enemy.vx / speed) * enemy.speed;
        enemy.vy = (enemy.vy / speed) * enemy.speed;
      }

      enemy.x += enemy.vx * dt;
      enemy.y += enemy.vy * dt;

      const pdx = enemy.x - player.x;
      const pdy = enemy.y - player.y;
      const pdist = Math.hypot(pdx, pdy);
      if (pdist < touchDist) {
        if (pdist > 0.001) {
          enemy.x = player.x + (pdx / pdist) * touchDist;
          enemy.y = player.y + (pdy / pdist) * touchDist;
        } else {
          enemy.x = player.x + touchDist;
          enemy.y = player.y;
        }
      }

      if (speed > 0.001) {
        enemy.angle = Math.atan2(enemy.vy, enemy.vx);
      }
    }
  }

  const THUMB_OFFSET = 15;

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const age = (i + 1) / trail.length;
      ctx.fillStyle = `rgba(255, 255, 255, ${age * 0.35})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y - THUMB_OFFSET, 6 * age, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const enemy of enemies) {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.rotate(enemy.angle);

      ctx.fillStyle = '#f00';
      ctx.beginPath();
      ctx.moveTo(13, 0);
      ctx.lineTo(-10, 8);
      ctx.lineTo(-10, -8);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    ctx.save();
    ctx.translate(player.x, player.y - THUMB_OFFSET);
    ctx.rotate(player.angle);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-12, 10);
    ctx.lineTo(-12, -10);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    if (dragging) {
      const pulseT = Math.min((currentTime - touchStartTime) / PULSE_DURATION, 1);
      const ringRadius = 40 + (1 - pulseT) * 30;
      const ringAlpha = 0.25 + (1 - pulseT) * 0.35;

      ctx.strokeStyle = `rgba(255, 255, 255, ${ringAlpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(originX, originY, ringRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(fingerX, fingerY, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let lastTime = null;
  let currentTime = 0;

  function loop(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    currentTime = timestamp;

    update(dt);
    updateEnemies(dt);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
