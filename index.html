<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Afterlight</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const DEBUG = true;

  const TUNE = {
    SPEED: 159.9,
    RESPONSE_TURN: 0.22,   // gentle turns: weight and carve
    RESPONSE_SNAP: 0.9,    // hard turns / reversals: near-instant
    SNAP_ANGLE: 1.4,       // radians (~80deg). At/above this, use full SNAP.
    DEADZONE: 2,
    TURN_RATE: 0.15,
    PULSE_DURATION: 151.2,
    MARGIN: 24,
    ENEMY_SPEED: 110,
    ENEMY_TURN: 0.045,     // LOW. The enemy commits to a heading and
                           // overshoots when the player cuts across it.
    MAX_ENEMIES: 102,
    SEPARATION_RADIUS: 28, // px — how close before they push apart
    CHASE_WEIGHT: 1,
    SEPARATION_WEIGHT: 1.2, // higher = they spread more, chase less
    PLAYER_RADIUS: 14,
    ENEMY_RADIUS: 9,
    CHASE_WEIGHT_TOUCHING: 0.6, // lower pull once already at contact — press, don't grind
    PLAYER_MAX_HP: 100,
    CONTACT_DPS: 12,
    FIRE_RATE: 0.45,
    BULLET_SPEED: 405.6,
    BULLET_DAMAGE: 10,
    ENEMY_MAX_HP: 10,
    BULLET_RADIUS: 4,
    HOLLOW_SPAWN_WEIGHT: 3,  // relative odds among currently-unlocked types — cheap, numerous
    LANCE_SPAWN_WEIGHT: 1,
    ANCHOR_SPAWN_WEIGHT: 1,
    LANCE_RADIUS: 6,
    LANCE_MAX_HP: 4,
    LANCE_AIM_TURN: 0.18,        // fast — snaps to face the player while lining up
    LANCE_AIM_ALIGN: 0.05,       // radians of heading error allowed before it commits to the charge
    LANCE_CHARGE_SPEED: 300,
    LANCE_CHARGE_ACCEL: 900,     // px/s^2 while committed — hits top speed fast, then flies dead straight
    LANCE_CHARGE_DURATION: 0.9,  // seconds locked on the charge heading, long enough to overshoot badly
    LANCE_PAUSE_DURATION: 0.7,   // seconds standing still after a charge before it lines up again
    ANCHOR_RADIUS: 22,
    ANCHOR_MAX_HP: 90,
    ANCHOR_SPEED: 45,
    ANCHOR_TURN: 0.03,
    ANCHOR_PUSH_MULT: 2.5,       // how much harder an Anchor shoves OTHER enemies away vs. a same-size neighbor
    TARGET_DROP_RANGE: 420, // px — drop target beyond this
    HIT_FLASH_MS: 9.6768,
    KNOCKBACK: 9.78112,
    SHAKE_KILL: 0.4356,
    SHAKE_DECAY_MS: 80,
    DEATH_BURST_MS: 400,
    IMPACT_SPARK_MS: 79.2,
    TRAIL_LENGTH: 10,
    THUMB_OFFSET: 15,
    PICKUP_RADIUS: 90,
    MOTE_SPEED: 340,   // how fast a mote flies to the player
    MOTE_ACCEL: 1.8,   // it accelerates as it closes
    XP_BASE: 5,
    XP_GROWTH: 3,
    FIRE_RATE_MULT: 0.88,   // -12% time between shots per Rate-of-Fire level
    DAMAGE_MULT: 1.25,      // +25% bullet damage per Damage level
    REACH_MULT: 1.25,       // +25% pickup radius per Reach level
    HULL_HP_BONUS: 20,
    MULTISHOT_SPREAD: 0.09, // radians between adjacent bullets in a volley
    XP_BAR_HEIGHT: 5,
    BOSS_HP: 1800,
    BOSS_SPEED: 81,
    BOSS_DPS: 30,
    BOSS_RADIUS: 30,
    WAVES_PER_GALAXY: 10,
    BREATHER: 3.04,          // seconds of no spawns between waves
    WAVE_COUNT_BASE: 12,     // enemy count = WAVE_COUNT_BASE + n * WAVE_COUNT_PER_WAVE
    WAVE_COUNT_PER_WAVE: 8,
    WAVE_HP_GROWTH_PER_WAVE: 0.35,  // enemy HP = ENEMY_MAX_HP * (1 + n * this)
    WAVE_SPEED_PER_WAVE: 4,         // enemy speed = ENEMY_SPEED + n * this
    WAVE_SPAWN_DURATION: 20.4,      // seconds a wave's arrivals are paced across
    WAVE_SPAWN_FRACTION: 0.6,       // fraction of WAVE_SPAWN_DURATION the budget arrives over
    DECAY_DAYS: 7,                  // days of absence before the deepest held galaxy reverts to dark
    CORRIDOR_FOV: 520,              // perspective strength: scale = CORRIDOR_FOV / z. Renamed from the
                                     // old MAP_FOV so a stale localStorage TUNE override from the earlier
                                     // FOV/(FOV+depth) corridor (same key, different formula) can't reapply.
    CORRIDOR_SPACING: 460,               // world-units between galaxies along the corridor's depth axis
    CORRIDOR_NEAR_Z: 260,                // camera sits this far in front of galaxy 1
    CORRIDOR_CORE: 46,                   // base core radius at scale 1
    CORRIDOR_GLOW: 190,                  // base glow radius at scale 1
    CORRIDOR_DRIFT: 90,                  // lateral wander so the corridor reads as space, not a pipe
    CORRIDOR_SCROLL_SPEED: 1.9,
    CORRIDOR_FRICTION: 0.92,
    KEKU_WORLD_Z: 8280,             // Keku's fixed depth, well beyond galaxy 10 (world Z 4140) — he never gets close
    COST_BASE: 40,                  // shop upgrade level n costs COST_BASE * (n ^ COST_POWER)
    COST_POWER: 1.6,
    SHOP_MAX_LEVEL: 20,
    SHOP_HULL_BONUS: 10,             // +10 max HP per level
    SHOP_VELOCITY_MULT: 1.04,        // +4% move speed per level
    SHOP_CALIBRE_MULT: 1.06,         // +6% bullet damage per level
    SHOP_CADENCE_MULT: 0.96,         // -4% time between shots per level
    SHOP_REACH_MULT: 1.08,           // +8% pickup radius per level
    SHOP_SALVAGE_MULT: 1.05          // +5% motes collected per level
  };

  const TUNE_DEFAULTS = { ...TUNE };
  const TUNE_KEY = 'afterlight.tune.v1';

  function loadTuneOverrides() {
    try {
      const raw = localStorage.getItem(TUNE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      }
    } catch (e) {}
    return null;
  }

  function saveTuneOverrides() {
    try {
      const overrides = {};
      for (const k of Object.keys(TUNE)) {
        if (TUNE[k] !== TUNE_DEFAULTS[k]) overrides[k] = TUNE[k];
      }
      localStorage.setItem(TUNE_KEY, JSON.stringify(overrides));
    } catch (e) {}
  }

  const tuneOverrides = loadTuneOverrides();
  if (tuneOverrides) {
    for (const k of Object.keys(tuneOverrides)) {
      if (Object.prototype.hasOwnProperty.call(TUNE, k) && typeof tuneOverrides[k] === 'number') {
        TUNE[k] = tuneOverrides[k];
      }
    }
  }

  const SAVE_KEY = 'afterlight.save.v1';

  const GALAXY_DATA = [
    { star: 'Red Giant', element: 'Fire', hue: 11 },
    { star: 'Binary Pair', element: 'Plasma', hue: 35 },
    { star: 'Pulsar', element: 'Electric', hue: 59 },
    { star: 'Brown Dwarf', element: 'Acid', hue: 82 },
    { star: 'White Dwarf', element: 'Crystal', hue: 170 },
    { star: 'Dead Star', element: 'Ice', hue: 195 },
    { star: 'Blue Supergiant', element: 'Radiation', hue: 220 },
    { star: 'Black Hole', element: 'Gravity', hue: 261 },
    { star: 'Neutron Star', element: 'Rock', hue: 284 },
    { star: 'Nebula', element: 'Wind', hue: 320 }
  ];

  function galaxyPalette(index) {
    const data = GALAXY_DATA[index];
    const depth = index / (GALAXY_DATA.length - 1);   // 0 at galaxy 1, 1 at galaxy 10
    return {
      star: data.star,
      element: data.element,
      hue: data.hue,
      accent: `hsl(${data.hue}, 85%, 55%)`,
      bossAccent: `hsl(${data.hue}, 100%, 72%)`,       // hotter, brighter
      background: `hsl(${data.hue}, 60%, ${(depth * 10).toFixed(2)}%)`
    };
  }

  // --- Map corridor: ported 1:1 from the reference implementation. Perspective,
  // colour, drift and the mouth's white treatment must not be reinterpreted. ---

  function mapMaxZ() {
    return TUNE.CORRIDOR_SPACING * (GALAXY_DATA.length - 1);
  }

  // Each galaxy gets a fixed lateral offset so the corridor drifts like space,
  // not a straight pipe. Scaled by perspective scale in projectGalaxy.
  function mapOffset(index) {
    return {
      x: Math.sin(index * 1.31) * TUNE.CORRIDOR_DRIFT,
      y: Math.cos(index * 0.87) * TUNE.CORRIDOR_DRIFT * 0.55
    };
  }

  // scale = FOV / z. Pure 1/depth perspective — not FOV/(FOV+depth). Returns
  // null (cull) once a galaxy is behind or on top of the camera.
  function projectGalaxy(index, scroll) {
    const z = TUNE.CORRIDOR_NEAR_Z + index * TUNE.CORRIDOR_SPACING - scroll;
    if (z <= 40) return null;
    const s = TUNE.CORRIDOR_FOV / z;
    const off = mapOffset(index);
    return {
      x: canvas.width / 2 + off.x * s,
      y: canvas.height / 2 + off.y * s,
      s: s,
      core: TUNE.CORRIDOR_CORE * s,
      glow: TUNE.CORRIDOR_GLOW * s
    };
  }

  function mapHsla(h, s, l, a) {
    return `hsla(${h}, ${s}%, ${l}%, ${a})`;
  }

  const DEFAULT_GALAXY_NAMES = ['Edge', 'Cinder Reach', 'Hollow Drift', 'Ashfall Void', 'Pale March', 'Ember Rift', 'Quiet Expanse', 'Dusk Haven', 'Last Light', 'Centre'];

  function defaultNames() {
    return {
      galaxies: DEFAULT_GALAXY_NAMES.slice(),
      boss: 'The Maw',
      enemy: 'The Hollow'
    };
  }

  function readNames(obj) {
    const dn = defaultNames();
    if (!obj || typeof obj !== 'object') return dn;
    return {
      galaxies: Array.isArray(obj.galaxies) && obj.galaxies.length === 10 ? obj.galaxies.slice() : dn.galaxies,
      boss: typeof obj.boss === 'string' ? obj.boss : dn.boss,
      enemy: typeof obj.enemy === 'string' ? obj.enemy : dn.enemy
    };
  }

  const SHOP_DEFS = [
    { key: 'hull', name: 'HULL', desc: '+10 max HP per level' },
    { key: 'velocity', name: 'VELOCITY', desc: '+4% move speed per level' },
    { key: 'calibre', name: 'CALIBRE', desc: '+6% bullet damage per level' },
    { key: 'cadence', name: 'CADENCE', desc: '-4% time between shots per level' },
    { key: 'reach', name: 'REACH', desc: '+8% pickup radius per level' },
    { key: 'salvage', name: 'SALVAGE', desc: '+5% motes collected per level' }
  ];

  function shopUpgradeCost(level) {
    return Math.round(TUNE.COST_BASE * Math.pow(level, TUNE.COST_POWER));
  }

  function defaultShop() {
    return { hull: 0, velocity: 0, calibre: 0, cadence: 0, reach: 0, salvage: 0 };
  }

  function readShop(obj) {
    const ds = defaultShop();
    if (!obj || typeof obj !== 'object') return ds;
    const result = {};
    for (const k of Object.keys(ds)) {
      result[k] = typeof obj[k] === 'number' && obj[k] >= 0 && obj[k] <= TUNE.SHOP_MAX_LEVEL ? obj[k] : ds[k];
    }
    return result;
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && obj.v === 5 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return {
            v: 5,
            motes: obj.motes,
            galaxies: obj.galaxies,
            lastPlayed: typeof obj.lastPlayed === 'number' ? obj.lastPlayed : Date.now(),
            deepestHeld: typeof obj.deepestHeld === 'number' ? obj.deepestHeld : obj.galaxies.filter((g) => g === 1).length,
            names: readNames(obj.names),
            shop: readShop(obj.shop)
          };
        }
        if (obj && obj.v === 4 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return {
            v: 5,
            motes: obj.motes,
            galaxies: obj.galaxies,
            lastPlayed: typeof obj.lastPlayed === 'number' ? obj.lastPlayed : Date.now(),
            deepestHeld: typeof obj.deepestHeld === 'number' ? obj.deepestHeld : obj.galaxies.filter((g) => g === 1).length,
            names: readNames(obj.names),
            shop: defaultShop()
          };
        }
        if (obj && obj.v === 3 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return {
            v: 5,
            motes: obj.motes,
            galaxies: obj.galaxies,
            lastPlayed: typeof obj.lastPlayed === 'number' ? obj.lastPlayed : Date.now(),
            deepestHeld: typeof obj.deepestHeld === 'number' ? obj.deepestHeld : obj.galaxies.filter((g) => g === 1).length,
            names: defaultNames(),
            shop: defaultShop()
          };
        }
        if (obj && obj.v === 2 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
          return { v: 5, motes: obj.motes, galaxies: obj.galaxies, lastPlayed: Date.now(), deepestHeld: obj.galaxies.filter((g) => g === 1).length, names: defaultNames(), shop: defaultShop() };
        }
        if (obj && obj.v === 1 && typeof obj.motes === 'number') {
          return { v: 5, motes: obj.motes, galaxies: new Array(10).fill(0), lastPlayed: Date.now(), deepestHeld: 0, names: defaultNames(), shop: defaultShop() };
        }
      }
    } catch (e) {}
    return { v: 5, motes: 0, galaxies: new Array(10).fill(0), lastPlayed: Date.now(), deepestHeld: 0, names: defaultNames(), shop: defaultShop() };
  }

  function saveBank() {
    lastPlayed = Date.now();
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 5, motes: bankedMotes, galaxies: galaxies, lastPlayed: lastPlayed, deepestHeld: deepestHeld, names: NAMES, shop: shop }));
    } catch (e) {}
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2,
    hp: TUNE.PLAYER_MAX_HP,
    maxHp: TUNE.PLAYER_MAX_HP
  };
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;

  const STATE = { MAP: 'map', RUN: 'run', DEAD: 'dead', VICTORY: 'victory', LEAP: 'leap', SHOP: 'shop' };
  const LEAP_DURATION_MS = 1500;
  let leapFrom = 0;
  let leapTo = 0;
  let leapStartTime = 0;
  let state = STATE.MAP;

  // Which types are unlocked this wave, weighted so Hollow stays the cheap,
  // numerous baseline even once Lance/Anchor join in.
  function pickEnemyType(n) {
    const pool = [['hollow', TUNE.HOLLOW_SPAWN_WEIGHT]];
    if (n >= 4) pool.push(['lance', TUNE.LANCE_SPAWN_WEIGHT]);
    if (n >= 7) pool.push(['anchor', TUNE.ANCHOR_SPAWN_WEIGHT]);
    const total = pool.reduce((sum, [, w]) => sum + w, 0);
    let r = Math.random() * total;
    for (const [type, w] of pool) {
      if (r < w) return type;
      r -= w;
    }
    return 'hollow';
  }

  function spawnEnemy(n) {
    const pad = 40;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -pad; }
    else if (edge === 1) { x = canvas.width + pad; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + pad; }
    else { x = -pad; y = Math.random() * canvas.height; }

    const type = pickEnemyType(n);

    if (type === 'lance') {
      const hp = Math.floor(TUNE.LANCE_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE));
      const chargeSpeed = TUNE.LANCE_CHARGE_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE;
      return {
        type, x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.LANCE_RADIUS,
        chargeSpeed, phase: 'aim', phaseTimer: 0, chargeAngle: 0
      };
    }

    if (type === 'anchor') {
      const hp = Math.floor(TUNE.ANCHOR_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE));
      const speed = (TUNE.ANCHOR_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE) * (0.9 + Math.random() * 0.2);
      return { type, x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.ANCHOR_RADIUS, speed, turn: TUNE.ANCHOR_TURN };
    }

    const baseSpeed = TUNE.ENEMY_SPEED + n * TUNE.WAVE_SPEED_PER_WAVE;
    const speed = baseSpeed * (0.9 + Math.random() * 0.2);   // +/-10%
    const turn = TUNE.ENEMY_TURN * (0.85 + Math.random() * 0.3);
    const hp = Math.floor(TUNE.ENEMY_MAX_HP * (1 + n * TUNE.WAVE_HP_GROWTH_PER_WAVE));
    return { type: 'hollow', x, y, vx: 0, vy: 0, angle: 0, hp, radius: TUNE.ENEMY_RADIUS, speed, turn };
  }

  function spawnBoss() {
    const pad = 60;
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * canvas.width; y = -pad; }
    else if (edge === 1) { x = canvas.width + pad; y = Math.random() * canvas.height; }
    else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + pad; }
    else { x = -pad; y = Math.random() * canvas.height; }
    return { x, y, vx: 0, vy: 0, angle: 0, hp: TUNE.BOSS_HP, maxHp: TUNE.BOSS_HP, flashUntil: 0 };
  }

  const enemies = [];
  let spawnTimer = 0;
  let boss = null;

  let wave = 1;
  let waveBudget = 0;
  let waveSpawned = 0;
  let waveKilled = 0;
  let waveSpawnInterval = 0;
  let inBreather = false;
  let breatherTimer = 0;

  function startWave(n) {
    wave = n;
    inBreather = false;
    breatherTimer = 0;
    spawnTimer = 0;
    if (n >= TUNE.WAVES_PER_GALAXY) {
      waveBudget = 0;
      waveSpawned = 0;
      waveKilled = 0;
      boss = spawnBoss();
    } else {
      boss = null;
      waveBudget = TUNE.WAVE_COUNT_BASE + n * TUNE.WAVE_COUNT_PER_WAVE;
      waveSpawned = 0;
      waveKilled = 0;
      const spawnWindow = TUNE.WAVE_SPAWN_DURATION * TUNE.WAVE_SPAWN_FRACTION;
      waveSpawnInterval = spawnWindow / waveBudget;
    }
  }

  function updateWave(dt) {
    if (inBreather) {
      breatherTimer -= dt;
      if (breatherTimer <= 0) {
        startWave(wave + 1);
      }
      return;
    }

    if (wave >= TUNE.WAVES_PER_GALAXY) return;   // boss wave: no trash spawning

    spawnTimer += dt;
    if (spawnTimer >= waveSpawnInterval && waveSpawned < waveBudget && enemies.length < TUNE.MAX_ENEMIES) {
      spawnTimer = 0;
      enemies.push(spawnEnemy(wave));
      waveSpawned++;
    }

    if (waveKilled >= waveBudget && enemies.length === 0) {
      inBreather = true;
      breatherTimer = TUNE.BREATHER;
    }
  }

  startWave(1);

  const bullets = [];
  let fireTimer = 0;
  let currentTarget = null;

  const particles = [];
  let shakeStrength = 0;

  const motes = [];
  const initialSave = loadSave();
  let bankedMotes = initialSave.motes;
  let galaxies = initialSave.galaxies;
  let lastPlayed = initialSave.lastPlayed;
  let deepestHeld = initialSave.deepestHeld;
  let NAMES = initialSave.names;
  let shop = initialSave.shop;
  let decayedGalaxyIndex = -1;
  let deathCause = null;

  if (Date.now() - lastPlayed > TUNE.DECAY_DAYS * 24 * 60 * 60 * 1000) {
    for (let i = galaxies.length - 1; i >= 0; i--) {
      if (galaxies[i] === 1) {
        galaxies[i] = 0;
        decayedGalaxyIndex = i;
        break;
      }
    }
  }
  saveBank();

  let runMotes = 0;
  let selectedGalaxy = 0;   // never null, like the reference — always a valid, unlocked focus
  let currentGalaxy = null;
  let startButtons = [];
  let descendBounds = null;
  let shopButtonBounds = null;
  let shopButtons = [];
  let shopBackBounds = null;
  let shopCloseBounds = null;
  let saveMessage = '';
  let saveMessageUntil = 0;

  const MAP_TAP_THRESHOLD = 8;   // px of movement below which a touch counts as a tap, not a scroll

  // The map always opens at the edge — galaxy 1, in the dark — every time.
  let mapScroll = 0;
  let mapScrollVelocity = 0;
  let mapDragging = false;
  let mapDragStartX = 0;
  let mapDragStartY = 0;
  let mapDragLastY = 0;
  let mapDragMoved = 0;
  let corridorDebugLogged = false;

  // Per-frame friction (not dt-scaled) — matches the reference exactly, which
  // ticks its momentum once per requestAnimationFrame call, same as this loop.
  function updateMapScroll() {
    if (mapDragging) return;
    mapScroll = Math.max(0, Math.min(mapMaxZ(), mapScroll + mapScrollVelocity));
    mapScrollVelocity *= TUNE.CORRIDOR_FRICTION;
    if (Math.abs(mapScrollVelocity) < 0.02) mapScrollVelocity = 0;
  }

  const UPGRADE_DEFS = [
    { key: 'fireRate', name: 'RATE OF FIRE', desc: '-12% time between shots' },
    { key: 'damage', name: 'DAMAGE', desc: '+25% bullet damage' },
    { key: 'multishot', name: 'MULTISHOT', desc: '+1 bullet per volley (spread slightly)' },
    { key: 'pierce', name: 'PIERCE', desc: 'bullets pass through +1 enemy before dying' },
    { key: 'hull', name: 'HULL', desc: '+20 max HP, heal that amount now' },
    { key: 'reach', name: 'REACH', desc: '+25% pickup radius' }
  ];
  const upgradeLevels = { fireRate: 0, damage: 0, multishot: 0, pierce: 0, hull: 0, reach: 0 };

  let xp = 0;
  let level = 1;
  let paused = false;
  let debugPaused = false;
  let draftOptions = [];
  let cardBounds = [];

  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = true; break;
      case 's': case 'S': case 'ArrowDown': keys.down = true; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = true; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
      case 'Escape': if (state === STATE.SHOP) openMap(); break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = false; break;
      case 's': case 'S': case 'ArrowDown': keys.down = false; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = false; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
    }
  });

  let dragging = false;
  let originX = 0;
  let originY = 0;
  let fingerX = 0;
  let fingerY = 0;
  let touchStartTime = 0;

  const trail = [];

  function restart() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.vx = 0;
    player.vy = 0;
    player.angle = -Math.PI / 2;
    const baseMaxHp = TUNE.PLAYER_MAX_HP + shop.hull * TUNE.SHOP_HULL_BONUS;
    player.maxHp = baseMaxHp;
    player.hp = baseMaxHp;
    enemies.length = 0;
    trail.length = 0;
    bullets.length = 0;
    fireTimer = 0;
    currentTarget = null;
    particles.length = 0;
    shakeStrength = 0;
    motes.length = 0;
    runMotes = 0;
    xp = 0;
    level = 1;
    paused = false;
    draftOptions = [];
    cardBounds = [];
    for (const k of Object.keys(upgradeLevels)) upgradeLevels[k] = 0;
    startWave(1);
  }

  // The ONLY way state becomes STATE.MAP. camZ (mapScroll) and the selected
  // galaxy always reset to the edge here — no code anywhere else may set
  // mapScroll from save state, deepest held, or the previously selected galaxy.
  function openMap() {
    state = STATE.MAP;
    mapScroll = 0;
    mapScrollVelocity = 0;
    selectedGalaxy = 0;
    console.log('camZ', mapScroll, 'MAX_Z', mapMaxZ());
  }

  function handleMapTap(x, y) {
    if (shopButtonBounds &&
        x >= shopButtonBounds.x && x <= shopButtonBounds.x + shopButtonBounds.w &&
        y >= shopButtonBounds.y && y <= shopButtonBounds.y + shopButtonBounds.h) {
      state = STATE.SHOP;
      return;
    }
    for (const btn of startButtons) {
      if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        if (btn.action === 'export') exportSave();
        else if (btn.action === 'import') importSave();
        return;
      }
    }
    if (descendBounds &&
        x >= descendBounds.x && x <= descendBounds.x + descendBounds.w &&
        y >= descendBounds.y && y <= descendBounds.y + descendBounds.h) {
      currentGalaxy = selectedGalaxy;
      state = STATE.RUN;
      return;
    }
    // Ported from the reference's tapSelect: closest projected galaxy within its
    // own hit radius wins. Locked galaxies are drawn but excluded here — not tappable.
    let best = -1;
    let bestDist = Infinity;
    for (let i = 0; i < GALAXY_DATA.length; i++) {
      if (!(i === 0 || galaxies[i - 1] === 1)) continue;
      const p = projectGalaxy(i, mapScroll);
      if (!p) continue;
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < Math.max(28, p.core * 1.4) && d < bestDist) {
        bestDist = d;
        best = i;
      }
    }
    if (best >= 0) selectedGalaxy = best;
  }

  function buyShopUpgrade(key) {
    const level = shop[key];
    if (level >= TUNE.SHOP_MAX_LEVEL) return;
    const cost = shopUpgradeCost(level + 1);
    if (bankedMotes < cost) return;
    bankedMotes -= cost;
    shop[key] = level + 1;
    saveBank();
  }

  function handleShopTap(x, y) {
    if (shopBackBounds &&
        x >= shopBackBounds.x && x <= shopBackBounds.x + shopBackBounds.w &&
        y >= shopBackBounds.y && y <= shopBackBounds.y + shopBackBounds.h) {
      openMap();
      return;
    }
    if (shopCloseBounds &&
        x >= shopCloseBounds.x && x <= shopCloseBounds.x + shopCloseBounds.w &&
        y >= shopCloseBounds.y && y <= shopCloseBounds.y + shopCloseBounds.h) {
      openMap();
      return;
    }
    for (const btn of shopButtons) {
      if (btn.buyable && x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
        buyShopUpgrade(btn.key);
        return;
      }
    }
  }

  function pointerDown(x, y) {
    if (state === STATE.MAP) {
      mapDragging = true;
      mapDragStartX = x;
      mapDragStartY = y;
      mapDragLastY = y;
      mapDragMoved = 0;
      mapScrollVelocity = 0;
      return;
    }
    if (state === STATE.SHOP) {
      handleShopTap(x, y);
      return;
    }
    if (state === STATE.DEAD || state === STATE.VICTORY) {
      restart();
      openMap();
      return;
    }
    if (state === STATE.LEAP) {
      return;
    }
    if (paused) {
      for (const card of cardBounds) {
        if (x >= card.x && x <= card.x + card.w && y >= card.y && y <= card.y + card.h) {
          applyUpgrade(card.key);
          break;
        }
      }
      return;
    }
    dragging = true;
    originX = x;
    originY = y;
    fingerX = x;
    fingerY = y;
    touchStartTime = currentTime;
  }
  function pointerMove(x, y) {
    if (state === STATE.MAP) {
      if (!mapDragging) return;
      const dy = y - mapDragLastY;
      mapDragLastY = y;
      mapDragMoved += Math.abs(dy);
      mapScroll = Math.max(0, Math.min(mapMaxZ(), mapScroll - dy * TUNE.CORRIDOR_SCROLL_SPEED));
      mapScrollVelocity = -dy * TUNE.CORRIDOR_SCROLL_SPEED;
      return;
    }
    if (!dragging) return;
    fingerX = x;
    fingerY = y;
  }
  function pointerUp(x, y) {
    if (state === STATE.MAP) {
      // mapDragging is only ever set true by pointerDown's OWN STATE.MAP branch.
      // If it's false here, this gesture's pointerDown fired in a different
      // state (e.g. SHOP) that has since closed back to MAP — the map never
      // owned this touch, so it must not resolve it as a tap. Without this
      // guard, tapping BACK/X in the shop (consumed on pointerDown, which
      // flips state to MAP) let the matching pointerUp fall through here and
      // re-hit the map's SHOP button at the same coordinates, reopening it
      // instantly — the flicker-and-snap-back.
      if (!mapDragging) return;
      mapDragging = false;
      if (mapDragMoved < MAP_TAP_THRESHOLD) {
        handleMapTap(x, y);
      }
      return;
    }
    dragging = false;
  }
  function pointerCancel() {
    mapDragging = false;
    dragging = false;
  }

  // Touch devices fire synthetic mousedown/mousemove/mouseup ~0-300ms after
  // the real touchstart/touchmove/touchend, for compatibility with sites that
  // only listen for mouse. Both listener sets are bound below (mouse is kept
  // for desktop testing), so every physical tap was being handled TWICE: once
  // by the real touch event, then again by the synthetic mouse event replaying
  // the same coordinates into pointerDown/pointerUp against whatever state the
  // first pass had already switched to -- e.g. opening the shop, then the
  // synthetic mousedown immediately closing it again. lastTouchTime records
  // the most recent real touch event; mouse handlers ignore anything within
  // this window of it, so only one input path is ever live at a time.
  let lastTouchTime = -Infinity;
  const TOUCH_SUPPRESS_MOUSE_MS = 500;

  canvas.addEventListener('touchstart', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    lastTouchTime = currentTime;
    const t = e.changedTouches[0];
    pointerUp(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchcancel', pointerCancel, { passive: true });

  canvas.addEventListener('mousedown', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerDown(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', (e) => {
    if (currentTime - lastTouchTime < TOUCH_SUPPRESS_MOUSE_MS) return;
    pointerUp(e.clientX, e.clientY);
  });

  function getKeyVector() {
    let ix = 0, iy = 0;

    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;

    const len = Math.hypot(ix, iy);
    if (len > 1) {
      ix /= len;
      iy /= len;
    }

    return { x: ix, y: iy };
  }

  function update(dt) {
    const effectiveSpeed = TUNE.SPEED * Math.pow(TUNE.SHOP_VELOCITY_MULT, shop.velocity);
    let targetX = 0;
    let targetY = 0;

    if (dragging) {
      const toX = fingerX - originX;
      const toY = fingerY - originY;
      const len = Math.hypot(toX, toY);
      if (len > TUNE.DEADZONE) {
        targetX = (toX / len) * effectiveSpeed;
        targetY = (toY / len) * effectiveSpeed;
      }
    } else {
      const key = getKeyVector();
      targetX = key.x * effectiveSpeed;
      targetY = key.y * effectiveSpeed;
    }

    const curLen = Math.hypot(player.vx, player.vy);
    const targetLen = Math.hypot(targetX, targetY);
    let angleBetween = 0;
    if (curLen > 0.001 && targetLen > 0.001) {
      const dot = (player.vx * targetX + player.vy * targetY) / (curLen * targetLen);
      angleBetween = Math.acos(Math.max(-1, Math.min(1, dot)));
    }
    const t = Math.min(Math.max(angleBetween / TUNE.SNAP_ANGLE, 0), 1);
    const response = TUNE.RESPONSE_TURN + (TUNE.RESPONSE_SNAP - TUNE.RESPONSE_TURN) * t;

    player.vx += (targetX - player.vx) * response;
    player.vy += (targetY - player.vy) * response;

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > effectiveSpeed) {
      player.vx = (player.vx / speed) * effectiveSpeed;
      player.vy = (player.vy / speed) * effectiveSpeed;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.x <= TUNE.MARGIN || player.x >= window.innerWidth - TUNE.MARGIN) {
      player.vx = 0;
    }
    player.x = Math.max(TUNE.MARGIN, Math.min(window.innerWidth - TUNE.MARGIN, player.x));

    if (player.y <= TUNE.MARGIN || player.y >= window.innerHeight - TUNE.MARGIN) {
      player.vy = 0;
    }
    player.y = Math.max(TUNE.MARGIN, Math.min(window.innerHeight - TUNE.MARGIN, player.y));

    if (speed > 0.001) {
      const targetAngle = Math.atan2(player.vy, player.vx);
      let diff = ((targetAngle - player.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      player.angle += diff * TUNE.TURN_RATE;
    }

    trail.push({ x: player.x, y: player.y });
    if (trail.length > TUNE.TRAIL_LENGTH) trail.shift();
  }

  function cellKey(cx, cy) {
    return cx + ',' + cy;
  }

  function buildGrid() {
    const grid = new Map();
    for (const e of enemies) {
      const key = cellKey(Math.floor(e.x / TUNE.SEPARATION_RADIUS), Math.floor(e.y / TUNE.SEPARATION_RADIUS));
      let bucket = grid.get(key);
      if (!bucket) {
        bucket = [];
        grid.set(key, bucket);
      }
      bucket.push(e);
    }
    return grid;
  }

  function separationFor(enemy, grid) {
    let sepX = 0;
    let sepY = 0;
    const cx = Math.floor(enemy.x / TUNE.SEPARATION_RADIUS);
    const cy = Math.floor(enemy.y / TUNE.SEPARATION_RADIUS);

    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        const bucket = grid.get(cellKey(gx, gy));
        if (!bucket) continue;
        for (const other of bucket) {
          if (other === enemy) continue;
          // Anchor is a wall that pushes the swarm aside rather than being
          // pushed — it doesn't feel Hollows shoving back at all, and every
          // other type feels an Anchor's push harder than a same-size neighbor's.
          if (enemy.type === 'anchor' && other.type === 'hollow') continue;
          const ox = enemy.x - other.x;
          const oy = enemy.y - other.y;
          const odist = Math.hypot(ox, oy);
          if (odist > 0.001 && odist < TUNE.SEPARATION_RADIUS) {
            const strength = 1 - odist / TUNE.SEPARATION_RADIUS;
            let weight = strength * strength;   // squared falloff — soft near the edge
            if (other.type === 'anchor') weight *= TUNE.ANCHOR_PUSH_MULT;
            sepX += (ox / odist) * weight;
            sepY += (oy / odist) * weight;
          }
        }
      }
    }

    const sepLen = Math.hypot(sepX, sepY);
    if (sepLen > 1) {
      sepX /= sepLen;
      sepY /= sepLen;
    }
    return { x: sepX, y: sepY };
  }

  function killPlayer(cause) {
    player.hp = 0;
    if (galaxies[currentGalaxy] === 1) {
      galaxies[currentGalaxy] = 0;
    }
    deathCause = cause;
    state = STATE.DEAD;
    bankedMotes += Math.round(runMotes);
    saveBank();
  }

  // Shared by Hollow and Anchor — chase the player, blended with separation
  // from the rest of the swarm. Only enemy.speed/turn/radius differ per type.
  function updateChaseEnemy(enemy, dt, grid) {
    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dlen = Math.hypot(dx, dy);

    let chaseX = 0;
    let chaseY = 0;
    if (dlen > 0.001) {
      chaseX = dx / dlen;
      chaseY = dy / dlen;
    }

    const sep = separationFor(enemy, grid);

    const touchDist = TUNE.PLAYER_RADIUS + enemy.radius;
    const chaseWeight = dlen <= touchDist ? TUNE.CHASE_WEIGHT_TOUCHING : TUNE.CHASE_WEIGHT;

    let desiredX = chaseX * chaseWeight + sep.x * TUNE.SEPARATION_WEIGHT;
    let desiredY = chaseY * chaseWeight + sep.y * TUNE.SEPARATION_WEIGHT;
    const desiredLen = Math.hypot(desiredX, desiredY);
    if (desiredLen > 0.001) {
      desiredX /= desiredLen;
      desiredY /= desiredLen;
    }

    const targetX = desiredX * enemy.speed;
    const targetY = desiredY * enemy.speed;

    enemy.vx += (targetX - enemy.vx) * enemy.turn;
    enemy.vy += (targetY - enemy.vy) * enemy.turn;

    const speed = Math.hypot(enemy.vx, enemy.vy);
    if (speed > enemy.speed) {
      enemy.vx = (enemy.vx / speed) * enemy.speed;
      enemy.vy = (enemy.vy / speed) * enemy.speed;
    }

    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;

    if (speed > 0.001) {
      enemy.angle = Math.atan2(enemy.vy, enemy.vx);
    }
  }

  // Lance: aim (fast turn, tracks the player) -> charge (heading locks, hard
  // accelerate, cannot turn, sails past on a miss) -> pause (stops dead) -> aim.
  function updateLanceEnemy(enemy, dt) {
    enemy.phaseTimer -= dt;

    if (enemy.phase === 'aim') {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const targetAngle = Math.atan2(dy, dx);
      let diff = ((targetAngle - enemy.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      enemy.angle += diff * TUNE.LANCE_AIM_TURN;
      enemy.vx += (0 - enemy.vx) * 0.2;
      enemy.vy += (0 - enemy.vy) * 0.2;
      if (Math.abs(diff) < TUNE.LANCE_AIM_ALIGN) {
        enemy.phase = 'charge';
        enemy.phaseTimer = TUNE.LANCE_CHARGE_DURATION;
        enemy.chargeAngle = enemy.angle;   // locked — nothing below reads player position again
      }
    } else if (enemy.phase === 'charge') {
      const speed = Math.hypot(enemy.vx, enemy.vy);
      if (speed < enemy.chargeSpeed) {
        enemy.vx += Math.cos(enemy.chargeAngle) * TUNE.LANCE_CHARGE_ACCEL * dt;
        enemy.vy += Math.sin(enemy.chargeAngle) * TUNE.LANCE_CHARGE_ACCEL * dt;
      }
      const newSpeed = Math.hypot(enemy.vx, enemy.vy);
      if (newSpeed > enemy.chargeSpeed) {
        enemy.vx = (enemy.vx / newSpeed) * enemy.chargeSpeed;
        enemy.vy = (enemy.vy / newSpeed) * enemy.chargeSpeed;
      }
      if (enemy.phaseTimer <= 0) {
        enemy.phase = 'pause';
        enemy.phaseTimer = TUNE.LANCE_PAUSE_DURATION;
      }
    } else {   // pause
      enemy.vx += (0 - enemy.vx) * 0.15;
      enemy.vy += (0 - enemy.vy) * 0.15;
      if (enemy.phaseTimer <= 0) {
        enemy.phase = 'aim';
      }
    }

    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;
  }

  function updateEnemies(dt) {
    const grid = buildGrid();

    for (const enemy of enemies) {
      if (enemy.type === 'lance') {
        updateLanceEnemy(enemy, dt);
      } else {
        updateChaseEnemy(enemy, dt, grid);
      }

      const touchDist = TUNE.PLAYER_RADIUS + enemy.radius;
      const pdx = enemy.x - player.x;
      const pdy = enemy.y - player.y;
      const pdist = Math.hypot(pdx, pdy);
      if (pdist < touchDist) {
        if (pdist > 0.001) {
          enemy.x = player.x + (pdx / pdist) * touchDist;
          enemy.y = player.y + (pdy / pdist) * touchDist;
        } else {
          enemy.x = player.x + touchDist;
          enemy.y = player.y;
        }

        player.hp -= TUNE.CONTACT_DPS * dt;
        if (player.hp <= 0) {
          killPlayer('enemy');
        }
      }
    }
  }

  function updateBoss(dt) {
    if (!boss) return;

    const dx = player.x - boss.x;
    const dy = player.y - boss.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.001) {
      boss.vx = (dx / dist) * TUNE.BOSS_SPEED;
      boss.vy = (dy / dist) * TUNE.BOSS_SPEED;
      boss.angle = Math.atan2(dy, dx);
    }

    boss.x += boss.vx * dt;
    boss.y += boss.vy * dt;

    const touchDist = TUNE.PLAYER_RADIUS + TUNE.BOSS_RADIUS;
    const pdx = boss.x - player.x;
    const pdy = boss.y - player.y;
    const pdist = Math.hypot(pdx, pdy);
    if (pdist < touchDist) {
      if (pdist > 0.001) {
        boss.x = player.x + (pdx / pdist) * touchDist;
        boss.y = player.y + (pdy / pdist) * touchDist;
      } else {
        boss.x = player.x + touchDist;
        boss.y = player.y;
      }

      player.hp -= TUNE.BOSS_DPS * dt;
      if (player.hp <= 0) {
        killPlayer('boss');
      }
    }
  }

  function nearestEnemy() {
    let nearest = null;
    let nearestDist = Infinity;
    for (const enemy of enemies) {
      const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = enemy;
      }
    }
    if (boss) {
      const dist = Math.hypot(boss.x - player.x, boss.y - player.y);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = boss;
      }
    }
    return nearest;
  }

  function acquireTarget() {
    if (currentTarget && !currentTarget.dead) {
      const dist = Math.hypot(currentTarget.x - player.x, currentTarget.y - player.y);
      if (dist <= TUNE.TARGET_DROP_RANGE) {
        return currentTarget;
      }
    }
    currentTarget = nearestEnemy();
    return currentTarget;
  }

  function segmentHitsCircle(px, py, nx, ny, cx, cy, r) {
    const dx = nx - px, dy = ny - py;
    const fx = px - cx, fy = py - cy;
    const a = dx * dx + dy * dy;
    if (a < 0.0001) return (fx * fx + fy * fy) <= r * r;
    let t = -(fx * dx + fy * dy) / a;
    t = Math.max(0, Math.min(1, t));
    const cxp = px + dx * t - cx;
    const cyp = py + dy * t - cy;
    return (cxp * cxp + cyp * cyp) <= r * r;
  }

  function spawnParticle(x, y, vx, vy, life, color, size) {
    particles.push({ x, y, vx, vy, born: currentTime, life, color, size });
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      if (currentTime - particles[i].born >= particles[i].life) particles.splice(i, 1);
    }
  }

  function checkLevelUp() {
    const need = TUNE.XP_BASE + level * TUNE.XP_GROWTH;
    if (xp >= need) {
      xp -= need;
      level++;
      openDraft();
    }
  }

  function openDraft() {
    paused = true;
    const pool = UPGRADE_DEFS.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pool[i];
      pool[i] = pool[j];
      pool[j] = tmp;
    }
    draftOptions = pool.slice(0, 3);
  }

  function applyUpgrade(key) {
    upgradeLevels[key]++;
    if (key === 'hull') {
      player.maxHp += TUNE.HULL_HP_BONUS;
      player.hp += TUNE.HULL_HP_BONUS;
    }
    paused = false;
    draftOptions = [];
  }

  function exportSave() {
    const text = JSON.stringify({ v: 5, motes: bankedMotes, galaxies: galaxies, lastPlayed: lastPlayed, deepestHeld: deepestHeld, names: NAMES, shop: shop });
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text)
        .then(() => { saveMessage = 'Copied to clipboard'; saveMessageUntil = currentTime + 2000; })
        .catch(() => { saveMessage = 'Copy failed'; saveMessageUntil = currentTime + 2000; });
    }
  }

  function importSave() {
    const text = prompt('Paste save JSON:');
    if (!text) return;
    try {
      const obj = JSON.parse(text);
      if (obj && obj.v === 5 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
        bankedMotes = obj.motes;
        galaxies = obj.galaxies.slice();
        deepestHeld = typeof obj.deepestHeld === 'number' ? obj.deepestHeld : galaxies.filter((g) => g === 1).length;
        NAMES = readNames(obj.names);
        shop = readShop(obj.shop);
        saveBank();
        saveMessage = 'Import successful';
      } else if (obj && obj.v === 4 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
        bankedMotes = obj.motes;
        galaxies = obj.galaxies.slice();
        deepestHeld = typeof obj.deepestHeld === 'number' ? obj.deepestHeld : galaxies.filter((g) => g === 1).length;
        NAMES = readNames(obj.names);
        shop = defaultShop();
        saveBank();
        saveMessage = 'Import successful';
      } else if (obj && obj.v === 3 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
        bankedMotes = obj.motes;
        galaxies = obj.galaxies.slice();
        deepestHeld = typeof obj.deepestHeld === 'number' ? obj.deepestHeld : galaxies.filter((g) => g === 1).length;
        NAMES = defaultNames();
        shop = defaultShop();
        saveBank();
        saveMessage = 'Import successful';
      } else if (obj && obj.v === 2 && typeof obj.motes === 'number' && Array.isArray(obj.galaxies) && obj.galaxies.length === 10) {
        bankedMotes = obj.motes;
        galaxies = obj.galaxies.slice();
        deepestHeld = galaxies.filter((g) => g === 1).length;
        NAMES = defaultNames();
        shop = defaultShop();
        saveBank();
        saveMessage = 'Import successful';
      } else if (obj && obj.v === 1 && typeof obj.motes === 'number') {
        bankedMotes = obj.motes;
        galaxies = new Array(10).fill(0);
        deepestHeld = 0;
        NAMES = defaultNames();
        shop = defaultShop();
        saveBank();
        saveMessage = 'Import successful';
      } else {
        saveMessage = 'Invalid save data';
      }
    } catch (e) {
      saveMessage = 'Invalid save data';
    }
    saveMessageUntil = currentTime + 2000;
  }

  function updateMotes(dt) {
    const reachRadius = TUNE.PICKUP_RADIUS * Math.pow(TUNE.REACH_MULT, upgradeLevels.reach) * Math.pow(TUNE.SHOP_REACH_MULT, shop.reach);

    for (let i = motes.length - 1; i >= 0; i--) {
      const mote = motes[i];
      const dx = player.x - mote.x;
      const dy = player.y - mote.y;
      const dist = Math.hypot(dx, dy);

      if (dist < TUNE.PLAYER_RADIUS) {
        motes.splice(i, 1);
        xp++;
        runMotes += Math.pow(TUNE.SHOP_SALVAGE_MULT, shop.salvage);
        checkLevelUp();
        continue;
      }

      if (dist <= reachRadius) {
        mote.speed = Math.min(TUNE.MOTE_SPEED, mote.speed + TUNE.MOTE_ACCEL * TUNE.MOTE_SPEED * dt);
        mote.x += (dx / dist) * mote.speed * dt;
        mote.y += (dy / dist) * mote.speed * dt;
      }
    }
  }

  function updateBullets(dt) {
    fireTimer += dt;
    const effectiveFireRate = TUNE.FIRE_RATE * Math.pow(TUNE.FIRE_RATE_MULT, upgradeLevels.fireRate) * Math.pow(TUNE.SHOP_CADENCE_MULT, shop.cadence);
    if (fireTimer >= effectiveFireRate) {
      const target = acquireTarget();
      if (target) {
        fireTimer = 0;

        const rx = target.x - player.x;
        const ry = target.y - player.y;
        const rvx = target.vx;
        const rvy = target.vy;

        const a = rvx * rvx + rvy * rvy - TUNE.BULLET_SPEED * TUNE.BULLET_SPEED;
        const b = 2 * (rx * rvx + ry * rvy);
        const c = rx * rx + ry * ry;

        let t;
        if (Math.abs(a) < 0.0001) {
          t = -c / b;
        } else {
          const disc = b * b - 4 * a * c;
          if (disc < 0) {
            t = 0;
          } else {
            const sq = Math.sqrt(disc);
            const t1 = (-b + sq) / (2 * a);
            const t2 = (-b - sq) / (2 * a);
            t = Math.min(t1 > 0 ? t1 : Infinity, t2 > 0 ? t2 : Infinity);
            if (!isFinite(t)) t = 0;
          }
        }

        const tx = target.x + rvx * t;
        const ty = target.y + rvy * t;

        const dx = tx - player.x;
        const dy = ty - player.y;
        const len = Math.hypot(dx, dy) || 1;
        const baseAngle = Math.atan2(dy, dx);

        const bulletCount = 1 + upgradeLevels.multishot;
        for (let i = 0; i < bulletCount; i++) {
          const offset = (i - (bulletCount - 1) / 2) * TUNE.MULTISHOT_SPREAD;
          const angle = baseAngle + offset;
          bullets.push({
            x: player.x,
            y: player.y - TUNE.THUMB_OFFSET,
            vx: Math.cos(angle) * TUNE.BULLET_SPEED,
            vy: Math.sin(angle) * TUNE.BULLET_SPEED,
            hit: new Set(),
            pierceRemaining: upgradeLevels.pierce
          });
        }
      }
    }

    for (const bullet of bullets) {
      const px = bullet.x;
      const py = bullet.y;
      const nx = bullet.x + bullet.vx * dt;
      const ny = bullet.y + bullet.vy * dt;

      let closest = null;
      let closestDist = Infinity;
      for (const enemy of enemies) {
        if (enemy.dead) continue;
        if (bullet.hit.has(enemy)) continue;
        if (segmentHitsCircle(px, py, nx, ny, enemy.x, enemy.y, TUNE.BULLET_RADIUS + enemy.radius)) {
          const dist = Math.hypot(enemy.x - px, enemy.y - py);
          if (dist < closestDist) {
            closestDist = dist;
            closest = enemy;
          }
        }
      }
      if (boss && !boss.dead && !bullet.hit.has(boss)) {
        if (segmentHitsCircle(px, py, nx, ny, boss.x, boss.y, TUNE.BULLET_RADIUS + TUNE.BOSS_RADIUS)) {
          const dist = Math.hypot(boss.x - px, boss.y - py);
          if (dist < closestDist) {
            closestDist = dist;
            closest = boss;
          }
        }
      }

      bullet.x = nx;
      bullet.y = ny;

      if (closest) {
        closest.hp -= TUNE.BULLET_DAMAGE * Math.pow(TUNE.DAMAGE_MULT, upgradeLevels.damage) * Math.pow(TUNE.SHOP_CALIBRE_MULT, shop.calibre);
        closest.flashUntil = currentTime + TUNE.HIT_FLASH_MS;

        const blen = Math.hypot(bullet.vx, bullet.vy) || 1;
        closest.x += (bullet.vx / blen) * TUNE.KNOCKBACK;
        closest.y += (bullet.vy / blen) * TUNE.KNOCKBACK;

        spawnParticle(nx, ny, 0, 0, TUNE.IMPACT_SPARK_MS, '255,255,255', 3);

        bullet.hit.add(closest);
        if (bullet.pierceRemaining > 0) {
          bullet.pierceRemaining--;
        } else {
          bullet.dead = true;
        }

        if (closest.hp <= 0) {
          closest.dead = true;
          shakeStrength = TUNE.SHAKE_KILL;

          const count = 6 + Math.floor(Math.random() * 3);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const burstSpeed = 60 + Math.random() * 80;
            spawnParticle(closest.x, closest.y, Math.cos(angle) * burstSpeed, Math.sin(angle) * burstSpeed, TUNE.DEATH_BURST_MS, '255,0,0', 2.5);
          }

          if (navigator.vibrate) navigator.vibrate(10);

          if (closest === boss) {
            galaxies[currentGalaxy] = 1;
            const heldCount = galaxies.filter((g) => g === 1).length;
            if (heldCount > deepestHeld) deepestHeld = heldCount;
            bankedMotes += Math.round(runMotes);
            saveBank();
            leapFrom = currentGalaxy;
            leapTo = Math.min(currentGalaxy + 1, GALAXY_DATA.length - 1);
            leapStartTime = currentTime;
            state = STATE.LEAP;
          } else {
            motes.push({ x: closest.x, y: closest.y, speed: 0 });
            waveKilled++;
          }
        }
      } else if (nx < 0 || nx > canvas.width || ny < 0 || ny > canvas.height) {
        bullet.dead = true;
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      if (bullets[i].dead) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      if (enemies[i].dead) enemies.splice(i, 1);
    }
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (state === STATE.MAP) {
      drawMap();
      return;
    }
    if (state === STATE.DEAD) {
      drawDead();
      return;
    }
    if (state === STATE.VICTORY) {
      drawVictory();
      return;
    }
    if (state === STATE.LEAP) {
      drawLeap();
      return;
    }
    if (state === STATE.SHOP) {
      drawShop();
      return;
    }
    drawRun();
  }

  function drawLeap() {
    const t = Math.min((currentTime - leapStartTime) / LEAP_DURATION_MS, 1);
    const fromHue = GALAXY_DATA[leapFrom].hue;
    const toHue = GALAXY_DATA[leapTo].hue;
    const hue = fromHue + (toHue - fromHue) * t;
    const flash = Math.sin(t * Math.PI);   // peaks at the midpoint, settles at both ends

    ctx.fillStyle = `hsl(${hue}, 80%, ${(12 + flash * 25).toFixed(2)}%)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = `rgba(255, 255, 255, ${(flash * 0.3).toFixed(3)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawRun() {
    const pal = galaxyPalette(currentGalaxy);
    ctx.fillStyle = pal.background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const shakeX = (Math.random() * 2 - 1) * shakeStrength;
    const shakeY = (Math.random() * 2 - 1) * shakeStrength;
    ctx.save();
    ctx.translate(shakeX, shakeY);

    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const age = (i + 1) / trail.length;
      ctx.fillStyle = `rgba(255, 255, 255, ${age * 0.35})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y - TUNE.THUMB_OFFSET, 6 * age, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const enemy of enemies) {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.rotate(enemy.angle);

      ctx.fillStyle = currentTime < enemy.flashUntil ? '#fff' : pal.accent;
      ctx.beginPath();
      if (enemy.type === 'lance') {
        // narrow dart/needle — thin and elongated, reads as fast even standing still
        ctx.moveTo(TUNE.LANCE_RADIUS * 2.5, 0);
        ctx.lineTo(-TUNE.LANCE_RADIUS * 1.3, TUNE.LANCE_RADIUS * 0.4);
        ctx.lineTo(-TUNE.LANCE_RADIUS * 1.3, -TUNE.LANCE_RADIUS * 0.4);
      } else if (enemy.type === 'anchor') {
        // heavy hexagon — no sharp nose, reads as a wall
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI / 3) * i;
          const hx = Math.cos(a) * TUNE.ANCHOR_RADIUS;
          const hy = Math.sin(a) * TUNE.ANCHOR_RADIUS;
          if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
        }
      } else {
        ctx.moveTo(13, 0);
        ctx.lineTo(-10, 8);
        ctx.lineTo(-10, -8);
      }
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    if (boss) {
      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.rotate(boss.angle);

      ctx.fillStyle = currentTime < boss.flashUntil ? '#fff' : pal.bossAccent;
      ctx.beginPath();
      ctx.moveTo(TUNE.BOSS_RADIUS * 1.3, 0);
      ctx.lineTo(-TUNE.BOSS_RADIUS, TUNE.BOSS_RADIUS * 0.85);
      ctx.lineTo(-TUNE.BOSS_RADIUS, -TUNE.BOSS_RADIUS * 0.85);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    ctx.fillStyle = '#fff';
    for (const bullet of bullets) {
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, TUNE.BULLET_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const p of particles) {
      const alpha = Math.max(0, 1 - (currentTime - p.born) / p.life);
      ctx.fillStyle = `rgba(${p.color}, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const mote of motes) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.beginPath();
      ctx.arc(mote.x, mote.y, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(mote.x, mote.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(player.x, player.y - TUNE.THUMB_OFFSET);
    ctx.rotate(player.angle);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-12, 10);
    ctx.lineTo(-12, -10);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    if (dragging) {
      const pulseT = Math.min((currentTime - touchStartTime) / TUNE.PULSE_DURATION, 1);
      const ringRadius = 40 + (1 - pulseT) * 30;
      const ringAlpha = 0.25 + (1 - pulseT) * 0.35;

      ctx.strokeStyle = `rgba(255, 255, 255, ${ringAlpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(originX, originY, ringRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(fingerX, fingerY, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    const barX = 20;
    const barY = 20;
    const barWidth = 200;
    const barHeight = 16;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(barX, barY, barWidth, barHeight);

    ctx.fillStyle = '#f00';
    ctx.fillRect(barX, barY, barWidth * (player.hp / player.maxHp), barHeight);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.font = '13px sans-serif';
    ctx.fillText('WAVE ' + wave + ' / ' + TUNE.WAVES_PER_GALAXY, barX, barY + barHeight + 20);
    if (wave < TUNE.WAVES_PER_GALAXY) {
      const remaining = Math.max(0, waveBudget - waveKilled);
      ctx.fillText('ENEMIES: ' + remaining, barX, barY + barHeight + 38);
    }

    const xpNeed = TUNE.XP_BASE + level * TUNE.XP_GROWTH;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(0, 0, canvas.width, TUNE.XP_BAR_HEIGHT);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fillRect(0, 0, canvas.width * Math.min(1, xp / xpNeed), TUNE.XP_BAR_HEIGHT);

    if (boss) {
      const bossBarY = TUNE.XP_BAR_HEIGHT;
      const bossBarHeight = 8;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(0, bossBarY, canvas.width, bossBarHeight);
      ctx.fillStyle = pal.bossAccent;
      ctx.fillRect(0, bossBarY, canvas.width * (boss.hp / boss.maxHp), bossBarHeight);

      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '12px sans-serif';
      ctx.fillText(NAMES.boss.toUpperCase(), canvas.width / 2, bossBarY + bossBarHeight + 14);
      ctx.textAlign = 'left';
    }

    if (paused) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      cardBounds = [];
      const cardW = Math.min(320, canvas.width - 40);
      const cardH = 90;
      const gap = 16;
      const totalH = draftOptions.length * cardH + (draftOptions.length - 1) * gap;
      let cy = (canvas.height - totalH) / 2;
      const cx = (canvas.width - cardW) / 2;

      ctx.textAlign = 'left';
      for (const opt of draftOptions) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(cx, cy, cardW, cardH);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.strokeRect(cx, cy, cardW, cardH);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(opt.name, cx + 14, cy + 26);

        ctx.font = '13px sans-serif';
        ctx.fillText(opt.desc, cx + 14, cy + 48);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = '12px sans-serif';
        ctx.fillText('Lv ' + upgradeLevels[opt.key], cx + 14, cy + 70);

        cardBounds.push({ x: cx, y: cy, w: cardW, h: cardH, key: opt.key });
        cy += cardH + gap;
      }
    }

    ctx.restore();
  }

  function drawDead() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText('THE DARK TAKES YOU', canvas.width / 2, canvas.height / 2);

    ctx.font = '16px sans-serif';
    const killer = deathCause === 'boss' ? NAMES.boss : NAMES.enemy;
    ctx.fillText('SLAIN BY ' + killer.toUpperCase(), canvas.width / 2, canvas.height / 2 + 26);
    ctx.fillText('LIGHT RECOVERED: ' + bankedMotes.toLocaleString(), canvas.width / 2, canvas.height / 2 + 50);
    ctx.fillText('Tap to restart', canvas.width / 2, canvas.height / 2 + 74);
  }

  function drawVictory() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText('GALAXY HELD', canvas.width / 2, canvas.height / 2);

    ctx.font = '16px sans-serif';
    ctx.fillText('LIGHT RECOVERED: ' + bankedMotes.toLocaleString(), canvas.width / 2, canvas.height / 2 + 32);
    ctx.fillText('Tap to continue', canvas.width / 2, canvas.height / 2 + 60);
  }

  function drawShop() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px sans-serif';
    ctx.fillText('SHOP', canvas.width / 2, 40);

    ctx.font = '15px sans-serif';
    ctx.fillText('LIGHT: ' + bankedMotes.toLocaleString(), canvas.width / 2, 66);

    const backW = 60;
    const backH = 28;
    shopBackBounds = { x: 14, y: 12, w: backW, h: backH };
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(shopBackBounds.x, shopBackBounds.y, backW, backH);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(shopBackBounds.x, shopBackBounds.y, backW, backH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('BACK', shopBackBounds.x + backW / 2, shopBackBounds.y + backH / 2 + 4);

    // Top-left only — the top-right corner belongs to the DOM debug toggle
    // (a real <button>, z-index 10000, always above the canvas). Anything
    // drawn there is buried under it, so the close X sits next to BACK instead.
    const closeSize = 28;
    const closeGap = 8;
    shopCloseBounds = { x: shopBackBounds.x + backW + closeGap, y: 12, w: closeSize, h: closeSize };
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(shopCloseBounds.x, shopCloseBounds.y, closeSize, closeSize);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.strokeRect(shopCloseBounds.x, shopCloseBounds.y, closeSize, closeSize);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('X', shopCloseBounds.x + closeSize / 2, shopCloseBounds.y + closeSize / 2 + 5);

    shopButtons = [];
    const rowH = 78;
    const rowsStartY = 96;
    const rowW = canvas.width - 40;
    const rowX = 20;

    for (let i = 0; i < SHOP_DEFS.length; i++) {
      const def = SHOP_DEFS[i];
      const level = shop[def.key];
      const maxed = level >= TUNE.SHOP_MAX_LEVEL;
      const cost = maxed ? null : shopUpgradeCost(level + 1);
      const canAfford = !maxed && bankedMotes >= cost;
      const rowY = rowsStartY + i * rowH;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.fillRect(rowX, rowY, rowW, rowH - 10);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(def.name + '   Lv ' + level + ' / ' + TUNE.SHOP_MAX_LEVEL, rowX + 12, rowY + 24);

      ctx.font = '12px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillText(def.desc, rowX + 12, rowY + 44);

      const btnW = 92;
      const btnH = 38;
      const btnX = rowX + rowW - btnW - 12;
      const btnY = rowY + (rowH - 10 - btnH) / 2;

      ctx.fillStyle = maxed ? 'rgba(255, 255, 255, 0.1)' : (canAfford ? 'rgba(255, 255, 255, 0.25)' : 'rgba(255, 255, 255, 0.08)');
      ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.strokeStyle = maxed ? 'rgba(255, 255, 255, 0.15)' : (canAfford ? 'rgba(255, 255, 255, 0.7)' : 'rgba(255, 255, 255, 0.25)');
      ctx.strokeRect(btnX, btnY, btnW, btnH);

      ctx.textAlign = 'center';
      ctx.fillStyle = maxed ? 'rgba(255, 255, 255, 0.3)' : (canAfford ? '#fff' : 'rgba(255, 255, 255, 0.5)');
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(maxed ? 'MAXED' : String(cost), btnX + btnW / 2, btnY + btnH / 2 + 5);

      shopButtons.push({ x: btnX, y: btnY, w: btnW, h: btnH, key: def.key, buyable: !maxed && canAfford });
    }

    ctx.textAlign = 'left';
  }

  function drawMap() {
    const HEADER_HEIGHT = 142;

    // TEMPORARY diagnostic — logs once so we can see what's actually running in
    // this browser, including any TUNE overrides. Safe to remove once confirmed.
    if (!corridorDebugLogged) {
      corridorDebugLogged = true;
      console.log('CORRIDOR_FOV=' + TUNE.CORRIDOR_FOV, 'CORRIDOR_NEAR_Z=' + TUNE.CORRIDOR_NEAR_Z, 'CORRIDOR_SPACING=' + TUNE.CORRIDOR_SPACING, 'mapScroll=' + mapScroll);
      for (let i = 0; i < GALAXY_DATA.length; i++) {
        const p = projectGalaxy(i, mapScroll);
        const z = TUNE.CORRIDOR_NEAR_Z + i * TUNE.CORRIDOR_SPACING - mapScroll;
        console.log('i=' + i, 'z=' + z, 'scale=' + (p ? p.s.toFixed(3) : 'CULLED'));
      }
    }

    // The void is always pure black. Any light on screen is emitted by the
    // galaxies themselves via additive glows below — never a background fill.
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('AFTERLIGHT', canvas.width / 2, 28);

    ctx.font = '14px sans-serif';
    ctx.fillText('LIGHT RECOVERED: ' + bankedMotes.toLocaleString(), canvas.width / 2, 50);

    const heldCount = galaxies.filter((g) => g === 1).length;
    ctx.font = '12px sans-serif';
    ctx.fillText('HELD: ' + heldCount + ' / ' + galaxies.length, canvas.width / 2, 68);
    ctx.fillText('DEEPEST HELD: ' + deepestHeld, canvas.width / 2, 84);

    if (decayedGalaxyIndex !== -1) {
      ctx.fillStyle = 'rgba(255, 140, 140, 0.9)';
      ctx.font = '11px sans-serif';
      ctx.fillText('THE DARK TOOK ' + NAMES.galaxies[decayedGalaxyIndex].toUpperCase() + ' WHILE YOU WERE AWAY.', canvas.width / 2, 100);
      ctx.fillStyle = '#fff';
    }

    const shopBtnW = 64;
    const shopBtnH = 28;
    const shopBtnX = 14;   // top-left — top-right is the debug panel's toggle button
    const shopBtnY = 12;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(shopBtnX, shopBtnY, shopBtnW, shopBtnH);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(shopBtnX, shopBtnY, shopBtnW, shopBtnH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('SHOP', shopBtnX + shopBtnW / 2, shopBtnY + shopBtnH / 2 + 4);
    shopButtonBounds = { x: shopBtnX, y: shopBtnY, w: shopBtnW, h: shopBtnH };

    startButtons = [];
    const smallBtnW = 70;
    const smallBtnH = 24;
    const smallBtnGap = 10;
    const smallBtnY = 108;
    const exportX = canvas.width / 2 - smallBtnW - smallBtnGap / 2;
    const importX = canvas.width / 2 + smallBtnGap / 2;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(exportX, smallBtnY, smallBtnW, smallBtnH);
    ctx.fillRect(importX, smallBtnY, smallBtnW, smallBtnH);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.strokeRect(exportX, smallBtnY, smallBtnW, smallBtnH);
    ctx.strokeRect(importX, smallBtnY, smallBtnW, smallBtnH);
    ctx.fillStyle = '#fff';
    ctx.font = '11px sans-serif';
    ctx.fillText('Export', exportX + smallBtnW / 2, smallBtnY + smallBtnH / 2 + 4);
    ctx.fillText('Import', importX + smallBtnW / 2, smallBtnY + smallBtnH / 2 + 4);
    startButtons.push({ x: exportX, y: smallBtnY, w: smallBtnW, h: smallBtnH, action: 'export' });
    startButtons.push({ x: importX, y: smallBtnY, w: smallBtnW, h: smallBtnH, action: 'import' });

    if (currentTime < saveMessageUntil) {
      ctx.font = '11px sans-serif';
      ctx.fillText(saveMessage, canvas.width / 2, smallBtnY + smallBtnH + 16);
    }

    // ---- The corridor. Ported from the reference — do not reinterpret. ----
    const lastIndex = GALAXY_DATA.length - 1;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HEADER_HEIGHT, canvas.width, canvas.height - HEADER_HEIGHT);
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';

    for (let i = lastIndex; i >= 0; i--) {
      const p = projectGalaxy(i, mapScroll);
      if (!p) continue;

      const data = GALAXY_DATA[i];
      const lit = galaxies[i] === 1;
      const power = lit ? 1 : 0.10;

      if (p.glow > 0.5) {
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.glow);
        grd.addColorStop(0, mapHsla(data.hue, 90, 72, 0.85 * power));
        grd.addColorStop(0.18, mapHsla(data.hue, 88, 58, 0.42 * power));
        grd.addColorStop(0.55, mapHsla(data.hue, 85, 45, 0.10 * power));
        grd.addColorStop(1, mapHsla(data.hue, 80, 40, 0));
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.glow, 0, Math.PI * 2);
        ctx.fill();
      }

      if (p.core > 0.4) {
        ctx.fillStyle = lit ? mapHsla(data.hue, 95, 66, 1) : mapHsla(data.hue, 60, 30, 0.5);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.core * (lit ? 0.42 : 0.30), 0, Math.PI * 2);
        ctx.fill();
      }

      if (!lit && p.core > 3) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = mapHsla(data.hue, 55, 40, 0.55);
        ctx.lineWidth = Math.max(1, 1.6 * p.s);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.core * 0.55, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
      }
    }

    // Keku: an eleventh object beyond galaxy 10, at the true vanishing point.
    // Not a galaxy — no lit/dark state, no drift, not in the tap-select loop
    // below. His depth never gets close enough to be more than a hard point.
    const kekuZ = TUNE.CORRIDOR_NEAR_Z + TUNE.KEKU_WORLD_Z - mapScroll;
    let kekuScreen = null;
    if (kekuZ > 40) {
      const kekuScale = TUNE.CORRIDOR_FOV / kekuZ;
      const kx = canvas.width / 2;
      const ky = canvas.height / 2;
      const kGlow = TUNE.CORRIDOR_GLOW * kekuScale;
      const kCore = TUNE.CORRIDOR_CORE * kekuScale;
      if (kGlow > 0.5) {
        const grd = ctx.createRadialGradient(kx, ky, 0, kx, ky, kGlow);
        grd.addColorStop(0, 'rgba(255,255,255,0.95)');
        grd.addColorStop(0.12, 'rgba(240,244,255,0.55)');
        grd.addColorStop(0.45, 'rgba(180,200,255,0.14)');
        grd.addColorStop(1, 'rgba(120,150,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(kx, ky, kGlow, 0, Math.PI * 2);
        ctx.fill();
      }
      if (kCore > 0.4) {
        ctx.fillStyle = 'rgba(255,255,255,1)';
        ctx.beginPath();
        ctx.arc(kx, ky, kCore * 0.55, 0, Math.PI * 2);
        ctx.fill();
      }
      kekuScreen = { x: kx, y: ky, core: kCore };
    }

    ctx.restore();

    if (kekuScreen) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = '600 12px ui-monospace, monospace';
      ctx.fillText('KEKU', kekuScreen.x, kekuScreen.y + Math.max(kekuScreen.core * 0.55, 10) + 16);
    }

    const sp = projectGalaxy(selectedGalaxy, mapScroll);
    if (sp && sp.core > 2) {
      const pulse = 1 + Math.sin(currentTime / 380) * 0.06;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.core * 0.95 * pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    const spal = galaxyPalette(selectedGalaxy);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '600 15px ui-monospace, monospace';
    ctx.fillText(NAMES.galaxies[selectedGalaxy].toUpperCase(), canvas.width / 2, canvas.height - 92);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.font = '11px ui-monospace, monospace';
    ctx.fillText(spal.star + '  ·  ' + spal.element, canvas.width / 2, canvas.height - 72);

    const descendW = 140;
    const descendH = 34;
    const descendX = canvas.width / 2 - descendW / 2;
    const descendY = canvas.height - 56;

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(descendX, descendY, descendW, descendH);
    ctx.fillStyle = '#fff';
    ctx.font = '600 13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(galaxies[selectedGalaxy] === 1 ? 'HOLD' : 'TAKE', canvas.width / 2, canvas.height - 34);

    descendBounds = { x: descendX, y: descendY, w: descendW, h: descendH };

    ctx.textAlign = 'left';
  }

  let lastTime = null;
  let currentTime = 0;

  function loop(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    currentTime = timestamp;

    if (state === STATE.RUN && !paused && !debugPaused) {
      update(dt);
      updateWave(dt);
      updateEnemies(dt);
      updateBoss(dt);
      updateBullets(dt);
      updateParticles(dt);
      updateMotes(dt);
      if (shakeStrength > 0) {
        shakeStrength = Math.max(0, shakeStrength - (TUNE.SHAKE_KILL / (TUNE.SHAKE_DECAY_MS / 1000)) * dt);
      }
    }
    if (state === STATE.LEAP && !debugPaused && currentTime - leapStartTime >= LEAP_DURATION_MS) {
      state = STATE.VICTORY;
    }
    if (state === STATE.MAP && !debugPaused) {
      updateMapScroll();
    }
    draw();
    requestAnimationFrame(loop);
  }

  openMap();
  requestAnimationFrame(loop);

  function setupDebugPanel() {
    const panel = document.createElement('div');
    panel.style.cssText = `
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      max-height: 100vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font: 12px monospace;
      padding: 10px;
      z-index: 9999;
      display: none;
      box-sizing: border-box;
    `;
    document.body.appendChild(panel);

    const title = document.createElement('div');
    title.textContent = 'DEV KIT (~ or 3-finger tap to toggle)';
    title.style.cssText = 'font-weight:bold; margin-bottom:8px;';
    panel.appendChild(title);

    const tabBar = document.createElement('div');
    tabBar.style.cssText = 'display:flex; gap:4px; margin-bottom:10px;';
    panel.appendChild(tabBar);

    const tuneTab = document.createElement('div');
    const namesTab = document.createElement('div');
    const saveTab = document.createElement('div');
    namesTab.style.display = 'none';
    saveTab.style.display = 'none';
    panel.appendChild(tuneTab);
    panel.appendChild(namesTab);
    panel.appendChild(saveTab);

    const tabButtons = [];
    function makeTabButton(label, target) {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.style.cssText = 'flex:1; padding:6px; background:rgba(255,255,255,0.15); color:#fff; border:none; cursor:pointer; font:12px monospace;';
      btn.onclick = () => {
        tuneTab.style.display = target === tuneTab ? 'block' : 'none';
        namesTab.style.display = target === namesTab ? 'block' : 'none';
        saveTab.style.display = target === saveTab ? 'block' : 'none';
        for (const b of tabButtons) b.style.background = b === btn ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.15)';
      };
      tabBar.appendChild(btn);
      tabButtons.push(btn);
      return btn;
    }
    const tuneTabBtn = makeTabButton('TUNE', tuneTab);
    makeTabButton('NAMES', namesTab);
    makeTabButton('SAVE', saveTab);
    tuneTabBtn.style.background = 'rgba(255,255,255,0.35)';

    // --- TUNE tab ---
    const overrideBanner = document.createElement('div');
    overrideBanner.textContent = 'TUNED VALUES ACTIVE — these override the source defaults';
    overrideBanner.style.cssText = 'display:none; background:rgba(255,200,0,0.2); color:#ffdd66; padding:6px; margin-bottom:8px; font-weight:bold; font-size:11px;';
    tuneTab.appendChild(overrideBanner);

    function anyTuneOverrideActive() {
      return Object.keys(TUNE_DEFAULTS).some((k) => TUNE[k] !== TUNE_DEFAULTS[k]);
    }
    function updateOverrideBanner() {
      overrideBanner.style.display = anyTuneOverrideActive() ? 'block' : 'none';
    }

    const resetBtn = document.createElement('button');
    resetBtn.textContent = 'RESET TO DEFAULTS';
    resetBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:10px; background:rgba(255,255,255,0.15); color:#fff; border:none;';
    tuneTab.appendChild(resetBtn);

    const sliderRefs = {};
    for (const key of Object.keys(TUNE)) {
      const value = TUNE[key];
      const max = value !== 0 ? Math.abs(value) * 4 : 10;
      const step = max / 200 || 0.01;

      const row = document.createElement('div');
      row.style.cssText = 'margin-bottom:8px;';

      const label = document.createElement('label');
      label.style.cssText = 'display:flex; justify-content:space-between;';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = key;
      const valueSpan = document.createElement('span');
      valueSpan.textContent = value;
      label.appendChild(nameSpan);
      label.appendChild(valueSpan);
      row.appendChild(label);

      const input = document.createElement('input');
      input.type = 'range';
      input.min = 0;
      input.max = max;
      input.step = step;
      input.value = value;
      input.style.cssText = 'width:100%;';
      input.oninput = () => {
        TUNE[key] = parseFloat(input.value);
        valueSpan.textContent = TUNE[key];
        saveTuneOverrides();
        updateOverrideBanner();
      };
      row.appendChild(input);

      tuneTab.appendChild(row);
      sliderRefs[key] = { input, valueSpan };
    }

    resetBtn.onclick = () => {
      for (const k of Object.keys(TUNE_DEFAULTS)) {
        TUNE[k] = TUNE_DEFAULTS[k];
        sliderRefs[k].input.value = TUNE[k];
        sliderRefs[k].valueSpan.textContent = TUNE[k];
      }
      try { localStorage.removeItem(TUNE_KEY); } catch (e) {}
      updateOverrideBanner();
    };

    updateOverrideBanner();

    function buildTuneCodeBlock(keys) {
      const lines = keys.map((k, i) => '    ' + k + ': ' + TUNE[k] + (i < keys.length - 1 ? ',' : ''));
      return '  const TUNE = {\n' + lines.join('\n') + '\n  };';
    }

    const copyCodeBtn = document.createElement('button');
    copyCodeBtn.textContent = 'Copy as code';
    copyCodeBtn.style.cssText = 'width:100%; padding:6px; margin-top:4px;';

    const copyChangedBtn = document.createElement('button');
    copyChangedBtn.textContent = 'Copy changed only';
    copyChangedBtn.style.cssText = 'width:100%; padding:6px; margin-top:4px;';

    const output = document.createElement('textarea');
    output.readOnly = true;
    output.style.cssText = 'width:100%; height:120px; margin-top:8px; font:11px monospace; box-sizing:border-box;';

    copyCodeBtn.onclick = () => {
      const text = buildTuneCodeBlock(Object.keys(TUNE));
      output.value = text;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    };

    copyChangedBtn.onclick = () => {
      const changed = Object.keys(TUNE).filter((k) => TUNE[k] !== TUNE_DEFAULTS[k]);
      const text = changed.length > 0 ? buildTuneCodeBlock(changed) : '  // no values changed from defaults';
      output.value = text;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    };

    tuneTab.appendChild(copyCodeBtn);
    tuneTab.appendChild(copyChangedBtn);
    tuneTab.appendChild(output);

    // --- NAMES tab ---
    const nameInputs = [];
    function makeNameRow(label, value, onChange) {
      const row = document.createElement('div');
      row.style.cssText = 'margin-bottom:8px;';
      const lbl = document.createElement('label');
      lbl.textContent = label;
      lbl.style.cssText = 'display:block; margin-bottom:2px;';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = value;
      input.style.cssText = 'width:100%; box-sizing:border-box; font:12px monospace;';
      input.oninput = () => onChange(input.value);
      row.appendChild(lbl);
      row.appendChild(input);
      namesTab.appendChild(row);
      nameInputs.push(input);
      return input;
    }

    for (let i = 0; i < NAMES.galaxies.length; i++) {
      makeNameRow('Galaxy ' + (i + 1), NAMES.galaxies[i], (v) => { NAMES.galaxies[i] = v; saveBank(); });
    }
    makeNameRow('Boss', NAMES.boss, (v) => { NAMES.boss = v; saveBank(); });
    makeNameRow('Enemy', NAMES.enemy, (v) => { NAMES.enemy = v; saveBank(); });

    function refreshNameInputs() {
      for (let i = 0; i < NAMES.galaxies.length; i++) nameInputs[i].value = NAMES.galaxies[i];
      nameInputs[NAMES.galaxies.length].value = NAMES.boss;
      nameInputs[NAMES.galaxies.length + 1].value = NAMES.enemy;
    }

    // --- SAVE tab: existing Export/Import plus dev tools ---
    const exportBtn = document.createElement('button');
    exportBtn.textContent = 'Export save';
    exportBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:6px;';
    exportBtn.onclick = exportSave;
    saveTab.appendChild(exportBtn);

    const importBtn = document.createElement('button');
    importBtn.textContent = 'Import save';
    importBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:12px;';
    importBtn.onclick = () => { importSave(); refreshNameInputs(); };
    saveTab.appendChild(importBtn);

    const wipeBtn = document.createElement('button');
    wipeBtn.textContent = 'Wipe save';
    wipeBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:6px; background:rgba(255,80,80,0.3); color:#fff; border:none;';
    wipeBtn.onclick = () => {
      if (!confirm('Wipe save? This cannot be undone.')) return;
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      bankedMotes = 0;
      galaxies = new Array(10).fill(0);
      deepestHeld = 0;
      NAMES = defaultNames();
      decayedGalaxyIndex = -1;
      saveBank();
      refreshNameInputs();
      saveMessage = 'Save wiped';
      saveMessageUntil = currentTime + 2000;
    };
    saveTab.appendChild(wipeBtn);

    const lightAllBtn = document.createElement('button');
    lightAllBtn.textContent = 'Light all galaxies';
    lightAllBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:6px;';
    lightAllBtn.onclick = () => {
      for (let i = 0; i < galaxies.length; i++) galaxies[i] = 1;
      if (galaxies.length > deepestHeld) deepestHeld = galaxies.length;
      saveBank();
      saveMessage = 'All galaxies lit';
      saveMessageUntil = currentTime + 2000;
    };
    saveTab.appendChild(lightAllBtn);

    const motesRow = document.createElement('div');
    motesRow.style.cssText = 'display:flex; gap:4px; margin-top:4px;';
    const motesInput = document.createElement('input');
    motesInput.type = 'number';
    motesInput.min = 0;
    motesInput.value = bankedMotes;
    motesInput.style.cssText = 'flex:1; min-width:0; box-sizing:border-box; font:12px monospace;';
    const motesBtn = document.createElement('button');
    motesBtn.textContent = 'Set motes';
    motesBtn.style.cssText = 'padding:6px;';
    motesBtn.onclick = () => {
      const n = parseInt(motesInput.value, 10);
      if (!isNaN(n) && n >= 0) {
        bankedMotes = n;
        saveBank();
        saveMessage = 'Motes set';
        saveMessageUntil = currentTime + 2000;
      }
    };
    motesRow.appendChild(motesInput);
    motesRow.appendChild(motesBtn);
    saveTab.appendChild(motesRow);

    function togglePanel() {
      const opening = panel.style.display === 'none';
      panel.style.display = opening ? 'block' : 'none';
      debugPaused = opening;
    }

    const toggleBtn = document.createElement('button');
    toggleBtn.textContent = '•••';
    toggleBtn.style.cssText = `
      position: fixed;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      color: #fff;
      font: 16px sans-serif;
      z-index: 10000;
    `;
    toggleBtn.addEventListener('click', togglePanel);
    document.body.appendChild(toggleBtn);

    window.addEventListener('keydown', (e) => {
      if (e.key === '~' || e.code === 'Backquote') togglePanel();
    });
  }

  if (DEBUG) setupDebugPanel();
</script>
</body>
</html>
