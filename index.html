  function updateMotes(dt) {
    const reachRadius = TUNE.PICKUP_RADIUS * Math.pow(TUNE.REACH_MULT, upgradeLevels.reach) * Math.pow(TUNE.SHOP_REACH_MULT, shop.reach);

    for (let i = motes.length - 1; i >= 0; i--) {
      const mote = motes[i];
      const dx = player.x - mote.x;
      const dy = player.y - mote.y;
      const dist = Math.hypot(dx, dy);

      if (dist < TUNE.PLAYER_RADIUS) {
        motes.splice(i, 1);
        xp++;
        runMotes += Math.pow(TUNE.SHOP_SALVAGE_MULT, shop.salvage);
        sfxMotePickup();
        checkLevelUp();
        continue;
      }

      if (dist <= reachRadius) {
        mote.speed = Math.min(TUNE.MOTE_SPEED, mote.speed + TUNE.MOTE_ACCEL * TUNE.MOTE_SPEED * dt);
        mote.x += (dx / dist) * mote.speed * dt;
        mote.y += (dy / dist) * mote.speed * dt;
      }
    }
  }

  function updateBullets(dt) {
    fireTimer += dt;
    const effectiveFireRate = TUNE.FIRE_RATE * Math.pow(TUNE.FIRE_RATE_MULT, upgradeLevels.fireRate) * Math.pow(TUNE.SHOP_CADENCE_MULT, shop.cadence) * acidFireRateMult();
    if (fireTimer >= effectiveFireRate) {
      const target = acquireTarget();
      if (target) {
        fireTimer = 0;

        const rx = target.x - player.x;
        const ry = target.y - player.y;
        const rvx = target.vx;
        const rvy = target.vy;

        const a = rvx * rvx + rvy * rvy - TUNE.BULLET_SPEED * TUNE.BULLET_SPEED;
        const b = 2 * (rx * rvx + ry * rvy);
        const c = rx * rx + ry * ry;

        let t;
        if (Math.abs(a) < 0.0001) {
          t = -c / b;
        } else {
          const disc = b * b - 4 * a * c;
          if (disc < 0) {
            t = 0;
          } else {
            const sq = Math.sqrt(disc);
            const t1 = (-b + sq) / (2 * a);
            const t2 = (-b - sq) / (2 * a);
            t = Math.min(t1 > 0 ? t1 : Infinity, t2 > 0 ? t2 : Infinity);
            if (!isFinite(t)) t = 0;
          }
        }

        const tx = target.x + rvx * t;
        const ty = target.y + rvy * t;

        const dx = tx - player.x;
        const dy = ty - player.y;
        const len = Math.hypot(dx, dy) || 1;
        const baseAngle = Math.atan2(dy, dx);

        const bulletCount = 1 + upgradeLevels.multishot;
        for (let i = 0; i < bulletCount; i++) {
          const offset = (i - (bulletCount - 1) / 2) * TUNE.MULTISHOT_SPREAD;
          const angle = baseAngle + offset;
          bullets.push({
            x: player.x,
            y: player.y - TUNE.THUMB_OFFSET,
            vx: Math.cos(angle) * TUNE.BULLET_SPEED,
            vy: Math.sin(angle) * TUNE.BULLET_SPEED,
            hit: new Set(),
            pierceRemaining: upgradeLevels.pierce
          });
        }
        sfxFire();
      }
    }

    for (const bullet of bullets) {
      const px = bullet.x;
      const py = bullet.y;
      const nx = bullet.x + bullet.vx * dt;
      const ny = bullet.y + bullet.vy * dt;

      let closest = null;
      let closestDist = Infinity;
      for (const enemy of enemies) {
        if (enemy.dead) continue;
        if (bullet.hit.has(enemy)) continue;
        if (segmentHitsCircle(px, py, nx, ny, enemy.x, enemy.y, TUNE.BULLET_RADIUS + enemy.radius)) {
          const dist = Math.hypot(enemy.x - px, enemy.y - py);
          if (dist < closestDist) {
            closestDist = dist;
            closest = enemy;
          }
        }
      }
      if (boss && !boss.dead && !bullet.hit.has(boss)) {
        if (segmentHitsCircle(px, py, nx, ny, boss.x, boss.y, TUNE.BULLET_RADIUS + boss.radius)) {
          const dist = Math.hypot(boss.x - px, boss.y - py);
          if (dist < closestDist) {
            closestDist = dist;
            closest = boss;
          }
        }
      }

      bullet.x = nx;
      bullet.y = ny;

      if (closest) {
        closest.hp -= TUNE.BULLET_DAMAGE * Math.pow(TUNE.DAMAGE_MULT, upgradeLevels.damage) * Math.pow(TUNE.SHOP_CALIBRE_MULT, shop.calibre);
        closest.flashUntil = currentTime + TUNE.HIT_FLASH_MS;

        // Rock: "immune to knockback... they do not stagger."
        if (currentElement() !== 'Rock') {
          const blen = Math.hypot(bullet.vx, bullet.vy) || 1;
          closest.x += (bullet.vx / blen) * TUNE.KNOCKBACK;
          closest.y += (bullet.vy / blen) * TUNE.KNOCKBACK;
        }

        // Sparks off the enemy's own light, not white -- white is sacred.
        spawnParticle(nx, ny, 0, 0, TUNE.IMPACT_SPARK_MS, hslToRgbTriplet(currentHue(), 0.7, 0.75), 3);
        sfxHit();

        bullet.hit.add(closest);
        if (bullet.pierceRemaining > 0) {
          bullet.pierceRemaining--;
        } else {
          bullet.dead = true;
        }

        if (closest.hp <= 0) {
          closest.dead = true;
          shakeStrength = TUNE.SHAKE_KILL;

          // The enemy's own light scattering, not a fixed universal red --
          // colour is the galaxy, all the way down to its debris.
          const burstColor = hslToRgbTriplet(currentHue(), 0.8, 0.6);
          const count = 6 + Math.floor(Math.random() * 3);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const burstSpeed = 60 + Math.random() * 80;
            spawnParticle(closest.x, closest.y, Math.cos(angle) * burstSpeed, Math.sin(angle) * burstSpeed, TUNE.DEATH_BURST_MS, burstColor, 2.5);
          }

          if (navigator.vibrate) navigator.vibrate(10);

          // Block 25 -- "applies to EVERY enemy in that galaxy, including
          // the boss": this runs before the boss-transition branch below,
          // so a boss kill still leaves its fire pool / chains its
          // lightning / shatters its shards at its death position first.
          applyElementalDeathEffect(closest);

          if (closest === boss) {
            sfxBossDies();
            if (endlessMode) {
              // No map, no menu, no break -- straight into the next depth.
              // Nothing is held here, so none of the story-mode galaxy/Keku
              // bookkeeping below applies; the colour shift IS the transition,
              // via galaxyPalette() cycling on the incremented depth next frame.
              if (closest.isFragment) {
                // Huge mote drop -- individual motes, same collection
                // mechanic as any other kill, just 500 of them.
                for (let i = 0; i < TUNE.KEKU_MOTES; i++) {
                  const jx = (Math.random() * 2 - 1) * 12;
                  const jy = (Math.random() * 2 - 1) * 12;
                  motes.push({ x: closest.x + jx, y: closest.y + jy, speed: 0 });
                }
                fragmentsKilled++;
              }
              endlessDepth++;
              if (endlessDepth > bestDepth) bestDepth = endlessDepth;
              // Endless never passes through restart() between depths (no
              // map, no break) -- clear the previous depth's element hazards
              // by hand, or a Fire pool could sit there rendering in the
              // NEW depth's colour, implying a hazard that isn't real there.
              firePools.length = 0;
              plasmaTrails.length = 0;
              lightningBolts.length = 0;
              shards.length = 0;
              saveBank();
              startWave(1);
              startDrone();   // resume -- the tell silenced it; harmless no-op if it never stopped
            } else {
              sfxGalaxyCleared();
              stopDrone();
              galaxies[currentGalaxy] = 1;
              const heldCount = galaxies.filter((g) => g === 1).length;
              if (heldCount > deepestHeld) deepestHeld = heldCount;
              if (kekuLineFirstTime(0)) {
                victoryKekuLine = { text: KEKU_LINES[0], attributed: false };
              } else if (heldCount === 10 && kekuLineFirstTime(5)) {
                victoryKekuLine = { text: KEKU_LINES[5], attributed: true };
              } else {
                victoryKekuLine = null;
              }
              bankedMotes += Math.round(runMotes);
              saveBank();
              leapFrom = currentGalaxy;
              leapTo = Math.min(currentGalaxy + 1, GALAXY_DATA.length - 1);
              leapStartTime = currentTime;
              state = STATE.LEAP;
            }
          } else {
            sfxKill();
            motes.push({ x: closest.x, y: closest.y, speed: 0 });
            waveKilled++;
          }
        }
      } else if (nx < 0 || nx > canvas.width || ny < 0 || ny > canvas.height) {
        bullet.dead = true;
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      if (bullets[i].dead) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      if (enemies[i].dead) enemies.splice(i, 1);
    }
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (state === STATE.OPENING) {
      drawOpening();
      return;
    }
    if (state === STATE.MAP) {
      drawMap();
      return;
    }
    if (state === STATE.DEAD) {
      drawDead();
      return;
    }
    if (state === STATE.VICTORY) {
      drawVictory();
      return;
    }
    if (state === STATE.LEAP) {
      drawLeap();
      return;
    }
    if (state === STATE.SHOP) {
      drawShop();
      return;
    }
    drawRun();
  }

  function drawOpening() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '17px sans-serif';
    const lines = [
      'The universe is going out.',
      'Not dying. Being put out.',
      'Someone is collecting the light, and taking it inward.',
      'You are the only thing they cannot digest.'
    ];
    const maxW = Math.min(420, canvas.width - 60);
    let ly = canvas.height / 2 - 70;
    for (const paragraph of lines) {
      const wrapped = wrapTextLines(paragraph, maxW);
      for (const line of wrapped) {
        ctx.fillText(line, canvas.width / 2, ly);
        ly += 26;
      }
    }

    const btnW = 220;
    const btnH = 44;
    const btnX = canvas.width / 2 - btnW / 2;
    const btnY = ly + 40;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(btnX, btnY, btnW, btnH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('TAKE THE FIRST', canvas.width / 2, btnY + btnH / 2 + 5);
    ctx.textAlign = 'left';
  }

  // Galaxy cleared: floods with the JUST-CLEARED galaxy's own colour (not
  // blended toward the next one -- this is a celebration of what was just
  // held), then fades all the way to black as the leap begins. Not a
  // symmetric pulse: quick rise, slower decay to #000, never tinted white.
  function drawLeap() {
    const t = Math.min((currentTime - leapStartTime) / LEAP_DURATION_MS, 1);
    const hue = GALAXY_DATA[leapFrom].hue;
    const intensity = t < TUNE.LEAP_FLOOD_PEAK
      ? t / TUNE.LEAP_FLOOD_PEAK
      : Math.max(0, 1 - (t - TUNE.LEAP_FLOOD_PEAK) / (1 - TUNE.LEAP_FLOOD_PEAK));

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = `hsl(${hue}, 85%, ${(intensity * TUNE.LEAP_FLOOD_LIGHTNESS).toFixed(1)}%)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Player damage: a hard red vignette at the screen edges, not a ship
  // recolour. player.flashUntil is already set (currentTime + HIT_FLASH_MS)
  // at both contact-damage sites; continuous contact keeps re-setting it
  // every frame, so the vignette stays hot while you're being hit and only
  // starts fading VIGNETTE_FADE_MS after contact actually breaks.
  function drawDamageVignette() {
    const hitAge = currentTime - (player.flashUntil - TUNE.HIT_FLASH_MS);
    if (hitAge < 0 || hitAge > TUNE.VIGNETTE_FADE_MS) return;
    const alpha = TUNE.VIGNETTE_MAX_ALPHA * (1 - hitAge / TUNE.VIGNETTE_FADE_MS);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const outerR = Math.hypot(cx, cy);
    const grd = ctx.createRadialGradient(cx, cy, outerR * TUNE.VIGNETTE_INNER_RADIUS_FRAC, cx, cy, outerR);
    grd.addColorStop(0, 'rgba(255, 45, 85, 0)');       // DAMAGE_COLOR, transparent at centre
    grd.addColorStop(1, `rgba(255, 45, 85, ${alpha.toFixed(3)})`);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawRun() {
    // Endless recombines the ten authored star types rather than ever
    // introducing new ones -- the hue index just wraps as depth grows, but
    // brightness is fed the raw, unwrapped depth so it keeps climbing (and
    // saturates, rather than resetting to "bare" every ten waves).
    const pal = endlessMode
      ? galaxyPalette((endlessDepth - 1) % GALAXY_DATA.length, endlessDepth - 1)
      : galaxyPalette(currentGalaxy);
    // No fill here -- the void is always pure #000. draw() already cleared
    // the canvas to black before dispatching here; nothing goes behind the
    // entities, ever.

    const shakeX = (Math.random() * 2 - 1) * shakeStrength;
    const shakeY = (Math.random() * 2 - 1) * shakeStrength;
    ctx.save();
    ctx.translate(shakeX, shakeY);
    // Neon wireframe: everything from here to the matching ctx.restore() is
    // additive -- light adds to light, and adds nothing to the black void.
    // save()/restore() captures globalCompositeOperation, so this doesn't
    // need to be reset by hand afterward.
    ctx.globalCompositeOperation = 'lighter';

    // Block 25 -- elemental ground hazards, drawn first so they read as
    // background: something you stand IN, underneath every entity, rather
    // than an entity themselves. Always the galaxy's own colour.
    for (const pool of firePools) {
      const remain = Math.max(0, (pool.until - currentTime) / (TUNE.ELEMENT_FIRE_POOL_DURATION * 1000));
      const pulse = 0.7 + 0.3 * Math.sin(currentTime / 90);
      ctx.fillStyle = pal.bossAccent;
      ctx.globalAlpha = 0.3 * remain * pulse;
      ctx.beginPath();
      ctx.arc(pool.x, pool.y, TUNE.ELEMENT_FIRE_POOL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (const seg of plasmaTrails) {
      const remain = Math.max(0, (seg.until - currentTime) / (TUNE.ELEMENT_PLASMA_TRAIL_DURATION * 1000));
      ctx.fillStyle = pal.tier2;
      ctx.globalAlpha = 0.4 * remain;
      ctx.beginPath();
      ctx.arc(seg.x, seg.y, TUNE.ELEMENT_PLASMA_TRAIL_RADIUS * Math.max(0.35, remain), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (pal.element === 'Radiation') {
      ctx.strokeStyle = pal.lightAccent;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.22;
      for (const enemy of enemies) {
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, TUNE.ELEMENT_RADIATION_RADIUS + enemy.radius, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (boss) {
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, TUNE.ELEMENT_RADIATION_RADIUS + boss.radius, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // A tapering stroked line through the trail history, not a stack of
    // filled dots -- a dot sitting at the newest (most opaque, widest)
    // sample reads as a second object under the hull. A thin line has
    // nothing to read as separately from the ship it's converging into.
    // Long and bright on purpose -- in a crowd of enemies this streak is
    // how the player relocates themselves at a glance, so it needs to read
    // from much farther away than a subtle polish detail would.
    for (let i = 0; i < trail.length - 1; i++) {
      const a = trail[i];
      const b = trail[i + 1];
      const age = (i + 1) / trail.length;
      ctx.strokeStyle = `rgba(255, 255, 255, ${age * 0.65})`;
      ctx.lineWidth = 6 * age;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y - TUNE.THUMB_OFFSET);
      ctx.lineTo(b.x, b.y - TUNE.THUMB_OFFSET);
      ctx.stroke();
    }

    for (const enemy of enemies) {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.rotate(enemy.angle);

      // Tier is shape, SIZE, stroke weight and brightness -- never a
      // different hue. Hollow/Lance/Anchor are all pal's ONE hue this
      // galaxy; SHIP_SCALE/SHIP_STROKE_PX (top of file) are what make the
      // tier hierarchy readable instantly instead of just by shape alone.
      // Block 23: hit feedback is a flash to white, full stop.
      const flashing = currentTime < enemy.flashUntil;
      if (enemy.type === 'lance') {
        ctx.scale(SHIP_SCALE.lance, SHIP_SCALE.lance);
        strokeShipPath(SHIP_LANCE, flashing ? '#fff' : pal.tier2, SHIP_STROKE_PX.lance / SHIP_SCALE.lance);
      } else if (enemy.type === 'anchor') {
        const color = flashing ? '#fff' : pal.tier3;
        ctx.scale(SHIP_SCALE.anchor, SHIP_SCALE.anchor);
        strokeShipPath(SHIP_ANCHOR, color, SHIP_STROKE_PX.anchor / SHIP_SCALE.anchor);

        // Fracture lines -- surface detail, not part of the outline. Same
        // colour as the hull (tier is brightness/size/stroke, never hue).
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(4, 10);
        ctx.lineTo(-6, 4);
        ctx.lineTo(2, -8);
        ctx.moveTo(-8, 12);
        ctx.lineTo(-4, -2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        const color = flashing ? '#fff' : pal.tier1;
        ctx.scale(SHIP_SCALE.hollow, SHIP_SCALE.hollow);
        strokeShipPath(SHIP_HOLLOW, color, SHIP_STROKE_PX.hollow / SHIP_SCALE.hollow);

        // A small hot core -- same hue as the hull, additively stacked so
        // it reads as brighter without ever switching colour.
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.restore();
    }

    if (boss) {
      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.rotate(boss.angle);

      // WHITE IS SACRED as a resting colour -- and Keku is one of the two
      // things that ever gets to wear it, same as the Warden. A hit is
      // still a flash to white either way, same as every other entity.
      const color = currentTime < boss.flashUntil ? '#fff' : (boss.isFragment ? '#fff' : pal.bossAccent);
      strokeShipPath(bossShipPoints(boss.radius), color, 2.5);

      // The maw: a ring at the centre, open, not filled -- this is a mouth,
      // not just a bigger hull.
      ctx.beginPath();
      ctx.arc(0, 0, boss.radius * 0.4, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }

    // Block 25 -- Electric's chain (a fading line per arc) and Crystal's
    // shards (small flying fragments), both galaxy-coloured.
    for (const bolt of lightningBolts) {
      const age = (currentTime - bolt.born) / bolt.life;
      ctx.strokeStyle = pal.bossAccent;
      ctx.globalAlpha = Math.max(0, 1 - age);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bolt.x1, bolt.y1);
      ctx.lineTo(bolt.x2, bolt.y2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    for (const s of shards) {
      ctx.fillStyle = pal.tier3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, TUNE.ELEMENT_SHARD_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    // Bullets: hot white streaks -- the Warden's own fire, an extension of
    // the one sacred-white ship that fired them, not galaxy-coloured light.
    for (const bullet of bullets) {
      const speed = Math.hypot(bullet.vx, bullet.vy) || 1;
      const bx = -bullet.vx / speed;
      const by = -bullet.vy / speed;
      const grd = ctx.createLinearGradient(
        bullet.x, bullet.y,
        bullet.x + bx * TUNE.BULLET_TRAIL_LENGTH, bullet.y + by * TUNE.BULLET_TRAIL_LENGTH
      );
      grd.addColorStop(0, `rgba(255, 255, 255, ${TUNE.BULLET_TRAIL_ALPHA})`);
      grd.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.strokeStyle = grd;
      ctx.lineWidth = TUNE.BULLET_RADIUS;
      ctx.beginPath();
      ctx.moveTo(bullet.x, bullet.y);
      ctx.lineTo(bullet.x + bx * TUNE.BULLET_TRAIL_LENGTH, bullet.y + by * TUNE.BULLET_TRAIL_LENGTH);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, TUNE.BULLET_RADIUS * TUNE.BULLET_CORE_SCALE, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const p of particles) {
      const alpha = Math.max(0, 1 - (currentTime - p.born) / p.life);
      ctx.fillStyle = `rgba(${p.color}, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Motes: small, precious points -- not confetti, not white. The same
    // depth-brightness curve as everything else means they're barely a glow
    // in galaxy 1 and properly hot by galaxy 10.
    for (const mote of motes) {
      ctx.fillStyle = pal.lightAccent;
      ctx.globalAlpha = 0.22;
      ctx.beginPath();
      ctx.arc(mote.x, mote.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.beginPath();
      ctx.arc(mote.x, mote.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(player.x, player.y - TUNE.THUMB_OFFSET);
    ctx.rotate(player.angle);
    ctx.scale(SHIP_SCALE.warden, SHIP_SCALE.warden);

    // Always white-hot, never flashed or recoloured -- player damage reads
    // through the screen-edge vignette instead (see below), not the ship.
    // lineWidth is pre-divided by the scale above so the actual on-screen
    // stroke is SHIP_STROKE_PX.warden regardless of how big the hull is.
    strokeShipPath(SHIP_WARDEN, '#fff', SHIP_STROKE_PX.warden / SHIP_SCALE.warden);

    // Panel lines -- surface detail, not part of the outline. Three seams
    // running LENGTHWISE (nose to tail), not crossbars, so they read as
    // hull plating rather than structural ribs.
    ctx.strokeStyle = '#fff';
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-12, 0);
    ctx.moveTo(9, 4);
    ctx.lineTo(-10, 8);
    ctx.moveTo(9, -4);
    ctx.lineTo(-10, -8);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.restore();

    drawDamageVignette();

    if (dragging) {
      const pulseT = Math.min((currentTime - touchStartTime) / TUNE.PULSE_DURATION, 1);
      const ringRadius = 40 + (1 - pulseT) * 30;
      const ringAlpha = 0.25 + (1 - pulseT) * 0.35;

      ctx.strokeStyle = `rgba(255, 255, 255, ${ringAlpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(originX, originY, ringRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(fingerX, fingerY, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    if (endlessMode) {
      // The only UI in endless: a depth counter. No health bar, no XP bar,
      // no wave/enemy text, no boss name/bar -- deliberately. You are not
      // meant to manage this the way you manage a story run.
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('DEPTH ' + endlessDepth, canvas.width / 2, 30);
      ctx.textAlign = 'left';
    } else {
      const barX = 20;
      const barY = 20;
      const barWidth = 200;
      const barHeight = 16;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(barX, barY, barWidth, barHeight);

      ctx.fillStyle = DAMAGE_COLOR;
      ctx.fillRect(barX, barY, barWidth * (player.hp / player.maxHp), barHeight);

      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.font = '13px sans-serif';
      ctx.fillText('WAVE ' + wave + ' / ' + TUNE.WAVES_PER_GALAXY, barX, barY + barHeight + 20);
      if (wave < TUNE.WAVES_PER_GALAXY) {
        const remaining = Math.max(0, waveBudget - waveKilled);
        ctx.fillText('ENEMIES: ' + remaining, barX, barY + barHeight + 38);
      }

      const xpNeed = TUNE.XP_BASE + level * TUNE.XP_GROWTH;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(0, 0, canvas.width, TUNE.XP_BAR_HEIGHT);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.fillRect(0, 0, canvas.width * Math.min(1, xp / xpNeed), TUNE.XP_BAR_HEIGHT);

      if (boss) {
        const bossBarY = TUNE.XP_BAR_HEIGHT;
        const bossBarHeight = 8;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fillRect(0, bossBarY, canvas.width, bossBarHeight);
        ctx.fillStyle = pal.bossAccent;
        ctx.fillRect(0, bossBarY, canvas.width * (boss.hp / boss.maxHp), bossBarHeight);

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '12px sans-serif';
        ctx.fillText(NAMES.boss.toUpperCase(), canvas.width / 2, bossBarY + bossBarHeight + 14);
        ctx.textAlign = 'left';
      }
    }

    // Block 25 -- Acid/Ice are invisible otherwise ("if the player cannot
    // see why they are taking damage, the effect has failed"): a plain
    // stack count, in the galaxy's own colour, is the whole readability fix.
    const acidStacks = player.acidStackUntil.length;
    const iceStacks = player.iceStackUntil.length;
    if (acidStacks > 0 || iceStacks > 0) {
      ctx.textAlign = 'left';
      ctx.font = 'bold 12px sans-serif';
      let statusY = endlessMode ? 50 : 20 + 16 + 56;
      ctx.fillStyle = pal.tier2;
      if (acidStacks > 0) {
        ctx.fillText('CORRODED x' + acidStacks, 20, statusY);
        statusY += 16;
      }
      if (iceStacks > 0) {
        ctx.fillText('SLOWED x' + iceStacks, 20, statusY);
      }
      ctx.fillStyle = '#fff';
    }

    if (!paused) {
      // Bottom-left — the top of the screen is already the health bar, XP
      // bar, wave/enemy text, and (when DEBUG is on) the boss bar and the
      // DOM debug toggle at top-right. Bottom-left stays clear of all of it.
      const pauseBtnW = 56;
      const pauseBtnH = 26;
      pauseButtonBounds = { x: 14, y: canvas.height - pauseBtnH - 14, w: pauseBtnW, h: pauseBtnH };
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(pauseButtonBounds.x, pauseButtonBounds.y, pauseBtnW, pauseBtnH);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(pauseButtonBounds.x, pauseButtonBounds.y, pauseBtnW, pauseBtnH);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('PAUSE', pauseButtonBounds.x + pauseBtnW / 2, pauseButtonBounds.y + pauseBtnH / 2 + 4);
      ctx.textAlign = 'left';
    } else {
      pauseButtonBounds = null;
    }

    if (paused && draftOptions.length === 0) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 70);

      const menuBtnW = 160;
      const menuBtnH = 40;
      const menuBtnX = canvas.width / 2 - menuBtnW / 2;

      muteButtonBounds = { x: menuBtnX, y: canvas.height / 2 - 20, w: menuBtnW, h: menuBtnH };
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(muteButtonBounds.x, muteButtonBounds.y, menuBtnW, menuBtnH);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.strokeRect(muteButtonBounds.x, muteButtonBounds.y, menuBtnW, menuBtnH);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(muted ? 'UNMUTE' : 'MUTE', canvas.width / 2, muteButtonBounds.y + menuBtnH / 2 + 5);

      resumeButtonBounds = { x: menuBtnX, y: muteButtonBounds.y + menuBtnH + 16, w: menuBtnW, h: menuBtnH };
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(resumeButtonBounds.x, resumeButtonBounds.y, menuBtnW, menuBtnH);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.strokeRect(resumeButtonBounds.x, resumeButtonBounds.y, menuBtnW, menuBtnH);
      ctx.fillStyle = '#fff';
      ctx.fillText('RESUME', canvas.width / 2, resumeButtonBounds.y + menuBtnH / 2 + 5);

      // Damage-red, not the neutral white used above -- this one costs you
      // the run (and a held galaxy, same as dying), so it reads as the
      // destructive option rather than a peer of MUTE/RESUME.
      abandonButtonBounds = { x: menuBtnX, y: resumeButtonBounds.y + menuBtnH + 16, w: menuBtnW, h: menuBtnH };
      ctx.fillStyle = 'rgba(255, 45, 85, 0.15)';
      ctx.fillRect(abandonButtonBounds.x, abandonButtonBounds.y, menuBtnW, menuBtnH);
      ctx.strokeStyle = 'rgba(255, 45, 85, 0.6)';
      ctx.strokeRect(abandonButtonBounds.x, abandonButtonBounds.y, menuBtnW, menuBtnH);
      ctx.fillStyle = 'rgba(255, 200, 200, 0.9)';
      ctx.fillText('ABANDON RUN', canvas.width / 2, abandonButtonBounds.y + menuBtnH / 2 + 5);
      ctx.fillStyle = '#fff';
    } else {
      muteButtonBounds = null;
      resumeButtonBounds = null;
      abandonButtonBounds = null;
    }

    if (paused && draftOptions.length > 0) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      cardBounds = [];
      const cardW = Math.min(320, canvas.width - 40);
      const cardH = 90;
      const gap = 16;
      const totalH = draftOptions.length * cardH + (draftOptions.length - 1) * gap;
      let cy = (canvas.height - totalH) / 2;
      const cx = (canvas.width - cardW) / 2;

      ctx.textAlign = 'left';
      for (const opt of draftOptions) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(cx, cy, cardW, cardH);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.strokeRect(cx, cy, cardW, cardH);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(opt.name, cx + 14, cy + 26);

        ctx.font = '13px sans-serif';
        ctx.fillText(opt.desc, cx + 14, cy + 48);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = '12px sans-serif';
        ctx.fillText('Lv ' + upgradeLevels[opt.key], cx + 14, cy + 70);

        cardBounds.push({ x: cx, y: cy, w: cardW, h: cardH, key: opt.key });
        cy += cardH + gap;
      }
    }

    if (kekuMessageActive) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('KEKU', canvas.width / 2, canvas.height / 2 - 30);

      ctx.fillStyle = '#fff';
      ctx.font = '17px sans-serif';
      const maxW = Math.min(420, canvas.width - 60);
      const lines = wrapTextLines('"' + kekuMessageText + '"', maxW);
      let ly = canvas.height / 2;
      for (const line of lines) {
        ctx.fillText(line, canvas.width / 2, ly);
        ly += 26;
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '12px sans-serif';
      ctx.fillText('Tap to continue', canvas.width / 2, ly + 20);
      ctx.textAlign = 'left';
    }

    if (galaxyCardActive) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const card = GALAXY_CARDS[galaxyCardIndex];
      const maxW = Math.min(420, canvas.width - 60);
      ctx.textAlign = 'center';

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(card.title, canvas.width / 2, canvas.height / 2 - 60);

      ctx.font = '15px sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      let ly = canvas.height / 2 - 16;
      for (const paragraph of card.lines) {
        const wrapped = wrapTextLines(paragraph, maxW);
        for (const line of wrapped) {
          ctx.fillText(line, canvas.width / 2, ly);
          ly += 22;
        }
        ly += 12;   // extra gap between the place line and the people line
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '12px sans-serif';
      ctx.fillText('Tap to continue', canvas.width / 2, ly + 8);
      ctx.textAlign = 'left';
    }

    ctx.restore();

    // The Fragment's whiteout, drawn last and in plain (un-shaken, un-translated)
    // canvas coordinates so it uniformly covers everything -- world, HUD,
    // pause button, all of it. "The player cannot see properly. That is the
    // point" -- it isn't scoped to spare the UI.
    if (whiteoutAmount > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${whiteoutAmount})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  function wrapTextLines(text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let current = '';
    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      if (current && ctx.measureText(test).width > maxWidth) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  // Keku overheard, not spoken to the player -- unlabelled, dim, quoted, as
  // if it drifted in from somewhere else. Distinct from the direct, attributed
  // treatment his lines get everywhere else once he notices the player.
  function drawOverheardLine(text, startY) {
    ctx.textAlign = 'center';
    ctx.font = 'italic 13px sans-serif';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    const maxW = Math.min(360, canvas.width - 60);
    const lines = wrapTextLines('"' + text + '"', maxW);
    let ly = startY;
    for (const line of lines) {
      ctx.fillText(line, canvas.width / 2, ly);
      ly += 18;
    }
    ctx.fillStyle = '#fff';
  }

  function drawDead() {
    const abandoned = deathCause === 'abandon';

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText(abandoned ? 'RUN ABANDONED' : 'THE DARK TAKES YOU', canvas.width / 2, canvas.height / 2);

    ctx.font = '16px sans-serif';
    // Abandoning isn't being killed -- skip the "SLAIN BY" line and let
    // everything below sit one slot higher, in the space it would've used.
    const base = abandoned ? 0 : 26;
    if (!abandoned) {
      const killer = deathCause === 'boss' ? NAMES.boss : NAMES.enemy;
      ctx.fillText('SLAIN BY ' + killer.toUpperCase(), canvas.width / 2, canvas.height / 2 + base);
    }

    if (endlessMode) {

      ctx.fillText('Tap to return to the map', canvas.width / 2, canvas.height / 2 + base + 96);
    } else {

          }

        } else {
          drawOverheardLine(deathKekuLine.text, canvas.height / 2 + base + 82);

      }

  function drawVictory() {

  function drawShop() {

    const backH = 28;

    ctx.lineWidth = 1;
    ctx.strokeRect(shopBackBounds.x, shopBackBounds.y, backW, backH);

    ctx.font = 'bold 12px sans-serif';

  function drawMap() {
    const HEADER_HEIGHT = 216;

    // TEMPORARY diagnostic — logs once so we can see what's actually running in
    // this browser, including any TUNE overrides. Safe to remove once confirmed.
    if (!corridorDebugLogged) {
      corridorDebugLogged = true;
      console.log('CORRIDOR_FOV=' + TUNE.CORRIDOR_FOV, 'CORRIDOR_NEAR_Z=' + TUNE.CORRIDOR_NEAR_Z, 'CORRIDOR_SPACING=' + TUNE.CORRIDOR_SPACING, 'mapScroll=' + mapScroll);
      for (let i = 0; i < GALAXY_DATA.length; i++) {
        const p = projectGalaxy(i, mapScroll);
        const z = TUNE.CORRIDOR_NEAR_Z + i * TUNE.CORRIDOR_SPACING - mapScroll;
        console.log('i=' + i, 'z=' + z, 'scale=' + (p ? p.s.toFixed(3) : 'CULLED'));
      }
    }

    // The void is always pure black. Any light on screen is emitted by the
    // galaxies themselves via additive glows below — never a background fill.
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Header text starts below the SHOP/ENDLESS button row (bottom edge 40),
    // not above/behind it -- AFTERLIGHT is centered and wide enough on a
    // phone-width canvas to reach into the top-left button zone otherwise
    // (exactly what ENDLESS's extra width made visible: the title overlapping
    // the button row).
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('AFTERLIGHT', canvas.width / 2, 60);

    ctx.font = '14px sans-serif';
    ctx.fillText('LIGHT RECOVERED: ' + bankedMotes.toLocaleString(), canvas.width / 2, 82);

    const heldCount = galaxies.filter((g) => g === 1).length;
    ctx.font = '12px sans-serif';
    ctx.fillText('HELD: ' + heldCount + ' / ' + galaxies.length, canvas.width / 2, 100);
    ctx.fillText('DEEPEST HELD: ' + deepestHeld + '    BEST DEPTH: ' + bestDepth, canvas.width / 2, 116);
    ctx.fillText('FRAGMENTS KILLED: ' + fragmentsKilled, canvas.width / 2, 132);

    if (decayedGalaxyIndex !== -1) {
      ctx.fillStyle = 'rgba(255, 140, 140, 0.9)';
      ctx.font = '11px sans-serif';
      ctx.fillText('THE DARK TOOK ' + NAMES.galaxies[decayedGalaxyIndex].toUpperCase() + ' WHILE YOU WERE AWAY.', canvas.width / 2, 148);
      ctx.fillStyle = '#fff';
    }

    const shopBtnW = 64;
    const shopBtnH = 28;
    const shopBtnX = 14;   // top-left — top-right is the debug panel's toggle button
    const shopBtnY = 12;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(shopBtnX, shopBtnY, shopBtnW, shopBtnH);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(shopBtnX, shopBtnY, shopBtnW, shopBtnH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('SHOP', shopBtnX + shopBtnW / 2, shopBtnY + shopBtnH / 2 + 4);
    shopButtonBounds = { x: shopBtnX, y: shopBtnY, w: shopBtnW, h: shopBtnH };

    const endlessBtnW = 74;
    const endlessBtnH = 28;
    const endlessBtnX = shopBtnX + shopBtnW + 8;   // next to SHOP, same row
    const endlessBtnY = shopBtnY;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(endlessBtnX, endlessBtnY, endlessBtnW, endlessBtnH);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.strokeRect(endlessBtnX, endlessBtnY, endlessBtnW, endlessBtnH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('ENDLESS', endlessBtnX + endlessBtnW / 2, endlessBtnY + endlessBtnH / 2 + 4);
    endlessButtonBounds = { x: endlessBtnX, y: endlessBtnY, w: endlessBtnW, h: endlessBtnH };

    startButtons = [];
    const smallBtnW = 70;
    const smallBtnH = 24;
    const smallBtnGap = 10;
    const smallBtnY = 164;
    const exportX = canvas.width / 2 - smallBtnW - smallBtnGap / 2;
    const importX = canvas.width / 2 + smallBtnGap / 2;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(exportX, smallBtnY, smallBtnW, smallBtnH);
    ctx.fillRect(importX, smallBtnY, smallBtnW, smallBtnH);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.strokeRect(exportX, smallBtnY, smallBtnW, smallBtnH);
    ctx.strokeRect(importX, smallBtnY, smallBtnW, smallBtnH);
    ctx.fillStyle = '#fff';
    ctx.font = '11px sans-serif';
    ctx.fillText('Export', exportX + smallBtnW / 2, smallBtnY + smallBtnH / 2 + 4);
    ctx.fillText('Import', importX + smallBtnW / 2, smallBtnY + smallBtnH / 2 + 4);
    startButtons.push({ x: exportX, y: smallBtnY, w: smallBtnW, h: smallBtnH, action: 'export' });
    startButtons.push({ x: importX, y: smallBtnY, w: smallBtnW, h: smallBtnH, action: 'import' });

    if (currentTime < saveMessageUntil) {
      ctx.font = '11px sans-serif';
      ctx.fillText(saveMessage, canvas.width / 2, smallBtnY + smallBtnH + 16);
    }

    // ---- The corridor. Ported from the reference — do not reinterpret. ----
    const lastIndex = GALAXY_DATA.length - 1;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HEADER_HEIGHT, canvas.width, canvas.height - HEADER_HEIGHT);
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';

    for (let i = lastIndex; i >= 0; i--) {
      const p = projectGalaxy(i, mapScroll);
      if (!p) continue;

      const data = GALAXY_DATA[i];
      const lit = galaxies[i] === 1;
      const power = lit ? 1 : 0.10;

      if (p.glow > 0.5) {
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.glow);
        grd.addColorStop(0, mapHsla(data.hue, 90, 72, 0.85 * power));
        grd.addColorStop(0.18, mapHsla(data.hue, 88, 58, 0.42 * power));
        grd.addColorStop(0.55, mapHsla(data.hue, 85, 45, 0.10 * power));
        grd.addColorStop(1, mapHsla(data.hue, 80, 40, 0));
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.glow, 0, Math.PI * 2);
        ctx.fill();
      }

      if (p.core > 0.4) {
        ctx.fillStyle = lit ? mapHsla(data.hue, 95, 66, 1) : mapHsla(data.hue, 60, 30, 0.5);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.core * (lit ? 0.42 : 0.30), 0, Math.PI * 2);
        ctx.fill();
      }

      if (!lit && p.core > 3) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = mapHsla(data.hue, 55, 40, 0.55);
        ctx.lineWidth = Math.max(1, 1.6 * p.s);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.core * 0.55, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
      }
    }

    // Keku: an eleventh object beyond galaxy 10, at the true vanishing point.
    // Not a galaxy — no lit/dark state, no drift, not in the tap-select loop
    // below. His depth never gets close enough to be more than a hard point.
    const kekuZ = TUNE.CORRIDOR_NEAR_Z + TUNE.KEKU_WORLD_Z - mapScroll;
    let kekuScreen = null;
    if (kekuZ > 40) {
      const kekuScale = TUNE.CORRIDOR_FOV / kekuZ;
      const kx = canvas.width / 2;
      const ky = canvas.height / 2;
      const kGlow = TUNE.CORRIDOR_GLOW * kekuScale;
      const kCore = TUNE.CORRIDOR_CORE * kekuScale;
      if (kGlow > 0.5) {
        const grd = ctx.createRadialGradient(kx, ky, 0, kx, ky, kGlow);
        grd.addColorStop(0, 'rgba(255,255,255,0.95)');
        grd.addColorStop(0.12, 'rgba(240,244,255,0.55)');
        grd.addColorStop(0.45, 'rgba(180,200,255,0.14)');
        grd.addColorStop(1, 'rgba(120,150,255,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(kx, ky, kGlow, 0, Math.PI * 2);
        ctx.fill();
      }
      if (kCore > 0.4) {
        ctx.fillStyle = 'rgba(255,255,255,1)';
        ctx.beginPath();
        ctx.arc(kx, ky, kCore * 0.55, 0, Math.PI * 2);
        ctx.fill();
      }
      kekuScreen = { x: kx, y: ky, core: kCore };
    }

    ctx.restore();

    if (kekuScreen) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = '600 12px ui-monospace, monospace';
      ctx.fillText('KEKU', kekuScreen.x, kekuScreen.y + Math.max(kekuScreen.core * 0.55, 10) + 16);
    }

    const sp = projectGalaxy(selectedGalaxy, mapScroll);
    if (sp && sp.core > 2) {
      const pulse = 1 + Math.sin(currentTime / 380) * 0.06;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.core * 0.95 * pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    const spal = galaxyPalette(selectedGalaxy);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '600 15px ui-monospace, monospace';
    ctx.fillText(NAMES.galaxies[selectedGalaxy].toUpperCase(), canvas.width / 2, canvas.height - 92);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.font = '11px ui-monospace, monospace';
    ctx.fillText(spal.star + '  ·  ' + spal.element, canvas.width / 2, canvas.height - 72);

    const descendW = 140;
    const descendH = 34;
    const descendX = canvas.width / 2 - descendW / 2;
    const descendY = canvas.height - 56;

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(descendX, descendY, descendW, descendH);
    ctx.fillStyle = '#fff';
    ctx.font = '600 13px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(galaxies[selectedGalaxy] === 1 ? 'HOLD' : 'TAKE', canvas.width / 2, canvas.height - 34);

    descendBounds = { x: descendX, y: descendY, w: descendW, h: descendH };

    ctx.textAlign = 'left';
  }

  let lastTime = null;
  let currentTime = 0;

  function loop(timestamp) {
    try {
      if (lastTime === null) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      currentTime = timestamp;

      if (state === STATE.RUN && !paused && !debugPaused && !kekuMessageActive && !galaxyCardActive) {
        update(dt);
        updateWave(dt);
        updateKekuFragmentEffects(dt);
        // Frozen, not just unspawned: during the tell, whatever's still in
        // enemies[] simply doesn't get its AI/movement/contact-damage step.
        if (!kekuFragmentTellActive) updateEnemies(dt);
        updateBoss(dt);
        updateBullets(dt);
        updateElementalEffects(dt);
        updateParticles(dt);
        updateMotes(dt);
        if (shakeStrength > 0) {
          shakeStrength = Math.max(0, shakeStrength - (TUNE.SHAKE_KILL / (TUNE.SHAKE_DECAY_MS / 1000)) * dt);
        }
      }
      if (state === STATE.LEAP && !debugPaused && currentTime - leapStartTime >= LEAP_DURATION_MS) {
        state = STATE.VICTORY;
      }
      if (state === STATE.MAP && !debugPaused) {
        updateMapScroll();
      }
      syncAudioGain();
      draw();
      requestAnimationFrame(loop);
    } catch (err) {
      // Draw and STOP -- do not reschedule. Re-throwing every frame would
      // either spam-redraw the message or, if draw() itself is what's
      // throwing, never manage to show it at all.
      drawFatalError(err);
    }
  }

  if (openingSeen) {
    openMap();
  } else {
    state = STATE.OPENING;
  }
  requestAnimationFrame(loop);

  function setupDebugPanel() {
    const panel = document.createElement('div');
    panel.style.cssText = `
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      max-height: 100vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font: 12px monospace;
      padding: 10px;
      z-index: 9999;
      display: none;
      box-sizing: border-box;
    `;
    document.body.appendChild(panel);

    const title = document.createElement('div');
    title.textContent = 'DEV KIT (~ or 3-finger tap to toggle)';
    title.style.cssText = 'font-weight:bold; margin-bottom:8px;';
    panel.appendChild(title);

    const tabBar = document.createElement('div');
    tabBar.style.cssText = 'display:flex; gap:4px; margin-bottom:10px;';
    panel.appendChild(tabBar);

    const tuneTab = document.createElement('div');
    const namesTab = document.createElement('div');
    const saveTab = document.createElement('div');
    namesTab.style.display = 'none';
    saveTab.style.display = 'none';
    panel.appendChild(tuneTab);
    panel.appendChild(namesTab);
    panel.appendChild(saveTab);

    const tabButtons = [];
    function makeTabButton(label, target) {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.style.cssText = 'flex:1; padding:6px; background:rgba(255,255,255,0.15); color:#fff; border:none; cursor:pointer; font:12px monospace;';
      btn.onclick = () => {
        tuneTab.style.display = target === tuneTab ? 'block' : 'none';
        namesTab.style.display = target === namesTab ? 'block' : 'none';
        saveTab.style.display = target === saveTab ? 'block' : 'none';
        for (const b of tabButtons) b.style.background = b === btn ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.15)';
      };
      tabBar.appendChild(btn);
      tabButtons.push(btn);
      return btn;
    }
    const tuneTabBtn = makeTabButton('TUNE', tuneTab);
    makeTabButton('NAMES', namesTab);
    makeTabButton('SAVE', saveTab);
    tuneTabBtn.style.background = 'rgba(255,255,255,0.35)';

    // --- TUNE tab ---
    const overrideBanner = document.createElement('div');
    overrideBanner.textContent = 'TUNED VALUES ACTIVE — these override the source defaults';
    overrideBanner.style.cssText = 'display:none; background:rgba(255,200,0,0.2); color:#ffdd66; padding:6px; margin-bottom:8px; font-weight:bold; font-size:11px;';
    tuneTab.appendChild(overrideBanner);

    function anyTuneOverrideActive() {
      return Object.keys(TUNE_DEFAULTS).some((k) => TUNE[k] !== TUNE_DEFAULTS[k]);
    }
    function updateOverrideBanner() {
      overrideBanner.style.display = anyTuneOverrideActive() ? 'block' : 'none';
    }

    const muteRow = document.createElement('label');
    muteRow.style.cssText = 'display:flex; align-items:center; gap:6px; margin-bottom:10px; padding:6px; background:rgba(255,255,255,0.08); cursor:pointer;';
    const muteCheckbox = document.createElement('input');
    muteCheckbox.type = 'checkbox';
    muteCheckbox.checked = muted;
    muteCheckbox.onchange = () => setMuted(muteCheckbox.checked);
    const muteLabel = document.createElement('span');
    muteLabel.textContent = 'MUTE (all audio)';
    muteRow.appendChild(muteCheckbox);
    muteRow.appendChild(muteLabel);
    tuneTab.appendChild(muteRow);

    const resetBtn = document.createElement('button');
    resetBtn.textContent = 'RESET TO DEFAULTS';
    resetBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:10px; background:rgba(255,255,255,0.15); color:#fff; border:none;';
    tuneTab.appendChild(resetBtn);

    const sliderRefs = {};
    for (const key of Object.keys(TUNE)) {
      const value = TUNE[key];
      const max = value !== 0 ? Math.abs(value) * 4 : 10;
      const step = max / 200 || 0.01;

      const row = document.createElement('div');
      row.style.cssText = 'margin-bottom:8px;';

      const label = document.createElement('label');
      label.style.cssText = 'display:flex; justify-content:space-between;';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = key;
      const valueSpan = document.createElement('span');
      valueSpan.textContent = value;
      label.appendChild(nameSpan);
      label.appendChild(valueSpan);
      row.appendChild(label);

      const input = document.createElement('input');
      input.type = 'range';
      input.min = 0;
      input.max = max;
      input.step = step;
      input.value = value;
      input.style.cssText = 'width:100%;';
      input.oninput = () => {
        TUNE[key] = parseFloat(input.value);
        valueSpan.textContent = TUNE[key];
        saveTuneOverrides();
        updateOverrideBanner();
      };
      row.appendChild(input);

      tuneTab.appendChild(row);
      sliderRefs[key] = { input, valueSpan };
    }

    resetBtn.onclick = () => {
      for (const k of Object.keys(TUNE_DEFAULTS)) {
        TUNE[k] = TUNE_DEFAULTS[k];
        sliderRefs[k].input.value = TUNE[k];
        sliderRefs[k].valueSpan.textContent = TUNE[k];
      }
      try { localStorage.removeItem(TUNE_KEY); } catch (e) {}
      updateOverrideBanner();
    };

    updateOverrideBanner();

    function buildTuneCodeBlock(keys) {
      const lines = keys.map((k, i) => '    ' + k + ': ' + TUNE[k] + (i < keys.length - 1 ? ',' : ''));
      return '  const TUNE = {\n' + lines.join('\n') + '\n  };';
    }

    const copyCodeBtn = document.createElement('button');
    copyCodeBtn.textContent = 'Copy as code';
    copyCodeBtn.style.cssText = 'width:100%; padding:6px; margin-top:4px;';

    const copyChangedBtn = document.createElement('button');
    copyChangedBtn.textContent = 'Copy changed only';
    copyChangedBtn.style.cssText = 'width:100%; padding:6px; margin-top:4px;';

    const output = document.createElement('textarea');
    output.readOnly = true;
    output.style.cssText = 'width:100%; height:120px; margin-top:8px; font:11px monospace; box-sizing:border-box;';

    copyCodeBtn.onclick = () => {
      const text = buildTuneCodeBlock(Object.keys(TUNE));
      output.value = text;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    };

    copyChangedBtn.onclick = () => {
      const changed = Object.keys(TUNE).filter((k) => TUNE[k] !== TUNE_DEFAULTS[k]);
      const text = changed.length > 0 ? buildTuneCodeBlock(changed) : '  // no values changed from defaults';
      output.value = text;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    };

    tuneTab.appendChild(copyCodeBtn);
    tuneTab.appendChild(copyChangedBtn);
    tuneTab.appendChild(output);

    // --- NAMES tab ---
    const nameInputs = [];
    function makeNameRow(label, value, onChange) {
      const row = document.createElement('div');
      row.style.cssText = 'margin-bottom:8px;';
      const lbl = document.createElement('label');
      lbl.textContent = label;
      lbl.style.cssText = 'display:block; margin-bottom:2px;';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = value;
      input.style.cssText = 'width:100%; box-sizing:border-box; font:12px monospace;';
      input.oninput = () => onChange(input.value);
      row.appendChild(lbl);
      row.appendChild(input);
      namesTab.appendChild(row);
      nameInputs.push(input);
      return input;
    }

    for (let i = 0; i < NAMES.galaxies.length; i++) {
      makeNameRow('Galaxy ' + (i + 1), NAMES.galaxies[i], (v) => { NAMES.galaxies[i] = v; saveBank(); });
    }
    makeNameRow('Boss', NAMES.boss, (v) => { NAMES.boss = v; saveBank(); });
    makeNameRow('Enemy', NAMES.enemy, (v) => { NAMES.enemy = v; saveBank(); });

    function refreshNameInputs() {
      for (let i = 0; i < NAMES.galaxies.length; i++) nameInputs[i].value = NAMES.galaxies[i];
      nameInputs[NAMES.galaxies.length].value = NAMES.boss;
      nameInputs[NAMES.galaxies.length + 1].value = NAMES.enemy;
    }

    // --- SAVE tab: existing Export/Import plus dev tools ---
    const exportBtn = document.createElement('button');
    exportBtn.textContent = 'Export save';
    exportBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:6px;';
    exportBtn.onclick = exportSave;
    saveTab.appendChild(exportBtn);

    const importBtn = document.createElement('button');
    importBtn.textContent = 'Import save';
    importBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:12px;';
    importBtn.onclick = () => { importSave(); refreshNameInputs(); };
    saveTab.appendChild(importBtn);

    const wipeBtn = document.createElement('button');
    wipeBtn.textContent = 'Wipe save';
    wipeBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:6px; background:rgba(255,80,80,0.3); color:#fff; border:none;';
    wipeBtn.onclick = () => {
      if (!confirm('Wipe save? This cannot be undone.')) return;
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      bankedMotes = 0;
      galaxies = new Array(10).fill(0);
      deepestHeld = 0;
      NAMES = defaultNames();
      decayedGalaxyIndex = -1;
      saveBank();
      refreshNameInputs();
      saveMessage = 'Save wiped';
      saveMessageUntil = currentTime + 2000;
    };
    saveTab.appendChild(wipeBtn);

    const lightAllBtn = document.createElement('button');
    lightAllBtn.textContent = 'Light all galaxies';
    lightAllBtn.style.cssText = 'width:100%; padding:6px; margin-bottom:6px;';
    lightAllBtn.onclick = () => {
      for (let i = 0; i < galaxies.length; i++) galaxies[i] = 1;
      if (galaxies.length > deepestHeld) deepestHeld = galaxies.length;
      saveBank();
      saveMessage = 'All galaxies lit';
      saveMessageUntil = currentTime + 2000;
    };
    saveTab.appendChild(lightAllBtn);

    const motesRow = document.createElement('div');
    motesRow.style.cssText = 'display:flex; gap:4px; margin-top:4px;';
    const motesInput = document.createElement('input');
    motesInput.type = 'number';
    motesInput.min = 0;
    motesInput.value = bankedMotes;
    motesInput.style.cssText = 'flex:1; min-width:0; box-sizing:border-box; font:12px monospace;';
    const motesBtn = document.createElement('button');
    motesBtn.textContent = 'Set motes';
    motesBtn.style.cssText = 'padding:6px;';
    motesBtn.onclick = () => {
      const n = parseInt(motesInput.value, 10);
      if (!isNaN(n) && n >= 0) {
        bankedMotes = n;
        saveBank();
        saveMessage = 'Motes set';
        saveMessageUntil = currentTime + 2000;
      }
    };
    motesRow.appendChild(motesInput);
    motesRow.appendChild(motesBtn);
    saveTab.appendChild(motesRow);

    function togglePanel() {
      const opening = panel.style.display === 'none';
      panel.style.display = opening ? 'block' : 'none';
      debugPaused = opening;
    }

    const toggleBtn = document.createElement('button');
    toggleBtn.textContent = '•••';
    toggleBtn.style.cssText = `
      position: fixed;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      color: #fff;
      font: 16px sans-serif;
      z-index: 10000;
    `;
    toggleBtn.addEventListener('click', togglePanel);
    document.body.appendChild(toggleBtn);

    window.addEventListener('keydown', (e) => {
      if (e.key === '~' || e.code === 'Backquote') togglePanel();
    });
  }

  if (DEBUG) setupDebugPanel();

  } catch (err) {
    drawFatalError(err);
  }
</script>
</body>
</html>
