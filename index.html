<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Afterlight</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const DEBUG = true;

  const TUNE = {
    SPEED: 195,
    RESPONSE_TURN: 0.22,   // gentle turns: weight and carve
    RESPONSE_SNAP: 0.9,    // hard turns / reversals: near-instant
    SNAP_ANGLE: 1.4,       // radians (~80deg). At/above this, use full SNAP.
    DEADZONE: 2,
    TURN_RATE: 0.15,
    PULSE_DURATION: 180,
    MARGIN: 24,
    ENEMY_SPEED: 110,
    ENEMY_TURN: 0.045,     // LOW. The enemy commits to a heading and
                           // overshoots when the player cuts across it.
    SPAWN_INTERVAL: 1.2,   // seconds between spawns
    MAX_ENEMIES: 85,
    SEPARATION_RADIUS: 28, // px — how close before they push apart
    CHASE_WEIGHT: 1.0,
    SEPARATION_WEIGHT: 1.2, // higher = they spread more, chase less
    PLAYER_RADIUS: 14,
    ENEMY_RADIUS: 9,
    CHASE_WEIGHT_TOUCHING: 0.6, // lower pull once already at contact — press, don't grind
    PLAYER_MAX_HP: 100,
    CONTACT_DPS: 12,
    FIRE_RATE: 0.45,
    BULLET_SPEED: 520,
    BULLET_DAMAGE: 10,
    ENEMY_MAX_HP: 10,
    BULLET_RADIUS: 4,
    TARGET_DROP_RANGE: 420, // px — drop target beyond this
    HIT_FLASH_MS: 60,
    KNOCKBACK: 40,
    SHAKE_KILL: 1.5,
    SHAKE_DECAY_MS: 80,
    DEATH_BURST_MS: 400,
    IMPACT_SPARK_MS: 120,
    TRAIL_LENGTH: 10,
    THUMB_OFFSET: 15
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    angle: -Math.PI / 2,
    hp: TUNE.PLAYER_MAX_HP
  };
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;

  let gameOver = false;

  function spawnEnemy() {
    const pad = 40;
    const edge = Math.floor(Math.random() * 4);
    const speed = TUNE.ENEMY_SPEED * (0.9 + Math.random() * 0.2);   // +/-10%
    const turn = TUNE.ENEMY_TURN * (0.85 + Math.random() * 0.3);
    const hp = TUNE.ENEMY_MAX_HP;
    if (edge === 0) return { x: Math.random() * canvas.width, y: -pad, vx: 0, vy: 0, angle: 0, speed, turn, hp };
    if (edge === 1) return { x: canvas.width + pad, y: Math.random() * canvas.height, vx: 0, vy: 0, angle: 0, speed, turn, hp };
    if (edge === 2) return { x: Math.random() * canvas.width, y: canvas.height + pad, vx: 0, vy: 0, angle: 0, speed, turn, hp };
    return { x: -pad, y: Math.random() * canvas.height, vx: 0, vy: 0, angle: 0, speed, turn, hp };
  }

  const enemies = [];
  let spawnTimer = 0;

  const bullets = [];
  let fireTimer = 0;
  let currentTarget = null;

  const particles = [];
  let shakeStrength = 0;

  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = true; break;
      case 's': case 'S': case 'ArrowDown': keys.down = true; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = true; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.key) {
      case 'w': case 'W': case 'ArrowUp': keys.up = false; break;
      case 's': case 'S': case 'ArrowDown': keys.down = false; break;
      case 'a': case 'A': case 'ArrowLeft': keys.left = false; break;
      case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
    }
  });

  let dragging = false;
  let originX = 0;
  let originY = 0;
  let fingerX = 0;
  let fingerY = 0;
  let touchStartTime = 0;

  const trail = [];

  function restart() {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    player.vx = 0;
    player.vy = 0;
    player.angle = -Math.PI / 2;
    player.hp = TUNE.PLAYER_MAX_HP;
    enemies.length = 0;
    spawnTimer = 0;
    trail.length = 0;
    bullets.length = 0;
    fireTimer = 0;
    currentTarget = null;
    particles.length = 0;
    shakeStrength = 0;
    gameOver = false;
  }

  function pointerDown(x, y) {
    if (gameOver) {
      restart();
      return;
    }
    dragging = true;
    originX = x;
    originY = y;
    fingerX = x;
    fingerY = y;
    touchStartTime = currentTime;
  }
  function pointerMove(x, y) {
    if (!dragging) return;
    fingerX = x;
    fingerY = y;
  }
  function pointerUp() {
    dragging = false;
  }

  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    const t = e.changedTouches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchend', pointerUp);
  canvas.addEventListener('touchcancel', pointerUp);

  canvas.addEventListener('mousedown', (e) => {
    pointerDown(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    pointerMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', pointerUp);

  function getKeyVector() {
    let ix = 0, iy = 0;

    if (keys.up) iy -= 1;
    if (keys.down) iy += 1;
    if (keys.left) ix -= 1;
    if (keys.right) ix += 1;

    const len = Math.hypot(ix, iy);
    if (len > 1) {
      ix /= len;
      iy /= len;
    }

    return { x: ix, y: iy };
  }

  function update(dt) {
    let targetX = 0;
    let targetY = 0;

    if (dragging) {
      const toX = fingerX - originX;
      const toY = fingerY - originY;
      const len = Math.hypot(toX, toY);
      if (len > TUNE.DEADZONE) {
        targetX = (toX / len) * TUNE.SPEED;
        targetY = (toY / len) * TUNE.SPEED;
      }
    } else {
      const key = getKeyVector();
      targetX = key.x * TUNE.SPEED;
      targetY = key.y * TUNE.SPEED;
    }

    const curLen = Math.hypot(player.vx, player.vy);
    const targetLen = Math.hypot(targetX, targetY);
    let angleBetween = 0;
    if (curLen > 0.001 && targetLen > 0.001) {
      const dot = (player.vx * targetX + player.vy * targetY) / (curLen * targetLen);
      angleBetween = Math.acos(Math.max(-1, Math.min(1, dot)));
    }
    const t = Math.min(Math.max(angleBetween / TUNE.SNAP_ANGLE, 0), 1);
    const response = TUNE.RESPONSE_TURN + (TUNE.RESPONSE_SNAP - TUNE.RESPONSE_TURN) * t;

    player.vx += (targetX - player.vx) * response;
    player.vy += (targetY - player.vy) * response;

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > TUNE.SPEED) {
      player.vx = (player.vx / speed) * TUNE.SPEED;
      player.vy = (player.vy / speed) * TUNE.SPEED;
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.x <= TUNE.MARGIN || player.x >= window.innerWidth - TUNE.MARGIN) {
      player.vx = 0;
    }
    player.x = Math.max(TUNE.MARGIN, Math.min(window.innerWidth - TUNE.MARGIN, player.x));

    if (player.y <= TUNE.MARGIN || player.y >= window.innerHeight - TUNE.MARGIN) {
      player.vy = 0;
    }
    player.y = Math.max(TUNE.MARGIN, Math.min(window.innerHeight - TUNE.MARGIN, player.y));

    if (speed > 0.001) {
      const targetAngle = Math.atan2(player.vy, player.vx);
      let diff = ((targetAngle - player.angle + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      player.angle += diff * TUNE.TURN_RATE;
    }

    trail.push({ x: player.x, y: player.y });
    if (trail.length > TUNE.TRAIL_LENGTH) trail.shift();
  }

  function cellKey(cx, cy) {
    return cx + ',' + cy;
  }

  function buildGrid() {
    const grid = new Map();
    for (const e of enemies) {
      const key = cellKey(Math.floor(e.x / TUNE.SEPARATION_RADIUS), Math.floor(e.y / TUNE.SEPARATION_RADIUS));
      let bucket = grid.get(key);
      if (!bucket) {
        bucket = [];
        grid.set(key, bucket);
      }
      bucket.push(e);
    }
    return grid;
  }

  function separationFor(enemy, grid) {
    let sepX = 0;
    let sepY = 0;
    const cx = Math.floor(enemy.x / TUNE.SEPARATION_RADIUS);
    const cy = Math.floor(enemy.y / TUNE.SEPARATION_RADIUS);

    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        const bucket = grid.get(cellKey(gx, gy));
        if (!bucket) continue;
        for (const other of bucket) {
          if (other === enemy) continue;
          const ox = enemy.x - other.x;
          const oy = enemy.y - other.y;
          const odist = Math.hypot(ox, oy);
          if (odist > 0.001 && odist < TUNE.SEPARATION_RADIUS) {
            const strength = 1 - odist / TUNE.SEPARATION_RADIUS;
            const weight = strength * strength;   // squared falloff — soft near the edge
            sepX += (ox / odist) * weight;
            sepY += (oy / odist) * weight;
          }
        }
      }
    }

    const sepLen = Math.hypot(sepX, sepY);
    if (sepLen > 1) {
      sepX /= sepLen;
      sepY /= sepLen;
    }
    return { x: sepX, y: sepY };
  }

  function updateEnemies(dt) {
    spawnTimer += dt;
    if (spawnTimer >= TUNE.SPAWN_INTERVAL && enemies.length < TUNE.MAX_ENEMIES) {
      spawnTimer = 0;
      enemies.push(spawnEnemy());
    }

    const grid = buildGrid();

    for (const enemy of enemies) {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const dlen = Math.hypot(dx, dy);

      let chaseX = 0;
      let chaseY = 0;
      if (dlen > 0.001) {
        chaseX = dx / dlen;
        chaseY = dy / dlen;
      }

      const sep = separationFor(enemy, grid);

      const touchDist = TUNE.PLAYER_RADIUS + TUNE.ENEMY_RADIUS;
      const chaseWeight = dlen <= touchDist ? TUNE.CHASE_WEIGHT_TOUCHING : TUNE.CHASE_WEIGHT;

      let desiredX = chaseX * chaseWeight + sep.x * TUNE.SEPARATION_WEIGHT;
      let desiredY = chaseY * chaseWeight + sep.y * TUNE.SEPARATION_WEIGHT;
      const desiredLen = Math.hypot(desiredX, desiredY);
      if (desiredLen > 0.001) {
        desiredX /= desiredLen;
        desiredY /= desiredLen;
      }

      const targetX = desiredX * enemy.speed;
      const targetY = desiredY * enemy.speed;

      enemy.vx += (targetX - enemy.vx) * enemy.turn;
      enemy.vy += (targetY - enemy.vy) * enemy.turn;

      const speed = Math.hypot(enemy.vx, enemy.vy);
      if (speed > enemy.speed) {
        enemy.vx = (enemy.vx / speed) * enemy.speed;
        enemy.vy = (enemy.vy / speed) * enemy.speed;
      }

      enemy.x += enemy.vx * dt;
      enemy.y += enemy.vy * dt;

      const pdx = enemy.x - player.x;
      const pdy = enemy.y - player.y;
      const pdist = Math.hypot(pdx, pdy);
      if (pdist < touchDist) {
        if (pdist > 0.001) {
          enemy.x = player.x + (pdx / pdist) * touchDist;
          enemy.y = player.y + (pdy / pdist) * touchDist;
        } else {
          enemy.x = player.x + touchDist;
          enemy.y = player.y;
        }

        player.hp -= TUNE.CONTACT_DPS * dt;
        if (player.hp <= 0) {
          player.hp = 0;
          gameOver = true;
        }
      }

      if (speed > 0.001) {
        enemy.angle = Math.atan2(enemy.vy, enemy.vx);
      }
    }
  }

  function nearestEnemy() {
    let nearest = null;
    let nearestDist = Infinity;
    for (const enemy of enemies) {
      const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearest = enemy;
      }
    }
    return nearest;
  }

  function acquireTarget() {
    if (currentTarget && !currentTarget.dead) {
      const dist = Math.hypot(currentTarget.x - player.x, currentTarget.y - player.y);
      if (dist <= TUNE.TARGET_DROP_RANGE) {
        return currentTarget;
      }
    }
    currentTarget = nearestEnemy();
    return currentTarget;
  }

  function segmentHitsCircle(px, py, nx, ny, cx, cy, r) {
    const dx = nx - px, dy = ny - py;
    const fx = px - cx, fy = py - cy;
    const a = dx * dx + dy * dy;
    if (a < 0.0001) return (fx * fx + fy * fy) <= r * r;
    let t = -(fx * dx + fy * dy) / a;
    t = Math.max(0, Math.min(1, t));
    const cxp = px + dx * t - cx;
    const cyp = py + dy * t - cy;
    return (cxp * cxp + cyp * cyp) <= r * r;
  }

  function spawnParticle(x, y, vx, vy, life, color, size) {
    particles.push({ x, y, vx, vy, born: currentTime, life, color, size });
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      if (currentTime - particles[i].born >= particles[i].life) particles.splice(i, 1);
    }
  }

  function updateBullets(dt) {
    fireTimer += dt;
    if (fireTimer >= TUNE.FIRE_RATE) {
      const target = acquireTarget();
      if (target) {
        fireTimer = 0;

        const rx = target.x - player.x;
        const ry = target.y - player.y;
        const rvx = target.vx;
        const rvy = target.vy;

        const a = rvx * rvx + rvy * rvy - TUNE.BULLET_SPEED * TUNE.BULLET_SPEED;
        const b = 2 * (rx * rvx + ry * rvy);
        const c = rx * rx + ry * ry;

        let t;
        if (Math.abs(a) < 0.0001) {
          t = -c / b;
        } else {
          const disc = b * b - 4 * a * c;
          if (disc < 0) {
            t = 0;
          } else {
            const sq = Math.sqrt(disc);
            const t1 = (-b + sq) / (2 * a);
            const t2 = (-b - sq) / (2 * a);
            t = Math.min(t1 > 0 ? t1 : Infinity, t2 > 0 ? t2 : Infinity);
            if (!isFinite(t)) t = 0;
          }
        }

        const tx = target.x + rvx * t;
        const ty = target.y + rvy * t;

        const dx = tx - player.x;
        const dy = ty - player.y;
        const len = Math.hypot(dx, dy) || 1;

        bullets.push({
          x: player.x,
          y: player.y - TUNE.THUMB_OFFSET,
          vx: (dx / len) * TUNE.BULLET_SPEED,
          vy: (dy / len) * TUNE.BULLET_SPEED
        });
      }
    }

    for (const bullet of bullets) {
      const px = bullet.x;
      const py = bullet.y;
      const nx = bullet.x + bullet.vx * dt;
      const ny = bullet.y + bullet.vy * dt;

      let closest = null;
      let closestDist = Infinity;
      for (const enemy of enemies) {
        if (enemy.dead) continue;
        if (segmentHitsCircle(px, py, nx, ny, enemy.x, enemy.y, TUNE.BULLET_RADIUS + TUNE.ENEMY_RADIUS)) {
          const dist = Math.hypot(enemy.x - px, enemy.y - py);
          if (dist < closestDist) {
            closestDist = dist;
            closest = enemy;
          }
        }
      }

      bullet.x = nx;
      bullet.y = ny;

      if (closest) {
        closest.hp -= TUNE.BULLET_DAMAGE;
        closest.flashUntil = currentTime + TUNE.HIT_FLASH_MS;

        const blen = Math.hypot(bullet.vx, bullet.vy) || 1;
        closest.x += (bullet.vx / blen) * TUNE.KNOCKBACK;
        closest.y += (bullet.vy / blen) * TUNE.KNOCKBACK;

        spawnParticle(nx, ny, 0, 0, TUNE.IMPACT_SPARK_MS, '255,255,255', 3);

        bullet.dead = true;

        if (closest.hp <= 0) {
          closest.dead = true;
          shakeStrength = TUNE.SHAKE_KILL;

          const count = 6 + Math.floor(Math.random() * 3);
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const burstSpeed = 60 + Math.random() * 80;
            spawnParticle(closest.x, closest.y, Math.cos(angle) * burstSpeed, Math.sin(angle) * burstSpeed, TUNE.DEATH_BURST_MS, '255,0,0', 2.5);
          }

          if (navigator.vibrate) navigator.vibrate(10);
        }
      } else if (nx < 0 || nx > canvas.width || ny < 0 || ny > canvas.height) {
        bullet.dead = true;
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      if (bullets[i].dead) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      if (enemies[i].dead) enemies.splice(i, 1);
    }
  }

  function draw() {
    const shakeX = (Math.random() * 2 - 1) * shakeStrength;
    const shakeY = (Math.random() * 2 - 1) * shakeStrength;
    ctx.save();
    ctx.translate(shakeX, shakeY);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const age = (i + 1) / trail.length;
      ctx.fillStyle = `rgba(255, 255, 255, ${age * 0.35})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y - TUNE.THUMB_OFFSET, 6 * age, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const enemy of enemies) {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.rotate(enemy.angle);

      ctx.fillStyle = currentTime < enemy.flashUntil ? '#fff' : '#f00';
      ctx.beginPath();
      ctx.moveTo(13, 0);
      ctx.lineTo(-10, 8);
      ctx.lineTo(-10, -8);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    ctx.fillStyle = '#fff';
    for (const bullet of bullets) {
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, TUNE.BULLET_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const p of particles) {
      const alpha = Math.max(0, 1 - (currentTime - p.born) / p.life);
      ctx.fillStyle = `rgba(${p.color}, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(player.x, player.y - TUNE.THUMB_OFFSET);
    ctx.rotate(player.angle);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-12, 10);
    ctx.lineTo(-12, -10);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    if (dragging) {
      const pulseT = Math.min((currentTime - touchStartTime) / TUNE.PULSE_DURATION, 1);
      const ringRadius = 40 + (1 - pulseT) * 30;
      const ringAlpha = 0.25 + (1 - pulseT) * 0.35;

      ctx.strokeStyle = `rgba(255, 255, 255, ${ringAlpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(originX, originY, ringRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(fingerX, fingerY, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    const barX = 20;
    const barY = 20;
    const barWidth = 200;
    const barHeight = 16;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(barX, barY, barWidth, barHeight);

    ctx.fillStyle = '#f00';
    ctx.fillRect(barX, barY, barWidth * (player.hp / TUNE.PLAYER_MAX_HP), barHeight);

    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText('THE DARK TAKES YOU', canvas.width / 2, canvas.height / 2);

      ctx.font = '16px sans-serif';
      ctx.fillText('Tap to restart', canvas.width / 2, canvas.height / 2 + 36);
    }

    ctx.restore();
  }

  let lastTime = null;
  let currentTime = 0;

  function loop(timestamp) {
    if (lastTime === null) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    currentTime = timestamp;

    if (!gameOver) {
      update(dt);
      updateEnemies(dt);
      updateBullets(dt);
      updateParticles(dt);
      if (shakeStrength > 0) {
        shakeStrength = Math.max(0, shakeStrength - (TUNE.SHAKE_KILL / (TUNE.SHAKE_DECAY_MS / 1000)) * dt);
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  function setupDebugPanel() {
    const panel = document.createElement('div');
    panel.style.cssText = `
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      max-height: 100vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font: 12px monospace;
      padding: 10px;
      z-index: 9999;
      display: none;
      box-sizing: border-box;
    `;
    document.body.appendChild(panel);

    const title = document.createElement('div');
    title.textContent = 'TUNE (~ or 3-finger tap to toggle)';
    title.style.cssText = 'font-weight:bold; margin-bottom:8px;';
    panel.appendChild(title);

    for (const key of Object.keys(TUNE)) {
      const value = TUNE[key];
      const max = value !== 0 ? Math.abs(value) * 4 : 10;
      const step = max / 200 || 0.01;

      const row = document.createElement('div');
      row.style.cssText = 'margin-bottom:8px;';

      const label = document.createElement('label');
      label.style.cssText = 'display:flex; justify-content:space-between;';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = key;
      const valueSpan = document.createElement('span');
      valueSpan.textContent = value;
      label.appendChild(nameSpan);
      label.appendChild(valueSpan);
      row.appendChild(label);

      const input = document.createElement('input');
      input.type = 'range';
      input.min = 0;
      input.max = max;
      input.step = step;
      input.value = value;
      input.style.cssText = 'width:100%;';
      input.oninput = () => {
        TUNE[key] = parseFloat(input.value);
        valueSpan.textContent = TUNE[key];
      };
      row.appendChild(input);

      panel.appendChild(row);
    }

    const copyBtn = document.createElement('button');
    copyBtn.textContent = 'Copy values';
    copyBtn.style.cssText = 'width:100%; padding:6px; margin-top:4px;';

    const output = document.createElement('textarea');
    output.readOnly = true;
    output.style.cssText = 'width:100%; height:120px; margin-top:8px; font:11px monospace; box-sizing:border-box;';

    copyBtn.onclick = () => {
      const text = Object.keys(TUNE).map((k) => `const ${k} = ${TUNE[k]};`).join('\n');
      output.value = text;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    };

    panel.appendChild(copyBtn);
    panel.appendChild(output);

    function togglePanel() {
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    const toggleBtn = document.createElement('button');
    toggleBtn.textContent = '•••';
    toggleBtn.style.cssText = `
      position: fixed;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      color: #fff;
      font: 16px sans-serif;
      z-index: 10000;
    `;
    toggleBtn.addEventListener('click', togglePanel);
    document.body.appendChild(toggleBtn);

    window.addEventListener('keydown', (e) => {
      if (e.key === '~' || e.code === 'Backquote') togglePanel();
    });
  }

  if (DEBUG) setupDebugPanel();
</script>
</body>
</html>
